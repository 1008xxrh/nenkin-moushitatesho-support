// ---- ch7_fragment_board：断片の追加・一覧・編集・削除。過去編の中心画面（Phase4仕様書3.2） ----
function renderPastFragmentList(){
  const listEl = document.getElementById('pastFragmentList');
  if(!listEl) return;
  // 新しい順（createdAt降順）。Phase4仕様書3.2.5。
  const sorted = [...state.pastFragments].sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  if(sorted.length===0){
    listEl.innerHTML = '<p class="small">まだありません。下のフォームから置いてみてください。</p>';
    return;
  }
  listEl.innerHTML = sorted.map(f=>{
    const isExpanded = state.editingPastFragmentId === f.id;
    if(!isExpanded){
      return `
        <div class="timeline-row" style="flex-direction:column;align-items:flex-start;" data-fragment-card="${f.id}">
          <span>${esc(f.text)}</span>
        </div>`;
    }
    // 展開時：編集フォーム。断片＝自作出来事カードという位置づけのため、出来事カードと同じく
    // 「内容（text）」のみを編集対象とする（時期・状況の補足・病院リンクは持たせない。
    // 時期の管理はch5_place（出来事の配置を直す）に一本化されている）。
    return `
      <div class="card" style="margin:10px 0;padding:14px;" data-fragment-card="${f.id}">
        <label class="field-label">内容</label>
        <textarea data-field="text" data-id="${f.id}">${esc(f.text)}</textarea>
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button type="button" data-save-fragment="${f.id}" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--accent-strong);color:#fff;cursor:pointer;">編集を保存</button>
          <button type="button" data-delete-fragment="${f.id}" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);cursor:pointer;">削除</button>
        </div>
        <button type="button" class="link-btn" data-collapse-fragment="${f.id}" style="margin-top:8px;">閉じる</button>
      </div>`;
  }).join('');

  // カード本体クリックで展開（編集中でないカードのみ）
  listEl.querySelectorAll('[data-fragment-card]').forEach(card=>{
    const id = card.getAttribute('data-fragment-card');
    if(state.editingPastFragmentId === id) return;
    card.style.cursor = 'pointer';
    card.onclick = ()=>{
      state.editingPastFragmentId = id;
      renderPastFragmentList();
    };
  });

  // 展開フォーム内の各フィールド
  listEl.querySelectorAll('[data-field="text"]').forEach(el=>{
    el.onclick = e=>e.stopPropagation();
  });
  listEl.querySelectorAll('[data-save-fragment]').forEach(btn=>{
    btn.onclick = e=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-save-fragment');
      const card = listEl.querySelector(`[data-fragment-card="${id}"]`);
      const text = card.querySelector('[data-field="text"]').value;
      const ok = updatePastFragment(id, {text});
      if(ok){
        state.editingPastFragmentId = null;
        saveStateToStorage();
        renderPastFragmentList();
      }
    };
  });
  listEl.querySelectorAll('[data-delete-fragment]').forEach(btn=>{
    btn.onclick = e=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-delete-fragment');
      // confirmあり（GPT方針：再現コストが高いため出来事カードより慎重に）
      const ok = confirm('この断片を削除します。よろしいですか？');
      if(!ok) return;
      deletePastFragment(id);
      // 配置情報も削除しておく（存在しない断片の配置が残らないように。出来事カード削除時と同じ対応）
      delete state.eventPlacements[id];
      if(state.editingPastFragmentId === id) state.editingPastFragmentId = null;
      saveStateToStorage();
      renderPastFragmentList();
    };
  });
  listEl.querySelectorAll('[data-collapse-fragment]').forEach(btn=>{
    btn.onclick = e=>{
      e.stopPropagation();
      state.editingPastFragmentId = null;
      renderPastFragmentList();
    };
  });
}

// 2026-08-10追記（決定#65）：optional-noticeの文言をフォーム版・会話形式版で「答えなくても
// 次に進めます」に統一した（以前は会話形式だけ「ひとつずつお聞きします。〜」という異なる文言で、
// スキップして戻った後にフォーム版の「入力しなくても進めます」に変わり、表現の一貫性が
// なかったため）。あわせて、この文言の末尾に「残りをとばす」リンクをインラインで追加
// （冒頭側＝まだ答えていない人向け）。スレッド末尾の同機能リンク（下部側＝数問答えた後で
// 「もう十分」と思った人向け）はそのまま残し、太字・右寄せにして見つけやすくした（同じく決定#65）。
// 2026-08-10追記（決定#67）：直後の続報で、上記の統一が3画面（仕事の内容・仕事をしていない
// 理由・ADL）にしか及んでいなかったことが判明。「入力しなくても進めます」がindex.html内の
// 他の画面（通院記録・当時の生活手がかり・ch2_other等）に7箇所残っていたため、全て同じ
// 「答えなくても次に進めます」へ統一した（アプリ全体での表現統一）。
// 初回入力用の会話形式（1問ずつ）。質問は既存フォームと同じ5項目・同じ選択肢を使う。
const CH2_WORK_DETAIL_STEPS = [
  {key:'jobType', type:'text', q:'今の仕事の内容を教えてください', sub:'職種やお仕事の内容を、短くで大丈夫です。', placeholder:'例：事務職、清掃業、接客業'},
  {key:'commute', type:'chips-multi', q:'通勤方法を教えてください', sub:'あてはまるものを、いくつでも選んでください。', options:COMMUTE_METHOD},
  {key:'commuteTime', type:'chips-single', q:'片道の通勤時間は、どれくらいですか', sub:'一番近いものをタップしてください。', options:COMMUTE_TIME},
  {key:'workDays', type:'number', q:'先月の出勤日数は、およそ何日でしたか', sub:'覚えている範囲で大丈夫です。', placeholder:'例：18'},
  {key:'condition', type:'chips-multi', q:'仕事中や終わった後の、体や気持ちの状態を教えてください', sub:'あてはまるものを、いくつでも選んでください。', options:WORK_CONDITION}
];
let ch2WorkDetailConvIndex = 0;

function renderCh2WorkDetailConversation(){
  ch2WorkDetailConvIndex = 0;
  const changedNotice = workStatusChangedNoticeHtml();
  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>仕事の内容を教えてください</h2>
      <p class="optional-notice">答えなくても次に進めます　<a href="#" id="ch2ConvSkipTop" class="inline-skip-link">日常生活状況へ進む →</a></p>

      <div class="conv-thread" id="ch2ConvThread"></div>
      <div class="conv-current" id="ch2ConvCurrent"></div>

    </div>`;
  const ch2ConvSkipHandler = (e)=>{
    if(e) e.preventDefault();

// 現在の質問の吹き出し（ラベル・本文・補足）をスレッドに積み、入力コントロールを表示する
function renderCh2ConvStep(){
  const step = CH2_WORK_DETAIL_STEPS[ch2WorkDetailConvIndex];
  const thread = document.getElementById('ch2ConvThread');
  const label = document.createElement('div');
  label.className = 'conv-step-label';
  label.textContent = (ch2WorkDetailConvIndex+1) + ' / ' + CH2_WORK_DETAIL_STEPS.length;
  thread.appendChild(label);
  const bubble = document.createElement('div');
  bubble.className = 'conv-bot';
  bubble.textContent = step.q;
  thread.appendChild(bubble);
  if(step.sub){
    const sub = document.createElement('div');
    sub.className = 'conv-bot-sub';
    sub.textContent = step.sub;
    thread.appendChild(sub);
  }
  renderCh2ConvCurrentControl(step);
  setFooter({secondaryLabel:'戻る', secondaryFn:ch2ConvGoBack, primaryLabel:'次へ', primaryEnabled:true, primaryFn:ch2ConvNext});
}

// 質問タイプに応じた入力コントロール（テキスト／数値／チップ）を描画する。
// チップは既存のrenderChipGroupをそのまま使うため、選択肢・見た目・配列の扱いは元のフォームと同一。
function renderCh2ConvCurrentControl(step){
  const el = document.getElementById('ch2ConvCurrent');
  el.innerHTML = '';
  if(step.type==='text' || step.type==='number'){
    const input = document.createElement('input');
    input.type = step.type;
    input.id = 'ch2ConvInput';
    input.placeholder = step.placeholder || '';
    if(step.type==='number'){ input.min='0'; input.max='31'; }
    input.value = state.work[step.key] || '';
    el.appendChild(input);
    setTimeout(()=>input.focus(), 0);
  } else if(step.type==='chips-multi'){
    const box = document.createElement('div');
    box.className = 'chip-group';
    box.id = 'ch2ConvChips';
    el.appendChild(box);
    renderChipGroup('ch2ConvChips', step.options, state.work[step.key], true, ()=>{});
  } else if(step.type==='chips-single'){
    const box = document.createElement('div');
    box.className = 'chip-group';
    box.id = 'ch2ConvChips';
    el.appendChild(box);
    const selected = state.work[step.key] ? [state.work[step.key]] : [];
    renderChipGroup('ch2ConvChips', step.options, selected, false, v=>{ state.work[step.key] = v; });
  }
}

// 現在の質問がテキスト／数値入力の場合、画面上の値をstate.workへ確定する。
// チップ選択（複数/単一）は選んだ瞬間にstate側へ反映済みのため、ここでは何もしない。
// 「次へ」だけでなく「残りはとばす」からも呼ぶことで、入力途中の値が消えないようにする。
function ch2ConvCommitCurrentTextValue(){
  const step = CH2_WORK_DETAIL_STEPS[ch2WorkDetailConvIndex];
  if(step.type==='text' || step.type==='number'){
    const input = document.getElementById('ch2ConvInput');
    if(input) state.work[step.key] = input.value.trim();
  }
}

// 「次へ」：現在の質問の回答をstate.workへ確定し、回答の吹き出しをスレッドに積んでから次の質問へ。
// 最後の質問まで終えたら、フォーム版と同じくfinishChapter('ch1','ch2_intro')で第1章を完了する。
function ch2ConvNext(){
  const step = CH2_WORK_DETAIL_STEPS[ch2WorkDetailConvIndex];
  ch2ConvCommitCurrentTextValue();
  let display, isSkip;
  if(step.type==='text' || step.type==='number'){
    const val = state.work[step.key];
    display = val || '（今回はスキップ）';
    isSkip = !val;
  } else {
    const val = state.work[step.key];
    const arr = Array.isArray(val) ? val : (val ? [val] : []);
    display = arr.length ? arr.join('、') : '（今回はスキップ）';
    isSkip = arr.length===0;
  }
  const thread = document.getElementById('ch2ConvThread');
  const answerBubble = document.createElement('div');
  answerBubble.className = 'conv-user' + (isSkip ? ' skip' : '');
  answerBubble.textContent = display;
  thread.appendChild(answerBubble);

  if(ch2WorkDetailConvIndex < CH2_WORK_DETAIL_STEPS.length - 1){
    ch2WorkDetailConvIndex++;
    renderCh2ConvStep();
  } else {
    // 2026-08-04: 会話形式でも、5問目の回答確定と同時に第1章の完了フラグを立てる（フォーム版と同じタイミング）
    finishChapter('ch1', 'ch2_intro');
  }
}

// 「戻る」：会話の途中（2問目以降）なら1つ前の質問に戻って答え直せるようにする。
// 1問目まで戻ったら、通常のgoBack()（画面を出る）に委ねる。
function ch2ConvGoBack(){
  if(ch2WorkDetailConvIndex > 0){
    const thread = document.getElementById('ch2ConvThread');
    const curStep = CH2_WORK_DETAIL_STEPS[ch2WorkDetailConvIndex];
    if(curStep.sub) thread.lastElementChild.remove(); // 現在の質問の補足
    thread.lastElementChild.remove(); // 現在の質問の本文
    thread.lastElementChild.remove(); // 現在の質問のラベル（N/5）
    thread.lastElementChild.remove(); // ひとつ前の質問への回答吹き出し
    ch2WorkDetailConvIndex--;
    renderCh2ConvCurrentControl(CH2_WORK_DETAIL_STEPS[ch2WorkDetailConvIndex]);
    setFooter({secondaryLabel:'戻る', secondaryFn:ch2ConvGoBack, primaryLabel:'次へ', primaryEnabled:true, primaryFn:ch2ConvNext});
  } else {
    goBack();
  }
}

  setFooter({secondaryLabel:'戻る', secondaryFn:ch2ReasonGoBack});
}

// はい/いいえの回答をstate.notWorkReasonsへ反映する（新規回答時・過去の回答の
// トグルボタンで選び直したとき、どちらからも呼ぶ共通処理）。
function applyReasonAnswer(reason, isYes){
  if(isYes){
    if(!state.notWorkReasons.includes(reason)) state.notWorkReasons.push(reason);
  } else {
    state.notWorkReasons = state.notWorkReasons.filter(r=>r!==reason);
  }
}

// 「はい」「いいえ」をタップした瞬間の処理。選んだ内容をstate.notWorkReasonsへ確定し、
// 回答の吹き出しを積んだうえで、即座に次の質問（または完了）へ進む。
// 「次へ」の別タップを挟まないのが、この会話形式の要（8/6の検討で決定）。
//
// 2026-08-06追加：過去に答えた質問は、はい/いいえの吹き出しをタップで反転…ではなく、
// 「はい」「いいえ」を常に2つ並べて表示し、選んでいる方だけ色を反転させる方式にした
// （単一の吹き出しをタップして反転させる案は「今どちらを選んでいるか・タップで何が
// 変わったか」が分かりにくいとの指摘を受けて変更。詳細はセッションまとめ参照）。
// 「その他」だけは自由記述欄の出し引きが絡み、その場での変更だと整合が崩れるため対象外とし、
// 従来通り「戻る」（ch2ReasonGoBack）での訂正に一本化している。
function ch2ReasonAnswer(val){
  const step = CH2_NOTWORK_STEPS[ch2NotworkConvIndex];
  const isYes = val==='yes';
  applyReasonAnswer(step.reason, isYes);
  const thread = document.getElementById('ch2ReasonThread');
  if(step.reason === 'その他'){
    const answerBubble = document.createElement('div');
    answerBubble.className = 'conv-user';
    answerBubble.textContent = isYes ? 'はい' : 'いいえ';
    thread.appendChild(answerBubble);
  } else {
    thread.appendChild(buildReasonAnswerToggle(step.reason));
  }

  if(step.reason==='その他' && isYes){
    renderCh2ReasonOtherTextStep();
    return;
  }
  ch2ReasonAdvance();
}

// 過去に答えた質問を、「はい」「いいえ」の2つのボタンとして表示する。選んでいる方だけ
// 色を反転させ、もう一方をタップすればその場で選び直せる（戻る操作は不要）。
function buildReasonAnswerToggle(reason){
  const wrap = document.createElement('div');
  wrap.className = 'conv-user-toggle';
  const yesBtn = document.createElement('button');
  yesBtn.type = 'button';
  yesBtn.textContent = 'はい';
  const noBtn = document.createElement('button');
  noBtn.type = 'button';
  noBtn.textContent = 'いいえ';
  function refresh(){
    const isYes = state.notWorkReasons.includes(reason);
    yesBtn.className = 'conv-user-toggle-btn' + (isYes ? ' selected' : '');
    noBtn.className = 'conv-user-toggle-btn' + (!isYes ? ' selected' : '');
  }
  yesBtn.onclick = ()=>{ applyReasonAnswer(reason, true); refresh(); };
  noBtn.onclick = ()=>{ applyReasonAnswer(reason, false); refresh(); };
  refresh();
  wrap.appendChild(yesBtn);
  wrap.appendChild(noBtn);
  return wrap;
}

// 次の質問へ進む。最後の質問（その他を含む）まで終えたら、フォーム版と同じく
// finishChapter('ch1','ch2_intro')で第1章を完了する。
function ch2ReasonAdvance(){
  if(ch2NotworkConvIndex < CH2_NOTWORK_STEPS.length - 1){
    ch2NotworkConvIndex++;
    renderCh2ReasonStep();
  } else {
    finishChapter('ch1', 'ch2_intro');
  }
}

// 「その他」で「はい」を選んだ直後だけ現れる、自由記述の入力段階。
// テキスト入力なので、他の質問と違い明示的な「次へ」で確定してから完了する。
function renderCh2ReasonOtherTextStep(){
  ch2NotworkConvOtherStep = true;
  const thread = document.getElementById('ch2ReasonThread');
  const bubble = document.createElement('div');
  bubble.className = 'conv-bot';
  bubble.textContent = '具体的に教えてください';
  thread.appendChild(bubble);
  const cur = document.getElementById('ch2ReasonCurrent');
  cur.innerHTML = '';
  const textarea = document.createElement('textarea');
  textarea.id = 'ch2ReasonOtherText';
  textarea.placeholder = '具体的な理由を記入してください';
  textarea.value = state.notWorkReasonOther;
  textarea.oninput = e=>state.notWorkReasonOther = e.target.value;
  cur.appendChild(textarea);
  setTimeout(()=>textarea.focus(), 0);
  setFooter({secondaryLabel:'戻る', secondaryFn:ch2ReasonGoBack, primaryLabel:'次へ', primaryEnabled:true, primaryFn:()=>{
    ch2NotworkConvOtherStep = false;
    ch2ReasonAdvance();
  }});
}

// 「戻る」：自由記述の段階なら「その他」の質問（はい/いいえ）に戻り、その他の選択も
// 取り消す。それ以外は1つ前の質問に戻って答え直せるようにする。1問目まで戻ったら、
// 通常のgoBack()（画面を出る）に委ねる。
function ch2ReasonGoBack(){
  const thread = document.getElementById('ch2ReasonThread');
  if(ch2NotworkConvOtherStep){
    ch2NotworkConvOtherStep = false;
    thread.lastElementChild.remove(); // 「具体的に教えてください」の吹き出し
    thread.lastElementChild.remove(); // 直前の「はい」回答の吹き出し
    state.notWorkReasons = state.notWorkReasons.filter(r=>r!=='その他');
    renderCh2ReasonCurrentControl(); // 「その他」の質問（はい/いいえ）を再表示
    return;
  }
  if(ch2NotworkConvIndex > 0){
    const curStep = CH2_NOTWORK_STEPS[ch2NotworkConvIndex];
    if(curStep.sub) thread.lastElementChild.remove(); // 現在の質問の補足
    thread.lastElementChild.remove(); // 現在の質問の本文
    thread.lastElementChild.remove(); // 現在の質問のラベル（N/8）
    thread.lastElementChild.remove(); // ひとつ前の質問への回答吹き出し
    ch2NotworkConvIndex--;
    renderCh2ReasonCurrentControl();
  } else {
    goBack();
  }
}

// =====================================================================
// 「生活状況をふりかえる」画面（seikatsu-jokyo/、別リポジトリ内の隣接サブプロジェクト）
// との連携（2026-07-28統合）。GitHub階層はindex.htmlをリポジトリ直下、seikatsu-jokyo/を
// その配下に置く前提（seikatsu-jokyo/00_引き継ぎ_最初に読む.md「GitHub階層」で合意済み）。
//
// 受け渡し方式は「案B・疎結合」：探索画面側がlocalStorage['adl_handoff_v1']に
// {ADLキー: 最終レベル文字列} の形で書き込み、本体側はch2_adl画面の表示時に読むだけ
// （自動反映はしない。値が同じ端末・同一オリジンで動いていることが前提）。
// 取り込みは必ずstepCh2Adl()内の「取り込む」ボタン経由のみで行い、画面表示のたびに
// 黙って上書きすることは絶対にしない（seikatsu-jokyo側の依頼メモ「6. やってはいけないこと」）。
// =====================================================================
const ADL_HANDOFF_KEY = 'adl_handoff_v1';

// ---- 探索画面が書いたhandoffを実際にstate.adlへ適用する（ボタン押下時のみ呼ぶ） ----
// seikatsu-jokyo/src/genzai/handoff_connector.js（試作・tests/genzai/test_handoff_to_main_app.js
// で検証済み）と同じロジック。ADL_ITEMSに無いキー・ADL_LEVEL_TO_NUMに無い値は無視し、
// state.adlの他のキー（他項目の結果）には触らない。
function applyAdlHandoff(){
  const result = {applied:[], skipped:[]};
  let raw;
  try{ raw = localStorage.getItem(ADL_HANDOFF_KEY); }catch(e){ return result; }
  if(!raw) return result;
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return result; }
  if(!data || typeof data !== 'object') return result;
  const validKeys = {};
  ADL_ITEMS.forEach(([key])=>{ validKeys[key] = true; });
  if(!state.adl || typeof state.adl !== 'object'){ state.adl = {}; }
  Object.keys(data).forEach(key=>{
    const level = data[key];
    if(validKeys[key] && Object.prototype.hasOwnProperty.call(ADL_LEVEL_TO_NUM, level)){
      state.adl[key] = level;
      result.applied.push(key);
    } else {
      result.skipped.push(key);
    }
  });
  return result;
}

// ---- handoffの中身を「読むだけ」で、差分プレビュー用の一覧を作る（stateは一切変更しない） ----
// applyAdlHandoff()と同じ判定基準（ADL_ITEMS/ADL_LEVEL_TO_NUMに実在するかどうか）を使うが、
// 検証済みのapplyAdlHandoff()本体には手を加えたくないため、あえて別関数として読み取り専用で持つ。
function getAdlHandoffPreviewItems(){
  let raw;
  try{ raw = localStorage.getItem(ADL_HANDOFF_KEY); }catch(e){ return []; }
  if(!raw) return [];
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return []; }
  if(!data || typeof data !== 'object') return [];
  const items = [];
  ADL_ITEMS.forEach(([key,label])=>{
    const newLevel = data[key];
    if(Object.prototype.hasOwnProperty.call(ADL_LEVEL_TO_NUM, newLevel)){
      const currentLevel = state.adl && state.adl[key] ? state.adl[key] : null;
      items.push({ key, label, currentLevel, newLevel, same: currentLevel === newLevel });
    }
  });
  return items;
}

function getAdlHandoffNinteibiPreviewItems(){

// 2026-08-08: 初回入力は会話形式（4択・タップで即次へ）、修正時は従来の一覧フォーム。
// stepCh2WorkDetail/stepCh2NotworkReasonと同じ考え方（決定#54〜57）だが、判定条件は
// completed.ch1ではなくcompleted.ch2を使う。理由：STEP_CHAPTER_MAP上ch2_adlとch2_otherは
// 同じ第2章に属し、finishChapter('ch2', ...)はch2_otherを抜ける時にしか呼ばれない
// （finishChapter('ch1','ch2_intro')は「ch2_introに入る直前」に完了フラグを立てるため、
// ch2_intro自身がその後ch2_adlへ橋渡しする形になっており、ch2_adl自身の中では使えない）。
// workStatusJustChanged相当の「状況変更直後は強制的に会話形式」という分岐は不要
// （ch1_work_statusでの変更時にクリアされるのはstate.work関連のみで、state.adlは影響を受けない）。
//
// 2026-08-08追記（決定#58）：姉妹アプリの項目別ページへのリンクを一度でも踏んだら
// （state.adlConvEnded=true）、それ以降もずっと一覧フォームに固定する。この判定は
// visibilitychangeリスナー側でも同じ考え方で使うため、共通のshouldShowAdlForm()に括り出した。
//
// 2026-08-09追記：以前は「completed.ch2が第2章全体の完了フラグ」であるため、
// ch2_adl→ch2_otherへ進んだ後に「戻る」でch2_adlへ戻ってきた場合（＝まだ第2章は未完了）に、
// 会話形式が最初からやり直しになる不具合があった。ch2_adl自身の完了だけを表す
// state.adlConvDone（10問完走、または「残りをとばす」で立つ）を導入し、判定に加えることで解消した。
function shouldShowAdlForm(){
  return !!(state.returnTo || state.completed.ch2 || state.adlConvEnded || state.adlConvDone);
}

function stepCh2Adl(){
  if(shouldShowAdlForm()){
    renderCh2AdlForm();
  } else {
    renderCh2AdlConversation();
  }
}

// 修正時に使う、従来からの一覧フォーム（挙動は変更なし。姉妹アプリへの導線・取り込みUIも

  // ---- 「生活状況をふりかえる」（seikatsu-jokyo/、ADL探索画面）への導線＋取り込みUIを1ブロックに ----

  const handoffBlockHtml = `

      <a id="adlHandoffLink" href="seikatsu-jokyo/pages/genzai/hub.html" target="_blank" rel="noopener" style="${actionBtnStyle}${handoffItems.length ? 'margin-bottom:14px;' : ''}">生活状況をふりかえる →</a>

// ---- 初回入力用の会話形式（2026-08-08、決定#54〜57。姉妹アプリ連携は決定#58〜59で追加）----

// ADL_ITEMSの各キー→姉妹アプリ（seikatsu-jokyo/pages/genzai/）の項目別ページのファイル名。
// seikatsu-jokyo/src/genzai/hub.src.htmlのADL_ITEMS配列（3列目）と完全に一致させること

const ADL_SISTER_APP_URLS = {

const CH2_ADL_STEPS = ADL_ITEMS.map(([key,label])=>({key, label}));
let ch2AdlConvIndex = 0;

function renderCh2AdlConversation(){
  ch2AdlConvIndex = 0;
  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>最近の日常生活について教えてください</h2>
      <p class="optional-notice">答えなくても次に進めます　<a href="#" id="ch2AdlSkipTop" class="inline-skip-link">その他の項目へ進む →</a></p>
      <details style="margin-bottom:14px;">
        <summary class="small" style="cursor:pointer;color:var(--accent-strong);">選ぶときのヒントを見る</summary>
        <p class="small hint" style="margin-top:6px;">${esc(ADL_HELP_NOTICE)}</p>
      </details>
      <div class="conv-thread" id="ch2AdlThread"></div>
      <div class="conv-current" id="ch2AdlCurrent"></div>
      <button type="button" class="link-btn skip-all-link" id="ch2AdlSkipAll">残りの質問はとばして、その他の項目へ →</button>
    </div>`;
  // 決定#55：個別スキップは無し。抜け道はこの「残りをとばす」リンクのみで、ch2_otherへ直行する
  // （すでに第1章は完了済みのため、finishChapterではなく素のgoToでよい＝フォーム版の「次へ」と同じ）。
  // 2026-08-09：こちらも完走扱いとしてstate.adlConvDone=trueにする（ch2AdlAdvance()と同じ理由）。
  // 2026-08-10：冒頭にも同じ行き先のリンクを追加（決定#65）。まだ1問も答えていない人が
  // スレッドを読み進めなくても最初から離脱できるようにするため。下部のリンクは、数問
  // 答えたあとで「もう十分」と思った人向けに残す（用途が異なるため両方残す）。
  const ch2AdlSkipHandler = (e)=>{ if(e) e.preventDefault(); state.adlConvDone = true; goTo('ch2_other'); };
  document.getElementById('ch2AdlSkipTop').onclick = ch2AdlSkipHandler;
  document.getElementById('ch2AdlSkipAll').onclick = ch2AdlSkipHandler;
  renderCh2AdlStep();
}

// 現在の質問の吹き出し（ラベル・項目名・「迷ったときの例」）をスレッドに積み、回答用の4択を表示する。
// 質問文言は既存のラベル（「着替え」等）をそのまま使い、疑問文への言い換えはしない（設計案「4.決定事項一覧」直後の注記）。
// 決定#56：「迷ったときの例」はフォーム版（renderAdlItemHtml）と同じ密度で、質問ごとに表示する。
function renderCh2AdlStep(){
  const step = CH2_ADL_STEPS[ch2AdlConvIndex];
  const thread = document.getElementById('ch2AdlThread');
  const label = document.createElement('div');
  label.className = 'conv-step-label';
  label.textContent = (ch2AdlConvIndex+1) + ' / ' + CH2_ADL_STEPS.length;
  thread.appendChild(label);
  const bubble = document.createElement('div');
  bubble.className = 'conv-bot';
  bubble.textContent = step.label;
  thread.appendChild(bubble);
  const helpHtml = adlHelpDetailsHtml(step.key);
  if(helpHtml){
    const helpWrap = document.createElement('div');
    helpWrap.innerHTML = helpHtml;
    thread.appendChild(helpWrap.firstElementChild);
  }
  renderCh2AdlCurrentControl();
}

// ADL_LEVELS（できる／まあできる／援助があれば／できない）の4択を表示する。
// 戻ってきて同じ質問を再表示するときも（吹き出しを重複させないよう）これだけを単独で呼ぶ。
function renderCh2AdlCurrentControl(){
  const cur = document.getElementById('ch2AdlCurrent');
  cur.innerHTML = '';
  const optsEl = document.createElement('div');
  optsEl.className = 'option-block option-block-grid2';
  cur.appendChild(optsEl);
  const step = CH2_ADL_STEPS[ch2AdlConvIndex];
  ADL_LEVELS.forEach(levelLabel=>{
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = levelLabel;
    const handler = ()=>ch2AdlAnswer(levelLabel);
    div.onclick = handler;
    makeFocusable(div, handler);
    optsEl.appendChild(div);
  });
  // 姉妹アプリ（seikatsu-jokyo/）の該当項目ページへの導線（決定#58〜59）。
  // ハブではなく、今の質問の項目ページへ直接?from=chat付きで飛ぶ。踏んだ瞬間に
  // state.adlConvEnded=trueにして会話モードを終了する（決定#58）。これによって、
  // 姉妹アプリ側で回答して本体タブに戻ってきたときは一覧フォーム（取り込みUIがある方）に
  // 固定表示されるので、会話の続きの位置をstateへ保持する仕組み（設計案②③）は不要になる。
  const sisterUrl = ADL_SISTER_APP_URLS[step.key];
  if(sisterUrl){
    // 2026-08-10追記（決定#66）：以前は案内文（緑背景の.hint）とリンクが別要素の兄弟で、
    // リンクが枠の外に出てしまい「案内文とは無関係な、踏んでよいか分からないリンク」に
    // 見えるとの指摘を受けた。案内文とリンクを同じ.hint箱の中にまとめることで、
    // 「この案内文に対応するリンクです」と一目で分かるようにした
    // （枠外に置いていたときの見た目はスクリーンショット参照＝ユーザー添付画像）。
    const hintBox = document.createElement('div');
    hintBox.className = 'hint';
    hintBox.style.margin = '10px 0 4px';
    const hintText = document.createElement('p');
    hintText.className = 'small';
    hintText.style.margin = '0 0 6px';
    hintText.textContent = '選ぶのが難しいときは、場面をひとつずつ思い出しながら考えられる画面もあります。';
    hintBox.appendChild(hintText);
    const link = document.createElement('a');
    link.className = 'link-btn';
    link.id = 'ch2AdlSisterLink';
    link.href = 'seikatsu-jokyo/pages/genzai/' + sisterUrl + '?from=chat';
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = `「${step.label}」を詳しくふりかえる →`;
    link.onclick = ()=>{
      state.adlConvEnded = true;
      saveStateToStorage();
    };
    hintBox.appendChild(link);
    cur.appendChild(hintBox);
  }
  setFooter({secondaryLabel:'戻る', secondaryFn:ch2AdlGoBack});
}

// 4択の回答をstate.adlへ反映する（新規回答時・過去の回答のトグルボタンで選び直したとき、
// どちらからも呼ぶ共通処理）。
function applyAdlAnswer(key, levelLabel){
  state.adl[key] = levelLabel;
}

// 4択のどれかをタップした瞬間の処理。選んだ内容をstate.adlへ確定し、回答の吹き出し（トグル）を
// 積んだうえで、即座に次の質問（または完了）へ進む（決定#55、「次へ」の別タップを挟まない）。
function ch2AdlAnswer(levelLabel){
  const step = CH2_ADL_STEPS[ch2AdlConvIndex];
  applyAdlAnswer(step.key, levelLabel);
  const thread = document.getElementById('ch2AdlThread');
  thread.appendChild(buildAdlAnswerToggle(step.key));
  ch2AdlAdvance();
}

// 過去に答えた質問を、ADL_LEVELSの4つのボタンとして表示する。選んでいる方だけ色を反転させ、
// 他のボタンをタップすればその場で選び直せる（reason版のbuildReasonAnswerToggleと同じ考え方を
// 2択→4択に一般化したもの）。
function buildAdlAnswerToggle(key){
  const wrap = document.createElement('div');
  wrap.className = 'conv-user-toggle';
  const btns = ADL_LEVELS.map(levelLabel=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = levelLabel;
    btn.onclick = ()=>{ applyAdlAnswer(key, levelLabel); refresh(); };
    wrap.appendChild(btn);
    return btn;
  });
  function refresh(){
    btns.forEach(btn=>{
      btn.className = 'conv-user-toggle-btn' + (state.adl[key]===btn.textContent ? ' selected' : '');
    });
  }
  refresh();
  return wrap;
}

// 次の質問へ進む。最後の質問まで終えたら、フォーム版の「次へ」と同じくch2_otherへ進む
// （第1章はすでに完了済みのため、finishChapterではなく素のgoToでよい）。
// 2026-08-09：完走した時点でstate.adlConvDone=trueにする（shouldShowAdlForm()参照。
// ch2_otherから「戻る」してきたときに会話をやり直させないため）。
function ch2AdlAdvance(){
  if(ch2AdlConvIndex < CH2_ADL_STEPS.length - 1){
    ch2AdlConvIndex++;
    renderCh2AdlStep();
  } else {
    state.adlConvDone = true;
    goTo('ch2_other');
  }
}

// 「戻る」：会話の途中（2問目以降）なら1つ前の質問に戻って答え直せるようにする。
// 1問目まで戻ったら、通常のgoBack()（画面を出る）に委ねる。
function ch2AdlGoBack(){
  const thread = document.getElementById('ch2AdlThread');
  if(ch2AdlConvIndex > 0){
    const curStep = CH2_ADL_STEPS[ch2AdlConvIndex];
    if(adlHelpDetailsHtml(curStep.key)) thread.lastElementChild.remove(); // 現在の質問の「迷ったときの例」
    thread.lastElementChild.remove(); // 現在の質問の本文（項目名）
    thread.lastElementChild.remove(); // 現在の質問のラベル（N/10）
    thread.lastElementChild.remove(); // ひとつ前の質問への回答トグル
    ch2AdlConvIndex--;
    renderCh2AdlCurrentControl();
  } else {
    goBack();
  }
}

// 2026-08-10（決定#68）：様式02裏面E55/56「その他日常生活で不便に感じていることがありましたら
// 記入してください。」は、仕事をしていない理由（ア〜オ）やADL（1〜4）と違い、様式側に選択肢が
// 一切ない完全な自由記述欄。他の3画面のような1問1答（はい/いいえ）化は見送り、代わりに
// 自由記述（textarea）を主役として冒頭へ、10項目チェックリストは「書きにくい人向けの補助」
// として自由記述の下に配置する構成に変更した。理由：この欄の役割は「他の欄で拾いきれない、
// その人固有の困りごと」を拾うことであり、有限の項目リストで先に埋めさせると、本来一番
// 大事なはずの自由記述が形だけになりかねない（10問答え終えた達成感で読み飛ばされる等）。
// チェックリスト内の「その他」項目は、自由記述欄そのものが受け皿になるため削除した
// （OTHER_DIFFICULTIESは stepCh5RecognitionOther() とも共有しているため、認定日欄側の
// チェックリストからも同じ理由で「その他」が消える。認定日欄のレイアウト自体は今回のスコープ外
// のため変更していない）。
function stepCh2Other(){
  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>その他、生活で困っていることは？</h2>
      <p class="optional-notice">答えなくても次に進めます　<a href="#" id="ch2OtherSkipTop" class="inline-skip-link">第3章へ進む →</a></p>
      <p class="lead">日常生活で他に困っていることがあれば、自由に書いてください。書きにくいときは、下のチェックから選ぶだけでも大丈夫です。</p>
      <textarea id="otherNote" placeholder="${esc(OTHER_NOTE_PLACEHOLDER)}"></textarea>
      ${renderHelpListHtml(OTHER_NOTE_HELP_ITEMS)}
      <label class="field-label" style="font-size:14px;font-weight:700;color:var(--ink);margin-top:24px;padding-top:16px;border-top:1px solid var(--line);">気になるものがあれば、チェックするだけでも大丈夫です</label>
      <div id="otherList"></div>
    </div>`;
  renderStringCheckList('otherList', OTHER_DIFFICULTIES.map(l=>[l,l]), state.otherChips);
  const noteEl = document.getElementById('otherNote');
  noteEl.value = state.otherNote;
  noteEl.oninput = e=>state.otherNote = e.target.value;
  const ch2OtherSkipHandler = (e)=>{ if(e) e.preventDefault(); finishChapter('ch2', 'ch3_intro'); };
  document.getElementById('ch2OtherSkipTop').onclick = ch2OtherSkipHandler;
  setFooter({secondaryLabel:'戻る', secondaryFn:goBack, primaryLabel:'第3章へ進む', primaryEnabled:true, primaryFn:()=>{
    finishChapter('ch2', 'ch3_intro');
  }});
}

// =====================================================================
// 02裏面オプション入力：障害認定日頃の状況 / 障害者手帳。
// ch5の年表完成確認画面（stepCh5Done）〜Excel出力の間に置く追加オプション入力。
// 既存の現状編period rowロジック（buildCurrentPeriodRows等）やch2系の現在状況入力とは
// 別state（recognitionSnapshot/disabilityNotebook）で持ち、混ぜない（今回の実装方針）。
// =====================================================================

// ---- 認定日欄共通：入力を取りやめて空欄に戻す処理。就労状況画面・日常生活画面の両方から呼ぶ ----
function disableRecognitionInput(){
  const snap = state.recognitionSnapshot;
  const ok = confirm('入力した内容を消して、認定日ごろの状態を未入力（空欄で出力）に戻します。よろしいですか？');
  if(!ok) return;
  snap.enabled = false;
  snap.work = {status:null, jobType:'', commute:[], commuteTime:null, workDays:'', condition:[]};
  snap.notWorkReasons = [];
  snap.notWorkReasonOther = '';
  snap.adl = {};
  snap.otherChips = [];
  snap.otherNote = '';
  showScreen();
}

// ---- ch5_recognition：障害認定日頃の就労状況の入力（任意・1画面目）。02裏面4-17行目に対応。
//      現在欄（ch1_work_status→ch2_work_detail/ch2_notwork_reason）と同様、就労状況とADLを
//      別画面に分ける（一画面に情報を詰め込みすぎると認知負荷が高いため、2026-06-30対応）。 ----
function stepCh5Recognition(){
  const snap = state.recognitionSnapshot;
  const enabled = snap.enabled;

  if(!enabled){
    document.getElementById('screen').innerHTML = `
      <div class="card">
        <h2>障害認定日ごろの状態（任意）</h2>
        <p class="lead">初診日から１年６か月ごろ（または認定日請求の対象時期）の生活・通院・仕事の状況を、申立書に反映するための入力です。入力しない場合は空欄のまま出力できます。</p>
        <button type="button" id="enableRecognitionBtn" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent-strong);color:#fff;font-size:15px;cursor:pointer;">入力する</button>
      </div>`;
    document.getElementById('enableRecognitionBtn').onclick = ()=>{
      snap.enabled = true;
      showScreen();
    };
    setFooter({secondaryLabel:'戻る', secondaryFn:()=>{
      const dest = state.returnTo || 'ch5_done';
      goTo(dest);
    }});
    return;
  }

  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>障害認定日ごろの状態（任意）</h2>
      <p class="lead" style="font-weight:600;color:var(--accent-strong);">${esc(RECOGNITION_PERIOD_NOTICE_MAIN)}</p>
      <p class="lead">あてはまる範囲だけ入力してください。わからない項目は空けたままで構いません。</p>

      <label class="field-label">認定日ごろ、仕事をしていましたか</label>
      <div class="chip-group" id="recogStatusChips"></div>

      <div id="recogWorkingBlock" style="display:none;">
        <label class="field-label">職種・仕事の内容（短くでOK）</label>
        <input type="text" id="recogJobType" />
        <label class="field-label">通勤方法（複数選択可）</label>
        <div class="chip-group" id="recogCommuteChips"></div>
        <label class="field-label">片道の通勤時間</label>
        <div class="chip-group" id="recogCommuteTimeChips"></div>
        <label class="field-label">出勤日数（およそ、月あたり）</label>
        <input type="number" id="recogWorkDays" min="0" max="31" />
        <label class="field-label">仕事中・終わった後の体や気持ちの状態</label>
        <div class="chip-group" id="recogConditionChips"></div>
      </div>

      <div id="recogNotWorkingBlock" style="display:none;">
        <label class="field-label">仕事をしていなかった理由（複数選択可）</label>
        <p class="small" style="margin-bottom:4px;color:var(--accent-strong);">${esc(RECOGNITION_PERIOD_NOTICE_SHORT)}</p>
        <div id="recogReasonList"></div>
        <div id="recogReasonOtherBlock" style="display:${snap.notWorkReasons.includes('その他')?'':'none'};margin-top:10px;">
          <label class="field-label">「その他」の具体的な理由</label>
          <textarea id="recogReasonOtherText" placeholder="具体的な理由を記入してください"></textarea>
        </div>
      </div>

      <button type="button" id="disableRecognitionBtn" style="width:100%;margin-top:18px;padding:10px;border-radius:8px;border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);font-size:14px;cursor:pointer;">この入力を取りやめて空欄に戻す</button>

      <p class="small" style="margin-top:14px;text-align:center;">入力した内容は自動的に保存されます。そのまま戻っても消えません。</p>
    </div>`;

  const jobTypeEl = document.getElementById('recogJobType');
  jobTypeEl.value = snap.work.jobType;
  jobTypeEl.oninput = e=>snap.work.jobType = e.target.value;
  const workDaysEl = document.getElementById('recogWorkDays');
  workDaysEl.value = snap.work.workDays;
  workDaysEl.oninput = e=>snap.work.workDays = e.target.value;
  renderChipGroup('recogCommuteChips', COMMUTE_METHOD, snap.work.commute, true, ()=>{});
  renderChipGroup('recogCommuteTimeChips', COMMUTE_TIME, snap.work.commuteTime ? [snap.work.commuteTime] : [], false, v=>{ snap.work.commuteTime = v; });
  renderChipGroup('recogConditionChips', WORK_CONDITION, snap.work.condition, true, ()=>{});
  renderStringCheckList('recogReasonList', NOTWORK_REASONS.map(l=>[l,l]), snap.notWorkReasons, NOTWORK_REASON_HELP_TEXTS, (key)=>{
    if(key==='その他'){
      document.getElementById('recogReasonOtherBlock').style.display = snap.notWorkReasons.includes('その他') ? '' : 'none';
    }
  });
  const recogReasonOtherEl = document.getElementById('recogReasonOtherText');
  recogReasonOtherEl.value = snap.notWorkReasonOther;
  recogReasonOtherEl.oninput = e=>snap.notWorkReasonOther = e.target.value;

  const workingBlock = document.getElementById('recogWorkingBlock');
  const notWorkingBlock = document.getElementById('recogNotWorkingBlock');
  // ===== 就労状態（仕事をしていた／していなかった）の仕様 =====
  // 「仕事をしていた」「仕事をしていなかった」は排他的な入力である（同時に両方を満たすことはない）。
  // そのため、ステータスを切り替えたときは反対側ブロックに残っていた入力を必ずクリアする。
  // 理由：認定日欄の出力（writeRecognitionSnapshotToBack）は「就労していた情報」と
  // 「就労していなかった理由」を同時に書き込めてしまう実装になりうるため、片方の選択を
  // 解除した時点で反対側のデータをstateから消しておかないと、申立書上で
  // 「就労していた（職種あり）」と「不就労理由あり」が同時に出力される矛盾が起きる。
  // クリアはUI側（本関数群）と出力側（writeRecognitionSnapshotToBack内のstatusガード）の
  // 二重で行っている。UI側のクリアだけでは古い保存データ（state直接編集や将来の不整合）に
  // 弱く、出力側ガードだけでは画面上に「消えたはずの古い入力」が残って見える表示矛盾が残るため。
  //
  // renderChipGroupはラベル文字列そのものを値として扱う仕様（[key,label]ペアではなく文字列配列を渡す）。
  // 内部判定もラベル文字列そのもの（'仕事をしていた'）で行う。
  // 未選択(null)時は両ブロックとも非表示にする（以前は否定判定により、未選択でも
  // notWorkingBlockが表示されてしまっていたバグがあった。B-3で修正済み）。
  function syncWorkStatusBlocks(){
    workingBlock.style.display = snap.work.status==='仕事をしていた' ? '' : 'none';
    notWorkingBlock.style.display = snap.work.status==='仕事をしていなかった' ? '' : 'none';
  }
  // 反対側ブロックのデータをクリアする実処理。呼び出しはステータス変更時（下のrenderChipGroupの
  // onToggle）のみで、画面初期表示時には呼ばない（既存データを誤って消さないため）。
  function clearWorkSideData(){
    snap.work.jobType = '';
    snap.work.commute = [];
    snap.work.commuteTime = null;
    snap.work.workDays = '';
    snap.work.condition = [];
  }
  function clearNotWorkingSideData(){
    snap.notWorkReasons = [];
  }
  renderChipGroup('recogStatusChips', ['仕事をしていた','仕事をしていなかった'], snap.work.status ? [snap.work.status] : [], false, v=>{
    const previous = snap.work.status;
    snap.work.status = v;
    if(v!==previous){
      if(v==='仕事をしていた') clearNotWorkingSideData();
      else if(v==='仕事をしていなかった') clearWorkSideData();
    }
    showScreen(); // クリアした内容を画面にも反映するため再描画する（input/chipの表示が古い値のまま残らないようにする）
  });
  syncWorkStatusBlocks();

  document.getElementById('disableRecognitionBtn').onclick = disableRecognitionInput;

  setFooter({secondaryLabel:'戻る', secondaryFn:()=>{
    const dest = state.returnTo || 'ch5_done';
    goTo(dest);
  }, primaryLabel:'次へ', primaryEnabled:true, primaryFn:()=>goTo('ch5_recognition_adl')});
}

// ---- ch5_recognition_adl：障害認定日頃の日常生活の入力（任意・2画面目）。02裏面19-30行目に対応。
//      就労状況（stepCh5Recognition）とは別画面に分離（情報過多を避けるため）。 ----
function stepCh5RecognitionAdl(){
  const snap = state.recognitionSnapshot;
  const handoffItems = getAdlHandoffNinteibiPreviewItems();
  const hasOverwrite = handoffItems.some(it=>it.currentLevel && !it.same);
  // stepCh2Adl()のactionBtnStyleと同じ（<a>タグにも<button>と同じ見た目を持たせるための複製）
  const actionBtnStyle = 'display:block;width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:none;background:var(--accent-strong);color:#fff;font-size:15px;font-weight:500;cursor:pointer;text-align:center;text-decoration:none;';
  // stepCh2Adl()のhandoffBlockHtmlと同じ考え方（案B・疎結合、「自動で反映されます」とは書かない）。
  // リンク先・文言のみ認定日版（ninteibi）向けに差し替えている。
  const handoffBlockHtml = `
    <div class="hint" style="margin-bottom:14px;">
      <p style="margin:0 0 10px;">認定日ごろの生活の場面をひとつずつふりかえりながら選べる画面もあります。いちどに全部をやらなくても大丈夫です。できそうな日に振り返ってみましょう。</p>
      <a id="adlHandoffNinteibiLink" href="seikatsu-jokyo/pages/ninteibi/hub.html" target="_blank" rel="noopener" style="${actionBtnStyle}${handoffItems.length ? 'margin-bottom:14px;' : ''}">認定日ごろの生活状況をふりかえる →</a>
      ${handoffItems.length ? `
      <p style="margin:0 0 8px;font-weight:600;">ふりかえりの結果</p>
      <ul style="margin:0 0 10px;padding-left:18px;">
        ${handoffItems.map(it=>`<li>${esc(it.label)}：${it.currentLevel ? esc(it.currentLevel) : '（未選択）'} → ${esc(it.newLevel)}${it.same ? '（同じ）' : ''}</li>`).join('')}
      </ul>
      <p class="small" style="margin:0 0 4px;color:var(--accent-strong);">取り込むボタンで上記項目を取り込めます</p>
      ${hasOverwrite ? `<p class="small" style="margin:0 0 10px;">すでに選んでいる内容は上書きされます。</p>` : ''}
      <button type="button" id="adlHandoffNinteibiApplyBtn" style="${actionBtnStyle}">取り込む</button>
      ` : ''}
    </div>`;

  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>障害認定日ごろの日常生活について（任意）</h2>
      <p class="lead" style="font-weight:600;color:var(--accent-strong);">${esc(RECOGNITION_PERIOD_NOTICE_MAIN_INTRO)}</p>
      <details style="margin-bottom:14px;">
        <summary class="small" style="cursor:pointer;color:var(--accent-strong);">選ぶときのヒントを見る</summary>
        <p class="small hint" style="margin-top:6px;">${esc(RECOGNITION_PERIOD_NOTICE_MAIN_FLEX + ADL_HELP_NOTICE)}</p>
      </details>
      ${handoffBlockHtml}
      <div id="recogAdlList"></div>

      <button type="button" id="disableRecognitionBtn" style="width:100%;margin-top:18px;padding:10px;border-radius:8px;border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);font-size:14px;cursor:pointer;">この入力を取りやめて空欄に戻す</button>

      <p class="small" style="margin-top:14px;text-align:center;">入力した内容は自動的に保存されます。そのまま戻っても消えません。</p>
    </div>`;

  const handoffLinkEl = document.getElementById('adlHandoffNinteibiLink');
  if(handoffLinkEl){
    // stepCh2Adl()と同じ理由：離脱前に明示的に保存しておく（画面遷移時の保存タイミングを待たない）
    handoffLinkEl.onclick = ()=>{ saveStateToStorage(); };
  }
  const applyBtn = document.getElementById('adlHandoffNinteibiApplyBtn');
  if(applyBtn){
    applyBtn.onclick = ()=>{
      applyAdlHandoffNinteibi();
      saveStateToStorage();
      stepCh5RecognitionAdl(); // チップ・差分プレビューとも最新状態で丸ごと再描画する
    };
  }

  // 2026-08-01：実テンプレート02.xlsxを確認したところ、認定日欄の選択肢は過去形
  // （できた／できたが援助が必要だった／できないが援助があればできた／できなかった）だったため、
  // 現在欄と同じADL_LEVELSではなくADL_LEVELS_PASTを使う（詳細はADL_LEVEL_TO_NUM定義のコメント参照）。
  let adlHtml = '';
  ADL_ITEMS.forEach(([key,label])=>{
    adlHtml += renderAdlItemHtml(key, label, 'recogAdl_', ADL_LEVELS_PAST);
  });
  document.getElementById('recogAdlList').innerHTML = adlHtml;
  ADL_ITEMS.forEach(([key])=>{
    const container = document.getElementById('recogAdl_'+key);
    ADL_LEVELS_PAST.forEach(levelLabel=>{
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip' + (snap.adl[key]===levelLabel ? ' chip-selected' : '');
      btn.textContent = levelLabel;
      btn.onclick = ()=>{
        snap.adl[key] = levelLabel;
        container.querySelectorAll('.chip').forEach(c=>c.classList.remove('chip-selected'));
        btn.classList.add('chip-selected');
      };
      container.appendChild(btn);
    });
  });

  document.getElementById('disableRecognitionBtn').onclick = disableRecognitionInput;

  setFooter({secondaryLabel:'戻る', secondaryFn:()=>goTo('ch5_recognition'), primaryLabel:'次へ', primaryEnabled:true, primaryFn:()=>goTo('ch5_recognition_other')});
}

// ---- ch5_recognition_other：障害認定日頃の「その他」生活の困りごと（任意・3画面目）。
//      現在欄のch2_adl→ch2_otherと同じ構成に合わせ、ADL画面（stepCh5RecognitionAdl）とは
//      別画面に分離（2026-07-01対応）。 ----
function stepCh5RecognitionOther(){
  const snap = state.recognitionSnapshot;

  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>その他、認定日ごろの生活で困っていたことは？</h2>
      <div id="recogOtherList"></div>
      <label class="field-label">補足（任意）</label>
      <textarea id="recogOtherNote" placeholder="${esc(OTHER_NOTE_PLACEHOLDER)}"></textarea>
      ${renderHelpListHtml(OTHER_NOTE_HELP_ITEMS)}

      <button type="button" id="disableRecognitionBtn" style="width:100%;margin-top:18px;padding:10px;border-radius:8px;border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);font-size:14px;cursor:pointer;">この入力を取りやめて空欄に戻す</button>

      <p class="small" style="margin-top:14px;text-align:center;">入力した内容は自動的に保存されます。そのまま戻っても消えません。</p>
    </div>`;

  renderStringCheckList('recogOtherList', OTHER_DIFFICULTIES.map(l=>[l,l]), snap.otherChips);

  const otherNoteEl = document.getElementById('recogOtherNote');
  otherNoteEl.value = snap.otherNote;
  otherNoteEl.oninput = e=>snap.otherNote = e.target.value;

  document.getElementById('disableRecognitionBtn').onclick = disableRecognitionInput;

  setFooter({secondaryLabel:'戻る', secondaryFn:()=>goTo('ch5_recognition_adl'), primaryLabel:'完了', primaryEnabled:true, primaryFn:()=>{
    const dest = state.returnTo || 'ch5_done';
    goTo(dest);
  }});
}

// ---- ch5_notebook：障害者手帳の情報の入力（任意）。02裏面58-65行目（1件目枠）に対応 ----
const DISABILITY_NOTEBOOK_TYPES = ['身体障害者手帳','精神障害者保健福祉手帳','療育手帳','その他'];

function stepCh5Notebook(){
  const nb = state.disabilityNotebook;
  const enabled = nb.enabled;

  if(!enabled){
    document.getElementById('screen').innerHTML = `
      <div class="card">
        <h2>障害者手帳の情報（任意）</h2>
        <p class="lead">障害者手帳を持っている場合、その内容を申立書に反映できます。持っていない場合は入力不要です。</p>
        <button type="button" id="enableNotebookBtn" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent-strong);color:#fff;font-size:15px;cursor:pointer;">入力する</button>
      </div>`;
    document.getElementById('enableNotebookBtn').onclick = ()=>{
      nb.enabled = true;
      showScreen();
    };
    setFooter({secondaryLabel:'戻る', secondaryFn:()=>{
      const dest = state.returnTo || 'ch5_done';
      goTo(dest);
    }});
    return;
  }

  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>障害者手帳の情報（任意）</h2>
      <label class="field-label">手帳の種類</label>
      <div class="chip-group" id="notebookTypeChips"></div>
      <div id="notebookOtherTypeBlock" style="display:none;">
        <label class="field-label">手帳の種類（その他の場合、名称を入力）</label>
        <input type="text" id="notebookOtherTypeName" />
      </div>
      <label class="field-label">等級</label>
      <input type="text" id="notebookGrade" placeholder="例：2級" />
      <label class="field-label">取得年月（任意。わかる範囲でOK）</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="number" id="notebookYear" placeholder="年（西暦）" style="flex:1;" />
        <input type="number" id="notebookMonth" min="1" max="12" placeholder="月" style="flex:1;" />
        <input type="number" id="notebookDay" min="1" max="31" placeholder="日（任意）" style="flex:1;" />
      </div>
      <label class="field-label">障害名・補足（任意）</label>
      <textarea id="notebookDisabilityName"></textarea>

      <button type="button" id="disableNotebookBtn" style="width:100%;margin-top:18px;padding:10px;border-radius:8px;border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);font-size:14px;cursor:pointer;">この入力を取りやめて空欄に戻す</button>

      <p class="small" style="margin-top:14px;text-align:center;">入力した内容は自動的に保存されます。そのまま戻っても消えません。</p>
    </div>`;

  const otherTypeBlock = document.getElementById('notebookOtherTypeBlock');
  function syncOtherTypeBlock(){
    otherTypeBlock.style.display = nb.type==='その他' ? '' : 'none';
  }
  // renderChipGroupは単純な文字列配列を値として扱う仕様（[key,label]ペアではない）。
  // DISABILITY_NOTEBOOK_TYPES自体が文字列配列なのでそのまま渡す
  // （以前は.map(t=>[t,t])で変換していたが、これがnb.typeに配列を代入してしまうバグの原因だった。
  //   表示が「身体障害者手帳,身体障害者手帳」のように壊れる・選択状態が再表示時に外れる・
  //   Excel出力でレ点が入らない、の3つの症状はすべてこの1つの原因による）
  renderChipGroup('notebookTypeChips', DISABILITY_NOTEBOOK_TYPES, nb.type ? [nb.type] : [], false, v=>{
    nb.type = v;
    syncOtherTypeBlock();
  });
  syncOtherTypeBlock();

  const otherTypeNameEl = document.getElementById('notebookOtherTypeName');
  otherTypeNameEl.value = nb.otherTypeName;
  otherTypeNameEl.oninput = e=>nb.otherTypeName = e.target.value;

  const gradeEl = document.getElementById('notebookGrade');
  gradeEl.value = nb.grade;
  gradeEl.oninput = e=>nb.grade = e.target.value;

  const yearEl = document.getElementById('notebookYear');
  const monthEl = document.getElementById('notebookMonth');
  const dayEl = document.getElementById('notebookDay');
  yearEl.value = nb.acquiredYear;
  monthEl.value = nb.acquiredMonth;
  dayEl.value = nb.acquiredDay;
  // acquiredKindは出力時に「年だけ／年月／年月日／未入力」のどこまで埋まっているかを判定するために使う。
  // 入力欄が3つの独立inputのため、入力都度ここで再判定する（既存のfromKind/toKind方式に揃える）。
  function syncAcquiredKind(){
    nb.acquiredYear = yearEl.value;
    nb.acquiredMonth = monthEl.value;
    nb.acquiredDay = dayEl.value;
    if(!nb.acquiredYear){ nb.acquiredKind = 'none'; }
    else if(!nb.acquiredMonth){ nb.acquiredKind = 'y'; }
    else if(!nb.acquiredDay){ nb.acquiredKind = 'ym'; }
    else { nb.acquiredKind = 'ymd'; }
  }
  yearEl.oninput = syncAcquiredKind;
  monthEl.oninput = syncAcquiredKind;
  dayEl.oninput = syncAcquiredKind;

  const disabilityNameEl = document.getElementById('notebookDisabilityName');
  disabilityNameEl.value = nb.disabilityName;
  disabilityNameEl.oninput = e=>nb.disabilityName = e.target.value;

  document.getElementById('disableNotebookBtn').onclick = ()=>{
    const ok = confirm('入力した内容を消して、障害者手帳の情報を未入力（空欄で出力）に戻します。よろしいですか？');
    if(!ok) return;
    nb.enabled = false;
    nb.type = ''; nb.otherTypeName = ''; nb.grade = '';
    nb.acquiredKind = 'none'; nb.acquiredYear = ''; nb.acquiredMonth = ''; nb.acquiredDay = '';
    nb.disabilityName = ''; nb.note = '';
    showScreen();
  };

  setFooter({secondaryLabel:'戻る', secondaryFn:()=>{
    const dest = state.returnTo || 'ch5_done';
    goTo(dest);
  }});
}

const STEPS = {
  start: stepStart,
  profile_birth: stepProfileBirth,
  profile_band_size: stepProfileBandSize,
  ch1_work_status: stepCh1WorkStatus,
  ch3_intro: stepCh3Intro,
  ch3_events: stepCh3Events,
  ch3_done: stepCh3Done,
  ch4_intro: stepCh4Intro,
  ch4_hospital_name: stepCh4HospitalName,
  ch4_memory_dig: stepCh4MemoryDig,
  ch4_period: stepCh4Period,
  ch4_confidence: stepCh4Confidence,
  ch4_gap_review: stepCh4GapReview,
  ch4_summary: stepCh4Summary,
  ch5_intro: stepCh5Intro,
  ch5_place: stepCh5Place,
  ch5_done: stepCh5Done,
  ch5_preview: stepCh5Preview,
  ch5_recognition: stepCh5Recognition,
  ch5_recognition_adl: stepCh5RecognitionAdl,
  ch5_recognition_other: stepCh5RecognitionOther,
  ch5_notebook: stepCh5Notebook,
  ch2_intro: stepCh2Intro,
  ch2_work_detail: stepCh2WorkDetail,
  ch2_notwork_reason: stepCh2NotworkReason,
  ch2_adl: stepCh2Adl,
  ch2_other: stepCh2Other,
  // 過去編（続紙対応）。ch7_hospital_add（過去病院追加画面）は病院データ一本化に伴い廃止済み。
  // ch8_past_review（整理してみる画面）も廃止済み（断片は既にch7_fragment_boardの一覧に表示）。
  ch6_past_intro: stepCh6PastIntro,
  ch7_fragment_board: stepCh7FragmentBoard
};

function showScreen(){
  document.getElementById('taskHeader').style.display = '';
  renderTasks();
  STEPS[current]();
}

// 「生活状況をふりかえる」を別タブで開くようにした（2026-07-30）ことに伴う対応。
// 別タブ側でのふりかえり結果はlocalStorageに書き込まれるが、本体タブ側は
// ページを読み込み直さない限りそれを検知しない。かといって毎回読み込み直すと
// 「続きから／最初から」の確認画面（起動時に必ず出る）を経由することになり、
// 「最初からやり直す」を誤って押すリスクが往復のたびに発生してしまう
// （このリスクを避けるために別タブ化した経緯そのものと矛盾する）。
// そのため、タブが再びアクティブになったタイミングで、今ch2_adl画面（現在の生活状況・
// ふりかえりの導線がある画面）またはch5_recognition_adl画面（認定日ごろの生活状況・同じ
// 導線がある画面）を表示中の場合に限り、その場で再描画して最新のふりかえり結果を反映する。
// どちらの関数もチップ選択をstateから復元して描画するため、この再描画で入力中の内容が
// 失われることはない（「取り込む」ボタン自身が同じ関数を呼んで丸ごと再描画しているのと同じ仕組み）。
//
// 2026-08-08追記：ch2_adlが「初回=会話形式／修正時=一覧フォーム」に分岐するようになった
// （決定#54〜57）ため、上記の前提（「再描画しても入力中の内容は失われない」）が一覧フォーム
// 限定の話になった。会話形式（renderCh2AdlConversation）は呼ばれるたびに1問目から描画し直す
// ため、ここでstepCh2Adl()を無条件に呼ぶと、会話の途中でタブを切り替えて戻ってきただけで
// 進捗が1問目にリセットされてしまう。一覧フォームが表示されるとき（=shouldShowAdlForm()が
// true）に限定して再描画する（stepCh2Adl()自身の分岐条件と完全に同じにするため、
// 同じ関数を共有している）。
//
// 2026-08-08追記2（決定#58〜59）：姉妹アプリの項目別ページへのリンクを会話形式の質問ごとに
// 設置した。リンクを踏むとstate.adlConvEnded=trueになり、shouldShowAdlForm()がtrueを返す
// ようになるため、姉妹アプリ側で回答して本体タブに戻ってきたときは、このリスナーによって
// 自動的に一覧フォーム（姉妹アプリからの取り込みUIがある方）が再描画される
// （シナリオ全体は設計案「5. シナリオ」参照）。
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible') return;
  if(current === 'ch2_adl' && shouldShowAdlForm()){
    stepCh2Adl();
  } else if(current === 'ch5_recognition_adl'){
    stepCh5RecognitionAdl();
  }
});

resetState();
current = 'start';
const savedPayload = loadStateFromStorage();
if(savedPayload){
  document.getElementById('taskHeader').style.display = 'none';
  stepResumeCheck(savedPayload);
} else {
  showScreen();
}
</script>
