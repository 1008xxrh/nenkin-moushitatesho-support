<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>申立書サポート（試作・第1〜5章）</title>
<style>
:root{
  --bg:#F4F2EC;
  --card:#FFFFFF;
  --ink:#2B2B28;
  --ink-soft:#6B6B63;
  --line:#E2DDD0;
  --accent:#4F7A6B;
  --accent-soft:#E4EDE8;
  --accent-strong:#345A4C;
  --warn:#B8742E;
  --warn-soft:#F6E8D8;
  --danger:#A3402F;
  --danger-soft:#F5E1DB;
  --good:#3E7D4C;
  --good-soft:#E3F0E3;
  --neutral-soft:#EFEBE2;
  --border:var(--line);
  --surface-raised:var(--neutral-soft);
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--bg);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;
  color:var(--ink);line-height:1.7;
}
#app-shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
header.tasks{padding:16px 20px 4px;}
.task-list{display:flex;gap:6px;margin-top:8px;}
.task-pill{flex:1;text-align:center;font-size:11px;padding:6px 4px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);}
.task-pill.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:500;}
.task-pill.done{color:var(--good);}
main{flex:1;padding:8px 20px 120px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;}
h1{font-size:20px;font-weight:500;margin:0 0 8px;}
h2{font-size:17px;font-weight:500;margin:0 0 12px;}
.card-name-label{font-size:13px;color:var(--ink-soft);margin:0 0 4px;}
.card-name-big{font-size:24px;font-weight:500;color:var(--accent-strong);margin:0 0 4px;line-height:1.4;}
.card-name-sub{font-size:14px;color:var(--ink-soft);margin:0 0 20px;}
p.lead{color:var(--ink-soft);font-size:14px;margin:0 0 20px;}
p.optional-notice{color:var(--ink);font-size:14px;font-weight:700;margin:-2px 0 16px;}
.hint{background:var(--accent-soft);color:var(--accent-strong);font-size:13px;padding:10px 14px;border-radius:10px;margin:12px 0;}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink);cursor:pointer;scroll-margin-bottom:110px;}
.chip-selected{background:var(--accent);border-color:var(--accent);color:#fff;}
.option-block{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
/* ch2Adl（会話形式）の4択だけに使う2列グリッド版。他画面の.option-block（はい/いいえ・
   就労状況・帯サイズ等、件数や文言長がまちまちな一覧）には影響させないよう、
   .option-blockとは別の専用クラスとして追加した（後から着いた方が優先されるよう
   スタイルシート内の並び順もこの位置にしている）。ADL_LEVELSは常にちょうど4件、
   かつ「できる→まあできる→援助があれば→できない」という一直線の尺度なので、
   2列×2行でも読み順（左上→右上→左下→右下）が尺度の順序と一致する。 */
.option-block-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.option{border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px;cursor:pointer;background:var(--card);scroll-margin-bottom:110px;}
.option.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);font-weight:500;}
label.field-label{display:block;font-size:13px;color:var(--ink-soft);margin:16px 0 6px;}
input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);scroll-margin-bottom:110px;}
input[type=text]::placeholder,input[type=number]::placeholder,textarea::placeholder{color:#b0b0ac;}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;min-height:80px;font-family:inherit;scroll-margin-bottom:110px;}
.row{display:flex;gap:10px;}
.row > *{flex:1;}
.adl-item{margin-bottom:18px;}
.adl-label{font-size:14px;margin-bottom:8px;}
.adl-options .chip{font-size:12px;padding:7px 10px;}
.conv-thread{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
.conv-step-label{font-size:11px;color:var(--ink-soft);opacity:.75;margin:6px 0 0 2px;}
.conv-bot{align-self:flex-start;max-width:92%;background:var(--accent-soft);color:var(--accent-strong);border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:15px;line-height:1.6;}
.conv-bot-sub{align-self:flex-start;font-size:12px;color:var(--ink-soft);margin:-2px 2px 0;max-width:92%;}
.conv-user{align-self:flex-end;max-width:85%;background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px;padding:9px 14px;font-size:14px;}
.conv-user.skip{background:transparent;border:1px dashed var(--line);color:var(--ink-soft);font-style:italic;}
.conv-user-toggle{align-self:flex-end;display:flex;gap:6px;}
.conv-user-toggle-btn{border:1px solid var(--line);border-radius:14px;padding:7px 14px;font-size:14px;cursor:pointer;background:var(--card);color:var(--ink-soft);}
.conv-user-toggle-btn.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);font-weight:500;}
.conv-current{margin-top:4px;scroll-margin-bottom:110px;}
.conv-current .chip-group{margin-bottom:0;}
.check-row{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;}
.check-box{width:18px;height:18px;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;}
.check-box.on{background:var(--accent);}
.check-box span{color:#fff;font-size:12px;}
.footer-nav{position:sticky;bottom:0;background:linear-gradient(to top, var(--bg) 75%, transparent);padding:16px 20px 20px;display:flex;gap:10px;max-width:480px;margin:0 auto;width:100%;}
button.btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:500;cursor:pointer;}
button.btn-primary{background:var(--accent);color:#fff;}
button.btn-primary:disabled{background:#C9C4B6;cursor:not-allowed;}
button.btn-secondary{background:var(--card);border:1px solid var(--line);color:var(--ink);}
button.btn-secondary.btn-alone{flex:0 0 auto;min-width:120px;}
.timeline-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
.timeline-row.gap{color:var(--ink-soft);border-bottom:1px dashed var(--line);font-style:italic;}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap;}
.badge-good{background:var(--good-soft);color:var(--good);}
.badge-warn{background:var(--warn-soft);color:var(--warn);}
.badge-danger{background:var(--danger-soft);color:var(--danger);}
.badge-neutral{background:var(--neutral-soft);color:var(--ink-soft);}
.center{text-align:center;}
.small{font-size:13px;color:var(--ink-soft);}
.link-btn{background:none;border:none;color:var(--accent-strong);font-size:14px;text-decoration:underline;cursor:pointer;padding:0;display:block;margin-top:4px;}
/* optional-notice内の「まだ答えていない人」向けインラインリンク（②：冒頭側） */
.inline-skip-link{color:var(--accent-strong);font-weight:700;}
/* スレッド末尾の「もう十分な人」向けスキップリンク（②：右寄せ／③：太字で目立たせる） */
.link-btn.skip-all-link{margin-top:14px;text-align:right;font-weight:700;width:100%;}
button:focus-visible, .option:focus-visible, .chip:focus-visible, [role="button"]:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;}
.edit-section{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);}
.edit-section-label{font-size:12px;color:var(--ink-soft);margin:0 0 10px;}
.edit-section-grid{display:flex;flex-wrap:wrap;gap:8px;}
.edit-chip{background:var(--surface-raised);border:1px solid var(--border);border-radius:999px;font-size:13px;padding:6px 14px;cursor:pointer;color:var(--ink);}
.repeat-block{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.repeat-block-head{display:flex;align-items:center;justify-content:space-between;}
.repeat-block-title{font-size:15px;}
.repeat-add{background:none;border:1px solid var(--accent-strong);color:var(--accent-strong);border-radius:999px;font-size:13px;padding:4px 12px;cursor:pointer;}
.repeat-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:8px 10px;background:var(--surface-raised);border-radius:8px;font-size:14px;}
.repeat-remove{background:none;border:none;color:var(--danger);font-size:13px;cursor:pointer;text-decoration:underline;padding:0;}

/* ---- アコーディオン（ch5_done仕様書3.6） ---- */
.accordion-group{border-top:1px solid var(--border);}
.accordion-item{border-bottom:1px solid var(--border);}
.accordion-trigger{width:100%;text-align:left;background:none;border:none;padding:12px 4px;font-size:14px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
.accordion-trigger::after{content:'▼';font-size:10px;color:var(--ink-soft);transition:transform 0.15s;}
.accordion-trigger-open::after{transform:rotate(180deg);}
.accordion-panel{padding:0 4px 14px;}

/* ---- ch5_preview：紙を模した1枚の申立書（ch5_preview仕様書3章） ---- */
.preview-status{background:var(--surface-raised);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
.preview-status-title{font-size:13px;font-weight:600;margin:0 0 8px;}
.preview-status-counts{display:flex;gap:14px;font-size:12px;margin-bottom:10px;}
.preview-status-counts span{display:flex;align-items:center;gap:4px;}
.preview-status-list{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;border-top:1px solid var(--border);padding-top:10px;margin-bottom:8px;}
.preview-status-list button{background:none;border:none;padding:0;font-size:12px;cursor:pointer;color:var(--ink);}
.preview-status-excluded{font-size:11px;color:var(--ink-soft);border-top:1px solid var(--border);padding-top:8px;}
/* ---- outputMode切替スイッチ（作業3-3。決定#12〜#17） ---- */
.mode-switch-block{margin-bottom:14px;}
.mode-switch-caption{font-size:12px;color:var(--ink-soft);margin:0 0 6px;}
.mode-switch{display:flex;gap:6px;}
.mode-switch-option{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 10px;font-size:13px;text-align:center;cursor:pointer;background:var(--neutral-soft);color:var(--ink-soft);}
.mode-switch-option.mode-switch-selected{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ---- ch5_preview v4：紙そのもの（02.xlsx様式の升目構造再現、仕様書2章） ---- */
.preview-paper{background:#fff;color:#1a1a1a;border:1px solid #888;font-size:12px;line-height:1.5;}
.preview-paper-title{text-align:center;padding:14px 10px 10px;border-bottom:3px double #1a1a1a;font-size:16px;font-weight:700;letter-spacing:0.05em;}
/* 章タイトル行（実物02.xlsx裏面A4「１．障害認定日」／A32「２．現在…」に対応）。
   一度は罫線を完全に削除したが、紙面の区切りが読み取りにくくなった（2026-06-30レビューで
   「前の方がよかった」との指摘）ため、罫線ありの状態に戻す。実物の罫線は厳密にはタイトル
   行自身ではなくその前後の行にあるが、画面上は視覚的な区切りを優先しタイトル行に
   border-top/border-bottomを持たせる。直前要素のborder-bottomと隣接すると二重線に見える
   ため、margin-topで1pxずらして1本の太線に見せる。
   注意：「１．障害認定日」「２．現在…」の各章タイトルは、preview-sec-recognition／
   preview-sec-currentという別々のラッパーdivの中に1個ずつ置かれている。そのため
   :first-of-typeを使うと、両方とも「自分の親の中では最初」と判定されて両方に
   マッチしてしまい、本来「現在」章に出るべき上罫線まで消えてしまう不具合が過去にあった
   （2026-07-02発覚）。以後、罫線を消したいのはページ全体で最初の章タイトルだけなので、
   :first-of-typeではなく明示的なクラス(.pp-chapter-title-first)で個別に指定すること。 */
.pp-chapter-title{padding:10px 10px 6px;font-size:13px;font-weight:700;background:#fff;border-top:2px solid #1a1a1a;border-bottom:1px solid #888;margin-top:-1px;}
.pp-chapter-title.pp-chapter-title-first{border-top:none;margin-top:0;}
.pp-block{display:flex;border-bottom:1px solid #888;}
.pp-label{width:30px;flex-shrink:0;background:#f4f4f2;border-right:1px solid #888;writing-mode:vertical-rl;text-align:center;font-size:12px;font-weight:600;padding:10px 0;font-family:'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;}
.pp-body{flex:1;min-width:0;}
.pp-row{display:flex;border-bottom:1px solid #ccc;}
.pp-row:last-child{border-bottom:none;}
.pp-row-label{width:74px;flex-shrink:0;padding:7px 6px;font-size:11px;color:#444;border-right:1px solid #ccc;background:#fafafa;}
.pp-row-value{flex:1;min-width:0;padding:7px 8px;font-size:12px;}
.pp-blank{color:#aaa;}
.pp-unavailable{color:#aaa;font-style:normal;}

/* 傷病名・発病日・初診日（升目だが恒久的に未入力） */
.pp-static-row{display:flex;border-bottom:1px solid #888;}
.pp-static-label{width:74px;flex-shrink:0;padding:9px 6px;font-size:11px;font-weight:600;background:#f4f4f2;border-right:1px solid #888;}
.pp-static-value{flex:1;padding:9px 8px;font-size:12px;}

/* 元号セレクタ風表示（実物のプレースホルダー文言を再現） */
.pp-era{display:inline-flex;gap:2px;}
.pp-era-opt{border:1px solid #999;border-radius:2px;padding:1px 5px;font-size:10px;color:#999;}
.pp-era-opt.pp-selected{border-color:#1a1a1a;color:#1a1a1a;font-weight:700;background:#eee;}
.pp-date-placeholder{color:#999;font-size:11px;}

/* チェックボックス（□にレ点） */
.pp-checkbox{display:inline-flex;align-items:center;gap:3px;margin-right:14px;font-size:12px;}
.pp-checkbox-box{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border:1px solid #1a1a1a;font-size:11px;font-weight:700;flex-shrink:0;}
.pp-checkbox.pp-checked .pp-checkbox-box{background:#1a1a1a;color:#fff;}
.pp-checkbox:not(.pp-checked) .pp-checkbox-box{color:transparent;}

/* ADL選択枠（丸数字） */
.pp-adl-row{display:flex;flex-wrap:wrap;gap:6px 16px;}
.pp-adl-item{display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;}
.pp-adl-item-label{min-width:32px;}
.pp-adl-nums{display:inline-flex;gap:3px;}
.pp-adl-num{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:10px;color:#999;border:1px solid transparent;}
.pp-adl-num.pp-selected{border:1.5px solid #1a1a1a;color:#1a1a1a;font-weight:700;}

/* 不就労理由（ア〜オの記号付き選択肢） */
.pp-reason-list{display:flex;flex-direction:column;gap:3px;}
.pp-reason-item{display:flex;gap:5px;font-size:11px;}
.pp-reason-item.pp-selected{font-weight:700;}
.pp-reason-letter{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border:1px solid #999;border-radius:50%;font-size:9px;flex-shrink:0;}
.pp-reason-item.pp-selected .pp-reason-letter{border-color:#1a1a1a;background:#1a1a1a;color:#fff;}
.pp-reason-item:not(.pp-selected){color:#999;}

/* 年表（マス目、1〜5+の番号付き行） */
.pp-period-row{display:flex;border-bottom:1px solid #888;}
.pp-period-num{width:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border-right:1px solid #888;background:#f4f4f2;}
.pp-period-body{flex:1;min-width:0;display:flex;}
.pp-period-dates{width:140px;flex-shrink:0;padding:6px;font-size:10px;line-height:1.6;border-right:1px solid #ccc;}
.pp-period-note{flex:1;min-width:0;padding:6px 8px;font-size:11px;line-height:1.5;}
.pp-period-hospital{font-weight:600;font-size:11px;margin-bottom:2px;}

/* 手帳：種類チップ（身・精・療・他の略字表現） */
.pp-notebook-types{display:inline-flex;gap:3px;font-size:10px;}
.pp-notebook-type-opt{border:1px solid #999;border-radius:2px;padding:1px 4px;color:#999;}
.pp-notebook-type-opt.pp-selected{border-color:#1a1a1a;color:#1a1a1a;font-weight:700;background:#eee;}

.preview-output-note{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:8px;}
.preview-jump{background:none;border:none;padding:0;font-size:12px;cursor:pointer;color:var(--ink);}

/* ---- ch5_place 再設計：出来事カード配置画面（画面仕様書 全14章） ---- */
/* 画面全体：上2/3年表・下1/3手札の上下2段固定（4.1節・4.7節）。
   比率はここ1箇所（--place-timeline-flex / --place-hand-flex）で切り替えられるようにする。 */
.place-screen{
  --place-timeline-flex:2;
  --place-hand-flex:1;
  display:flex;flex-direction:column;height:calc(100vh - 140px);min-height:420px;
}
.place-header{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px;flex-shrink:0;}
.place-header h2{margin:0;}
/* 西暦⇄元号切り替えボタン：画面右上（4.6節） */
.place-era-toggle{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink);cursor:pointer;flex-shrink:0;}
.place-era-toggle.place-era-active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:500;}

.place-timeline{
  flex:var(--place-timeline-flex);min-height:0;overflow-y:auto;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:4px 12px;margin-bottom:10px;
}
/* 年表と手札の境目をはっきり分ける（4.7節確定） */
.place-hand{
  flex:var(--place-hand-flex);min-height:0;overflow-y:auto;
  background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;
  padding:10px 12px;
}

.place-band{padding:12px 0;border-bottom:1px solid var(--line);}
.place-band:last-child{border-bottom:none;}
.place-band-label{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;}
/* 帯本体：タップして配置先にできる領域（帯全体がタップ対象、6.3節と同じ考え方） */
.place-band-body{border-radius:10px;padding:6px;cursor:pointer;min-height:12px;}
.place-band-body:hover{background:var(--neutral-soft);}
.place-band-body.place-target-active{background:var(--accent-soft);outline:2px dashed var(--accent);}

/* 通院バー・義務教育バー：背景情報、操作不可（4.4節） */
/* 帯全体がその期間（3〜5年）を表す背景トラック。セグメントはこの中の実際の時期の位置に絶対配置する。 */
.place-bar-row{position:relative;height:22px;border-radius:0;overflow:visible;margin-bottom:4px;background:var(--neutral-soft);border:1px solid var(--line);}
.place-bar-seg{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;white-space:nowrap;overflow:hidden;border-radius:0;}
.place-bar-hospital{background:var(--accent);color:#fff;}
.place-bar-education{background:var(--accent-soft);color:var(--accent-strong);border:1px solid var(--accent);}

/* 出来事カード：操作対象。既存チップ（角丸999px）を踏襲し、バー（角丸なし）と形で区別する（4.4.4節） */
.place-card-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;position:relative;z-index:1;}
.place-card{
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:8px 14px;font-size:13px;color:var(--ink);cursor:pointer;
  transition:background 0.2s, border-color 0.2s, transform 0.2s;
}
.place-card.place-card-selected{
  background:var(--accent);border-color:var(--accent);color:#fff;
  outline:2px solid var(--accent-strong);outline-offset:1px;
}
/* 断片カード（過去編「思い出したことを置く場所」から統合されたカード）は、正確な出来事
   カードと区別できるよう、点線の境界線で「まだ曖昧な思い出」という質感を出す。
   選択状態のスタイルは出来事カードと共通（place-card-selectedを併用する）。 */
.place-card.place-card-fragment{
  border-style:dashed;border-color:var(--accent-strong);background:var(--accent-soft);
}
.place-card.place-card-fragment.place-card-selected{
  background:var(--accent);border-style:dashed;
}

.place-hand-label{font-size:12px;color:var(--accent-strong);font-weight:600;margin-bottom:6px;}
.place-hand-body{border-radius:10px;min-height:60px;position:relative;}
.place-hand-body.place-target-active{outline:2px dashed var(--accent-strong);background:rgba(255,255,255,0.4);}
.place-hand-empty{font-size:12px;color:var(--ink-soft);}
/* 「手札が残っていても先へ進めます」を手札エリア中央の透かし文字として表示する。
   カード（.place-card-group）はz-indexで手前に重なる。 */
.place-hand-watermark{
  position:absolute;top:0;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:8px;pointer-events:none;
  font-size:20px;line-height:1.4;font-weight:700;color:var(--ink-soft);opacity:0.5;
}

// ---- 西暦→和暦変換（簡易版） ----
function yearToWareki(year){
  if(year===null || year===undefined || isNaN(year)) return [null, null];
  if(year >= 2019) return ['令和', year - 2018];
  if(year >= 1989) return ['平成', year - 1988];
  if(year >= 1926) return ['昭和', year - 1925];
  return [null, null];
}

// ---- 決定#35：年齢帯（buildAgeBands()の1件）のラベルを、西暦⇄元号切替（state.eraDisplayMode、4.6節）
// に応じて組み立てる。「出来事を年表に置いてみましょう」画面（stepCh5Place）と「年表ができました」
// 画面（stepCh5Done）の両方で使う共通部品（2026-07-18セッション。2.4節の共通部品化課題に対応）。
function formatAgeBandLabel(band, isWareki){
  if(!isWareki) return band.label;
  const [g1, y1] = yearToWareki(band.startYear);
  if(band.isLast){
    return g1 ? `${g1}${y1}年〜現在（${band.startAge}歳〜現在）` : band.label;
  }
  const [g2, y2] = yearToWareki(band.endYear);
  return (g1 && g2) ? `${g1}${y1}〜${g2===g1?'':g2}${y2}年（${band.startAge}〜${band.endAge}歳ごろ）` : band.label;
}

// ---- computeGaps()のfromLabel/toLabel（例："2015年頃"「2018年4頃"）の先頭の「YYYY年」部分だけを
// 西暦⇄元号切替に応じて置き換える。それ以外の部分（月・「頃」等）はそのまま保つ。
function formatGapDateLabel(labelStr, isWareki){
  if(!isWareki) return labelStr;
  const m = (labelStr || '').match(/^(\d+)年/);
  if(!m) return labelStr;
  const [g, y] = yearToWareki(parseInt(m[1]));
  if(!g) return labelStr;
  return labelStr.replace(/^\d+年/, `${g}${y}年`);
}

  '集中力・記憶力の問題': 'オ',
  'その他': 'オ'
};
const NOTWORK_REASON_ROW = {ア:40, イ:41, ウ:42, エ:43, オ:44};

// ---- 様式記入時点（出力ボタンを押した「今日」） ----
function getFormFillDate(){
  const now = new Date();
  return {year: now.getFullYear(), month: now.getMonth()+1, day: now.getDate()};
}

// ---- 出来事カードの年範囲（年齢帯→年）を作る。状況欄の参考情報用 ----
function buildEventYearRanges(){
  const bands = buildAgeBands();
  const ranges = [];
  // 【不具合修正・2026年7月】バンドは隣同士で境界年を共有する（band[i].endYear === band[i+1].startYear）。
  // 出来事の一致判定を両端含む(<=)のままにすると、通院period/gapのチャンク境界がたまたま
  // このバンド境界と同じ年に来たとき、隣り合う2行の両方に同じ出来事が重複して出てしまう
  // （前後の行どちらの「この頃の出来事」にも同じカードが載ってしまう不具合）。
  // 対策として、endYearをその年自体は「次のバンドの持ち物」とみなす半開区間（[startYear, endYear)）
  // にする。ただし最後のバンド（isLast:true）だけはendYearが「現在」を表すため、そのまま含める。
  state.selectedEvents.forEach(ev=>{
    const placement = state.eventPlacements[ev.id];
    // 未配置（手札に残っている）出来事は範囲を持たないため除外する。
    // 旧'unknown'状態はch5_place再設計により廃止済み（ch5_place_再設計_画面仕様書.md 5章）。
    if(!placement) return;
    const band = bands[placement.bandIndex];
    if(!band) return;
    ranges.push({startYear:band.startYear, endYear:band.endYear, isLast:!!band.isLast, label:ev.label});
  });
  // 断片（pastFragments）＝自作出来事カードとして、出来事カードと完全に同じ扱いで合流する。
  // ch5_placeで配置された（eventPlacementsにエントリがある）断片のみ対象で、手札に残っている
  // 断片は出来事カード同様に除外する。これにより、通院履歴の状況記載欄（buildPeriodsForForm
  // 側の「この頃の出来事：」）に、出来事カードのラベルと断片のテキストが区別なく混在して
  // 出力される。将来「生まれてからの履歴」全体を出力するバージョンでも、断片は常にこの
  // 仕組みに乗る（別ルートを作らない）方針。現時点ではExcel出力自体は通院履歴のみのため、
  // 断片が実際に反映されるのは「通院期間と時期が重なる場合」に限られる。
  state.pastFragments.forEach(f=>{
    const placement = state.eventPlacements[f.id];
    if(!placement) return;
    const band = bands[placement.bandIndex];
    if(!band) return;
    ranges.push({startYear:band.startYear, endYear:band.endYear, isLast:!!band.isLast, label:f.text});
  });
  return ranges;
}

// ---- 決定#36：出来事の帯が複数のchunk（行）にまたがる場合の割り振り（不具合Bの修正） ----
// 出来事（eventRanges）は年単位の粗い帯（3〜5年幅）でしか記録されないのに対し、実際の
// chunkは通院記録の実データを基準にもっと細かく区切られる。そのため1つの帯の中に複数の
// chunkの区切りが入ってしまうと、以前の点判定（旧eventRangeMatchesYear。chunk.fromYが
// 帯の中に入っているかどうかだけを見る）では、帯の中に入るchunkすべてに同じ出来事が
// 重複して載ってしまっていた。
// 「どちらの行が正しいか」を利用者に選ばせるのは、判断や決断そのものが負担になりうる
// 利用者への配慮というこのアプリ全体の方針に反するため、機械的に「帯との重なりが一番
// 大きいchunk」にだけ出来事を残す。重なりが同じ場合は時期が早いchunkを採用する（挙動を
// 決定的にするため）。buildPeriodsForForm()の第1パス（chunks確定後）で1回だけ計算し、
// 結果（出来事レンジのindex→勝ったchunk）を第2パスのnote生成で参照する。
// 【決定#41】決定#36の時点では「フェーズ1側（buildPhase1SegmentNote()）は決定#25で
// 範囲重なり判定（eventRangeOverlapsSegment()）に対応済みだから対象外」としていたが、これは
// 誤りだった。決定#25が直したのは「区分が出来事を正しく検出できるか（取りこぼし＝偽陰性）」
// で、決定#36が直したかったのは「複数の候補が同じ出来事を正しく検出した結果、両方に
// 表示されてしまう（重複）」という別の問題。決定#25は決定#36の問題を解消しない、
// どころかフェーズ1側の検出精度を上げた分だけ重複が起きやすくなっていた（実利用者の
// シミュレーションで発覚、2026-07-21対応）。フェーズ1・先頭側gapのchunkも他のcandidateの
// chunkとまったく同じ土俵で勝者判定できるよう、引数をcandidatesではなく平坦なchunks配列
// （呼び出し側で好きな種類のchunkを混ぜて渡せる）に変更した。
function resolveEventChunkWinners(allChunks, eventRanges){
  const winners = new Map();
  eventRanges.forEach((r, i)=>{
    const rangeEndExclusive = r.isLast ? r.endYear + 1 : r.endYear;
    let bestChunk = null, bestOverlap = 0;
    allChunks.forEach(chunk=>{
      if(!(chunk.fromY && chunk.toY)) return;
      const overlap = Math.min(chunk.toY, rangeEndExclusive) - Math.max(chunk.fromY, r.startYear);
      if(overlap <= 0) return;
      if(overlap > bestOverlap || (overlap === bestOverlap && chunk.fromY < bestChunk.fromY)){
        bestOverlap = overlap;
        bestChunk = chunk;
      }
    });
    if(bestChunk) winners.set(i, bestChunk);
  });
  return winners;
}

// ---- フェーズ1区分の範囲[segStartYear, segEndYear)と、出来事レンジ（年齢帯）の範囲が
// 半開区間で重なるかどうかを判定する（決定#25）。eventRangeMatchesYear()は「1つの年」対
// 「年齢帯の範囲」の点判定だが、フェーズ1の区分（最大6年幅）の開始年だけをそこに渡すと、
// 区分内の他の年にかかる出来事を取りこぼす（bandSize=5時に67%取りこぼすことをシミュレーションで
// 確認済み）。10章で確立した半開区間の考え方（isLastのときだけ上限を含む）を、点ではなく
// 範囲同士の重なり判定に拡張したもの。buildPhase1SegmentNote()（作業1-3）からのみ呼び出す。
function eventRangeOverlapsSegment(range, segStartYear, segEndYear){
  const rangeEndExclusive = range.isLast ? range.endYear + 1 : range.endYear;
  return range.startYear < segEndYear && segStartYear < rangeEndExclusive;
}

// ---- 通院記録＋通院空白を様式の「期間」配列に変換（最大5件、6件目以降は今回未対応） ----
// 【developmental mode】state.outputModeは作業3まで実装されないため、modeOverride引数を
// 一時的な発動手段とする（設計方針3節「新たな疑問」）。作業3実装後もstate.outputModeを見る
// フォールバックはそのまま使えるため、この仕組み自体を後から置き換える必要はない想定。
function buildPeriodsForForm(modeOverride){
  const eventRanges = buildEventYearRanges();

  // 【病院期間分割】state.hospitals.forEachをflatMap相当（各病院のperiods[]を展開）に変更
  // （病院期間分割_設計案.md 5章）。linkedHospitalId由来のnote（過去編仕様書5.3節）は
  // 最後のperiodにのみ合流させる（発生しても表示上の差に留まり実害がないため）。
  // 【方針転換・2026年7月】病院の通院期間についても「区切る」操作をユーザーに求めるのをやめ、
  // gapとまったく同じ理由（02.xlsx様式が3〜5年ごとの記入を求めている）で、bandSize超の期間を
  // 自動的に複数行へ分割する（splitGapIntoChunksを流用）。以前は「分割」ボタンで年月を
  // 自分で決めてもらう設計だったが、判断や決断そのものが負担になりうる利用者（うつ状態等）に
  // 配慮し、gapの自動分割（8章）と歩調を揃えた。periods[]のデータ構造自体は残すが（分割UIが
  // 無くなった今、実質的に1病院＝1period固定になる）、buildPeriodsForForm()側で自動的に
  // 複数行へ展開するだけで済むようにした。
  //
  // 【9章：枠の空き状況に応じた端数吸収】病院period・gapのどちらも「候補」としてまず集め、
  // 実際の行（note込み）を作るのは全候補の枠取り合いが決まった後の第2パスにする。
  // 第1パス：まず「枠に空きがある」前提（ボーダーライン端数=7〜11ヶ月も独立ブロックのまま）で
  // 全候補のchunk数を数える。様式の総枠（02.xlsx 5行＋04.xlsx 11行＝16行）に収まっていれば、
  // その通りに確定する。収まらない場合だけ、ボーダーライン端数を持つ候補を「端数が小さいもの
  // （吸収しても目立ちにくいもの）」から順に吸収し、枠に収まるまで行数を減らす。
  // それでもなお枠を超える場合は、これまで通り後段（allocateRowsToMainAndContinuation）の
  // 上限処理（超過分は書き込まれず警告）に委ねる。
  const birth = parseInt(state.profile.birthYear) || null;
  const mode = modeOverride || state.outputMode || 'standard';
  const useDevelopmental = mode === 'developmental' && !!birth;
  // 決定#23：0〜15歳（birth+15）を境目とする（月は使わない年単位）。それより前は完全に
  // フェーズ1側（本関数末尾のphase1Rows）に委ね、通常の候補生成からは除外する。境界をまたぐ
  // 記録は、birth+15を実質的な開始年としてクリップしたうえで通常の候補に含める（既存の
  // splitGapIntoChunks()にそのまま3〜5年ごとの分割を処理させるため）。
  const phase1EndYear = useDevelopmental ? birth + 15 : null;

  const candidates = [];
  state.hospitals.forEach(h=>{
    const periodsArr = h.periods || [];
    periodsArr.forEach((p, idx)=>{
      const fromY = parseInt(p.fromYear) || null;
      if(!fromY) return; // 決定#24：fromYear不明の通院記録はモードを問わず候補から除外する
      const fromM = parseInt(p.fromMonth) || null;
      let toY, toM, toIsNow = false;
      if(p.ongoing){
        const fillDate = getFormFillDate();
        toY = fillDate.year; toM = fillDate.month; toIsNow = true;
      } else {
        toY = parseInt(p.toYear) || null;
        toM = parseInt(p.toMonth) || null;
      }
      let effFromY = fromY, effFromM = fromM;
      if(useDevelopmental){
        if(toY && toY <= phase1EndYear) return; // 0〜15歳に完全に収まる → フェーズ1側の行に委ねる
        if(fromY < phase1EndYear){ effFromY = phase1EndYear; effFromM = null; } // 境界をまたぐ分だけ計上
      }
      candidates.push({ type:'hospital', h, p, isLastPeriod: idx === periodsArr.length-1, fromY:effFromY, fromM:effFromM, toY, toM, toIsNow });
    });
  });
  computeGaps().forEach(g=>{
    const fm = (g.fromLabel||'').match(/(\d+)年(\d+)?/);
    const tm = (g.toLabel||'').match(/(\d+)年(\d+)?/);
    const fromY = fm ? parseInt(fm[1]) : null;
    const fromM = fm && fm[2] ? parseInt(fm[2]) : null;
    const toY = tm ? parseInt(tm[1]) : null;
    const toM = tm && tm[2] ? parseInt(tm[2]) : null;
    let effFromY = fromY, effFromM = fromM;
    if(useDevelopmental && fromY){
      // 通院記録（決定#23）と同じ考え方を、通院空白（gap）にも一貫して適用する。
      // 作業1-1は「0〜15歳の範囲を通常の候補生成から除外する」という一般的な範囲指定であり、
      // gapを除外しないままだとフェーズ1の行と重複する「通院せず」行が0〜15歳の範囲にも
      // 残ってしまうため。
      if(toY && toY <= phase1EndYear) return;
      if(fromY < phase1EndYear){ effFromY = phase1EndYear; effFromM = null; }
    }
    candidates.push({ type:'gap', g, fromY:effFromY, fromM:effFromM, toY, toM });
  });

  candidates.forEach(c=>{
    c.generousChunks = splitGapIntoChunks(c.fromY, c.fromM, c.toY, c.toM, {absorbBorderline:false});
    c.reducedChunks = splitGapIntoChunks(c.fromY, c.fromM, c.toY, c.toM, {absorbBorderline:true});
    c.canReduce = c.reducedChunks.length < c.generousChunks.length; // 差があれば「ボーダーライン端数を持つ」候補
    if(c.canReduce){
      const last = c.generousChunks[c.generousChunks.length-1];
      c.remainderMonths = (last.toY*12 + ((last.toM||1)-1)) - (last.fromY*12 + ((last.fromM||1)-1));
    }
    c.chunks = c.generousChunks; // 既定値。枠が足りない場合のみ、下で差し替える
  });

  const totalCapacity = MAIN_SHEET_ROW_STARTS.length + CONTINUATION_CAPACITY; // 02.xlsx+04.xlsxの総枠（5+11=16行）
  let totalRows = candidates.reduce((sum,c)=>sum + c.chunks.length, 0);
  if(totalRows > totalCapacity){
    const reducible = candidates.filter(c=>c.canReduce).sort((a,b)=>a.remainderMonths - b.remainderMonths);
    for(const c of reducible){
      if(totalRows <= totalCapacity) break;
      totalRows -= 1; // absorbBorderlineは境界1箇所だけを吸収する仕組みなので、必ずちょうど1行分減る
      c.chunks = c.reducedChunks;
    }
  }

  // 決定#36：全候補のchunksが確定した直後、出来事ごとに「重なりが一番大きいchunk」を
  // 1回だけ決めておく（第2パスのnote生成で、chunkごとにこれを参照するだけで済むようにする）。
  // 【決定#41】developmental modeの0〜15歳の区分（phase1Chunks）も、他のcandidateのchunkと
  // まったく同じ土俵で勝者判定に参加させる。以前はここに含まれておらず、フェーズ1側
  // （buildPhase1SegmentNote()・buildDevelopmentalGapNote()）が独自に重なり判定をやり直して
  // いたため、同じ出来事がフェーズ1側の行と、その直後の実際の通院記録の行の両方に重複して
  // 表示されてしまっていた（実利用者のシミュレーションで発覚）。
  const phase1Segs = useDevelopmental ? buildCompulsoryEducationSegments() : [];
  const phase1Chunks = phase1Segs.map(seg => ({ fromY: birth + seg.startAge, toY: birth + seg.endAge }));
  const candidateChunks = [];
  candidates.forEach(c=>{
    c.chunks.forEach(chunk=>{ if(chunk.fromY && chunk.toY) candidateChunks.push(chunk); });
  });
  const eventWinnerChunk = resolveEventChunkWinners([...candidateChunks, ...phase1Chunks], eventRanges);

  // ---- 第2パス：確定したchunksから実際の行（note込み）を作る ----
  const periods = [];
  candidates.forEach(c=>{
    if(c.type === 'hospital'){
      const { h, p, isLastPeriod, toIsNow } = c;
      const hospitalName = h.nameUnknown ? '' : (h.name || '');
      c.chunks.forEach((chunk, ci)=>{
        const isLastChunk = ci === c.chunks.length - 1;
        const related = eventRanges.filter((r,i) => eventWinnerChunk.get(i) === chunk).map(r=>r.label);
        const noteParts = [];
        noteParts.push(`${h.hospitalType || ''}${hospitalName || '（病院名不明）'}に通院。`);
        // 「現在も通院中」は、実際に現在まで続いている最後の行（最後のperiodの最後のchunk）にのみ付ける
        if(toIsNow && isLastChunk) noteParts.push('現在も通院中。');
        if(related.length) noteParts.push('この頃の出来事：' + related.join('・') + '。');
        // 【病院データ一本化】以前は過去編側（buildPastPeriodGroups→buildHospitalGroupNote）が
        // 病院のmemoや、この病院にリンクされた断片（pastFragments）のテキストをnoteに合流させていた。
        // 病院データがstate.hospitals（第4章）に一本化されたことで、過去編は病院の行自体を
        // 生成しなくなったため（重複防止）、その合流処理はここに移した。
        // 【病院期間分割】memoはperiodごとに持つフィールドになったため、期間ごとのmemoをそのまま使う。
        // 自動分割で複数行になった場合も、gapの理由と同じ考え方で全chunkに同じmemoを繰り返す。
        if(p.memo && p.memo.trim()) noteParts.push(p.memo.trim());
        if(isLastPeriod && isLastChunk){
          const linkedFragments = state.pastFragments.filter(f=>f.linkedHospitalId===h.hospitalId);
          linkedFragments.forEach(f=>{
            const text = pickFragmentText(f);
            if(text && text.trim()) noteParts.push(text.trim());
          });
        }
        periods.push({
          sortKey: chunk.fromY || 0,
          fromY: chunk.fromY, fromM: chunk.fromM, toY: chunk.toY, toM: chunk.toM,
          toIsNow: toIsNow && isLastChunk,
          visited: true,
          hospitalName,
          note: noteParts.join('')
        });
      });
    } else {
      const { g } = c;
      // 決定#33：developmental modeの先頭側gapは、通常gapと違いGAP_REASONS由来の
      // 「理由：」を使わず、buildDevelopmentalGapNote()（出来事カード/断片ベース）でnoteを作る。
      const isLeadingGap = isDevelopmentalLeadingGapKey(g.key);
      const reasonNote = '通院せず。理由：' + toLabelStrings(g.reasons).join('・') + '。';
      c.chunks.forEach(chunk=>{
        let note;
        if(isLeadingGap){
          const related = eventRanges.filter((r,i) => eventWinnerChunk.get(i) === chunk).map(r=>r.label);
          note = buildDevelopmentalGapNote({ fromY: chunk.fromY, toY: chunk.toY }, related);
        } else {
          const related = eventRanges.filter((r,i) => eventWinnerChunk.get(i) === chunk).map(r=>r.label);
          const noteParts = [reasonNote];
          if(related.length) noteParts.push('この頃の出来事：' + related.join('・') + '。');
          note = noteParts.join('');
        }
        periods.push({
          sortKey: chunk.fromY || 0,
          fromY: chunk.fromY, fromM: chunk.fromM,
          toY: chunk.toY, toM: chunk.toM,
          toIsNow: false,
          visited: false,
          hospitalName: '',
          note
        });
      });
    }
  });

  periods.sort((a,b)=>a.sortKey - b.sortKey);

  // ---- developmental mode：0〜15歳ぶんのフェーズ1固定行を先頭に結合する（決定#26） ----
  // 16行の総枠チェック・端数吸収パスとの整合は決定#27の通り、特別な除外処理は不要
  // （フェーズ1の固定行は上のcandidates/chunksパスを一切通らないため、呼び出し元の
  // 既存の16行超過チェックにそのまま乗る）。
  if(useDevelopmental){
    const phase1Rows = phase1Segs.map((seg, i)=>{
      const chunk = phase1Chunks[i];
      const related = eventRanges.filter((r,ri) => eventWinnerChunk.get(ri) === chunk).map(r=>r.label);
      const { hospitalName, note } = buildPhase1SegmentNote(seg, birth, related);
      return {
        sortKey: birth + seg.startAge,
        fromY: birth + seg.startAge, fromM: null,
        toY: birth + seg.endAge, toM: null,
        toIsNow: false,
        visited: !!hospitalName,
        hospitalName,
        note
      };
    });
    return phase1Rows.concat(periods);
  }

  return periods; // Step5：.slice(0,5)はここでは行わない。絞り込みは呼び出し元の責務に一元化する
}

// ---- 【新機能】gapの3〜5年自動分割（病院期間分割_設計案.md 8章）----
// 選択中のstate.profile.bandSize（3年 or 5年）の固定サイズで先頭から区切っていく。
// 均等分割は採用しない（境界が予測しにくくなるため）。
// 端数（最後のchunk）が7ヶ月未満なら独立した行にせず直前のchunkに吸収し、7ヶ月以上ならそのまま
// 独立した行にする。fromY/toYが無い（年不明）場合は分割できないため、そのまま1件で返す。
// 【9章：枠の空き状況に応じた端数吸収】7〜11ヶ月は「ボーダーライン」の端数で、様式の枠（行）に
// 空きがあるかどうかで扱いが変わる（buildPeriodsForForm()側で制御）。options.absorbBorderlineを
// trueにすると、7〜11ヶ月の端数も（12ヶ月未満と同じ扱いで）直前のchunkへ強制的に吸収する。
// 既定（false）では従来通り7ヶ月以上ならすべて独立した行のままになる。
function splitGapIntoChunks(fromY, fromM, toY, toM, options){
  const absorbBorderline = !!(options && options.absorbBorderline);
  const whole = {fromY, fromM, toY, toM};
  if(!fromY || !toY) return [whole];

  const fromTotal = fromY*12 + ((fromM||1) - 1);
  const toTotal = toY*12 + ((toM||1) - 1);
  const spanMonths = toTotal - fromTotal;
  const chunkMonths = (state.profile.bandSize || 5) * 12;
  // 【決定#32・2026-07-16修正】以前はここで固定「60ヶ月（5年）以下ならそのまま1件」を判定していたが、
  // これはbandSize=5を前提にした値がそのまま残っていたもので、bandSize=3を選んでいる場合でも
  // 3〜5年（37〜60ヶ月）の記録が分割されずに1件のまま出てしまうバグがあった（ユーザー報告：
  // bandSize=3で年表は3年区切りなのに、プレビューの一部の行だけ5年になっていた）。選択中の
  // bandSizeに連動したchunkMonths自体をこの時点で「そもそも分割が要るか」の判定にも使うことで、
  // 年齢帯の表示（buildAgeBands()、常にbandSize刻み）と行の分割が食い違わないようにする。
  if(spanMonths <= chunkMonths) return [whole]; // 選択中のbandSize以下はそのまま1件

  const boundaries = [fromTotal];
  let cursor = fromTotal;
  while(toTotal - cursor > chunkMonths){
    cursor += chunkMonths;
    boundaries.push(cursor);
  }
  if(boundaries[boundaries.length-1] !== toTotal){
    boundaries.push(toTotal);
  }

  // 端数の吸収：最後の区間が7ヶ月未満なら常に吸収。7〜11ヶ月は、absorbBorderline指定時のみ吸収する（9章）
  if(boundaries.length >= 3){
    const lastSpan = boundaries[boundaries.length-1] - boundaries[boundaries.length-2];
    const shouldAbsorb = lastSpan < 7 || (absorbBorderline && lastSpan < 12);
    if(shouldAbsorb){
      boundaries.splice(boundaries.length-2, 1);
    }
  }

  const chunks = [];
  for(let i=0;i<boundaries.length-1;i++){
    const startTotal = boundaries[i];
    const endTotal = boundaries[i+1];
    const isFirst = i===0;
    const isLast = i===boundaries.length-2;
    chunks.push({
      fromY: Math.floor(startTotal/12),
      fromM: isFirst ? fromM : (startTotal%12)+1,
      toY: Math.floor(endTotal/12),
      toM: isLast ? toM : (endTotal%12)+1
    });
  }
  return chunks;
}

// ---- 保険：文字列配列であるべき項目に古いオブジェクト配列データが残っていた場合の正規化 ----
// 文字列はそのまま使う。オブジェクトなら label を使う。それ以外は捨てる。
// 主修正はUI入力側（renderStringCheckList）。これはあくまで後方互換の保険。
function toLabelStrings(arr){
  if(!Array.isArray(arr)) return [];
  return arr.map(item=>{
    if(typeof item === 'string') return item;
    if(item && typeof item === 'object' && typeof item.label === 'string') return item.label;
    return null;
  }).filter(v=>v!==null);
}

// ---- base64文字列をArrayBufferに変換 ----
function base64ToArrayBuffer(base64){
  const binaryString = atob(base64);
  const len = binaryString.length;
  const bytes = new Uint8Array(len);
  for(let i=0;i<len;i++){ bytes[i] = binaryString.charCodeAt(i); }
  return bytes.buffer;
}

// ---- メイン：02.xlsx様式に値を差し込んでダウンロードする ----
// ---- downloadXlsxBuffer()：xlsxバッファをファイルとしてダウンロードする（既存処理を関数化） ----
// Step6で02.xlsx・04.xlsxの2ファイルを出力する必要が生じたため、既存の単発ダウンロード処理
// （Blob+a要素のクリック）を関数化して2回呼べるようにした。ZIP化等の新規ライブラリは導入していない
// （既存方針を踏襲。詳細はGPTへの報告の「出力物について」を参照）。
function downloadXlsxBuffer(buffer, filename){
  const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---- userFacingError()：利用者にそのまま見せてよい、対処方法込みのエラーを作る ----
// 【不具合修正・2026-07-22】以前はexportToOfficialForm()が投げる具体的なエラーメッセージ
// （16行超過時の対処方法など）が、呼び出し元（previewExportFormBtnのクリックハンドラ）の
// catchで握りつぶされ、利用者には常に汎用文言「作成に失敗しました。もう一度お試しください。」
// しか表示されていなかった。特に16行超過のような「再試行しても直らない」確定的なエラーで
// 「もう一度お試しください」とだけ表示するのは実態と合わない。
// ここでthrowするErrorに目印（userFacing:true）を付け、呼び出し元がその目印を見て
// 「安全に画面へそのまま出してよい、対処方法込みのメッセージ」かどうかを判定できるようにする。
// ExcelJS内部のエラーなど、想定外の技術的なエラー（目印なし）は従来通り汎用文言のままにし、
// 利用者に生の技術的なエラー文言を見せないようにする（console.errorでの記録は従来通り残す）。
function userFacingError(message){
  const err = new Error(message);
  err.userFacing = true;
  return err;
}

async function exportToOfficialForm(){
  if(typeof ExcelJS === 'undefined'){
    // ここでalertして握りつぶすと、呼び出し元（stepCh5Done）が「成功」とみなしてしまう。
    // 失敗として呼び出し元のcatchに伝え、ボタン側で失敗メッセージ・再試行可能な状態に戻す。
    throw userFacingError('ExcelJSライブラリの読み込みが完了していません。もう一度お試しください。');
  }

  const buffer = base64ToArrayBuffer(TEMPLATE_02_XLSX_BASE64);
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(buffer);

  const front = wb.getWorksheet('表');
  const back = wb.getWorksheet('裏');

  // ---- 表面：傷病名・発病日・初診日 ----
  // 現状モックには「傷病名」「発病日」「初診日」を直接聞く項目がないため、
  // 入力があれば反映、なければ空欄のままにする（将来ヒアリング項目を追加予定）
  if(state.byomei) front.getCell('M3').value = state.byomei;
  if(state.onset && state.onset.year){
    const [g,y] = yearToWareki(state.onset.year);
    front.getCell('H4').value = g;
    front.getCell('N4').value = y;
    front.getCell('Q4').value = state.onset.month || '';
  }
  if(state.firstVisit && state.firstVisit.year){
    const [g,y] = yearToWareki(state.firstVisit.year);
    front.getCell('AB4').value = g;
    front.getCell('AH4').value = y;
    front.getCell('AK4').value = state.firstVisit.month || '';
  }

  // ---- 表面・続紙：期間（Step6：Step5 row経路へ正式接続） ----
  // 旧 buildPeriodsForForm().slice(0,5) への直接依存はここで撤去した。
  // row生成 → 圧縮 → 02/04割り振り → 02/04書き込み、の順（仕様書5.5章・9.1章、Step6）。
  const currentRows = buildCurrentPeriodRows();
  // 02(5行)+04(11行)=16行が全体の枠。currentRowsが多い場合はその分過去編の使える枠が減る。
  const availableSlotsForPast = Math.max(0, 16 - currentRows.length);
  const compressed = compressPastRowsIfNeeded(availableSlotsForPast);
  if(compressed && compressed.error){
    // compressPastRowsIfNeeded()は明示エラーオブジェクトを返す方式（pure function方針）。
    // exportToOfficialForm()自体は既存throw方式（呼び出し元stepCh5Doneでcatchする設計）のため、
    // ここでthrowに変換して既存のエラーハンドリング経路に乗せる。
    throw userFacingError(compressed.message);
  }
  const pastRows = compressed;
  const { mainRows, continuationRows } = allocateRowsToMainAndContinuation(currentRows, pastRows);

  // 【4.4対応】compressPastRowsIfNeeded()は過去編（旧timeBucketデータ）しか圧縮対象にしないため、
  // 現状編（state.hospitals）由来の件数だけで16行の枠を超えるケースを検知できない。
  // 従来はこのままwriteRowsToContinuationSheet()まで進み、11件を超えた分がconsole.warnのみで
  // 無言で書き込まれずに終わっていた（利用者は気づけない）。ここで明示エラーにして、
  // 呼び出し元（previewExportFormBtn）のcatchでちゃんと利用者に伝わるようにする。
  if(continuationRows.length > CONTINUATION_CAPACITY){
    throw userFacingError(`通院記録・通院していない期間の件数が多く、書式の枠（16件）に${continuationRows.length - CONTINUATION_CAPACITY}件収まりません。記録の一部をまとめるか、通院していない期間の理由を調整してから、もう一度お試しください。`);
  }

  writeRowsToMainSheet(front, mainRows);

  // continuationRowsが1件以上ある場合のみ04.xlsxを生成する（0件なら04は不要・生成しない）
  let outBuffer04 = null;
  if(continuationRows.length > 0){
    const buffer04 = base64ToArrayBuffer(TEMPLATE_04_XLSX_BASE64);
    const wb04 = new ExcelJS.Workbook();
    await wb04.xlsx.load(buffer04);
    const front04 = wb04.getWorksheet('表');
    const back04 = wb04.getWorksheet('裏');
    writeRowsToContinuationSheet(front04, back04, continuationRows);
    outBuffer04 = await wb04.xlsx.writeBuffer();
  }

  // ---- 裏面：現在（請求日頃）の就労状況 ----
  const work = state.work || {};
  back.getCell('AP33').value = work.jobType || '';
  back.getCell('AW34').value = (work.commute||[]).join('・');
  const hm = COMMUTE_TIME_TO_HM[work.commuteTime];
  if(hm){
    back.getCell('BA35').value = hm[0];
    back.getCell('BJ35').value = hm[1];
  }
  back.getCell('BB36').value = work.workDays || '';
  back.getCell('AP37').value = (work.condition||[]).join('・');

  // 仕事をしていない理由
  const otherNoteParts = [];
  toLabelStrings(state.notWorkReasons).forEach(reason=>{
    const letter = NOTWORK_REASON_MAP[reason] || 'オ';
    const row = NOTWORK_REASON_ROW[letter];
    back.getCell(`AO${row}`).value = 'レ';
    if(letter==='オ' && reason!=='その他') otherNoteParts.push(reason);
  });
  if(state.notWorkReasons.includes('その他') && state.notWorkReasonOther) otherNoteParts.push(state.notWorkReasonOther);
  if(otherNoteParts.length) back.getCell('BC44').value = otherNoteParts.join('・');

  // ADL（10項目、現在セクション）
  Object.keys(state.adl||{}).forEach(key=>{
    const map = ADL_CELL_MAP[key];
    if(!map) return;
    const level = state.adl[key];
    const num = ADL_LEVEL_TO_NUM[level];
    if(!num) return;
    const col = map[num-1];
    const row = map[4];
    back.getCell(`${col}${row}`).value = 'レ';
  });

  // その他日常生活で不便（自由記述）
  let otherText = toLabelStrings(state.otherChips).join('・');
  if(state.otherNote){ otherText = otherText ? (otherText + '／' + state.otherNote) : state.otherNote; }
  back.getCell('AP55').value = otherText;

  // ---- 裏面：障害認定日頃の状況／障害者手帳（今回追加分。GPT指示書方針） ----
  // 既存のperiod rowロジック（buildCurrentPeriodRows等）やStep5/6の出力経路とは独立した処理。
  // enabled===falseの場合は何もせず、02裏面は元のプレースホルダのまま（既存出力に影響しない）。
  writeRecognitionSnapshotToBack(back, state.recognitionSnapshot);
  writeDisabilityNotebookToBack(back, state.disabilityNotebook);

  // ---- ファイル出力 ----
  // 02.xlsxは常にダウンロードする。04.xlsxはcontinuationRowsが1件以上ある場合のみ続けてダウンロードする。
  // ZIPにまとめる等のUI変更は行わず、既存の単発ダウンロード方式を2回呼ぶ形にとどめた
  // （新規ライブラリ導入や挙動変更は今回のスコープ外。詳細はGPTへの報告を参照）。
  const outBuffer = await wb.xlsx.writeBuffer();
  downloadXlsxBuffer(outBuffer, '病歴・就労状況等申立書.xlsx');
  if(outBuffer04){
    // 【決定#31・developmental mode対応時に発覚】a.click()による連続ダウンロードを間隔なしで2回発火すると、
    // ブラウザ（特にChrome）が「複数ファイルの自動ダウンロード」とみなして2件目をブロックすることが
    // あるため、1件目の処理が確実に始まってから2件目を発火するよう少し間隔を空ける。
    // developmental modeでフェーズ1の固定行が加わり、02+04の2ファイル出力（=continuationRowsが
    // 1件以上）が従来より起きやすくなったことで顕在化した。
    await new Promise(resolve => setTimeout(resolve, 300));
    downloadXlsxBuffer(outBuffer04, '病歴・就労状況等申立書(続紙).xlsx');
  }
}

    adlConvDone:false,
    completed:{ch1:false, ch2:false, ch3:false, ch4:false, ch5:false},

    pastFragments:[],          // PastFragment[]
    pastIdCounters:{ fragment:1 },
    pastPeriodSplitHints:[],   // 将来拡張用。v4.2時点・Step2時点では未使用・未読み書き
    stateVersion: CURRENT_STATE_VERSION,

    // 過去編：編集対象の管理は既存hospitalsと同じ「永続ID＋findIndex」方式（editingHospitalIdに揃える）
    editingPastFragmentId:null,

    // ===== 02裏面オプション入力：障害認定日頃の状況 / 障害者手帳 =====
    // ch5の年表完成確認画面（stepCh5Done）にオプションセクションとして置く。

    // enabled===trueの時のみ02裏面へ出力し、falseなら出力対象外で既存出力に影響しない。
    recognitionSnapshot:{
      enabled:false,
      // 認定日時点の就労状況。現在状況セクション（state.work相当）と同じ形を認定日時点用に複製。
      work:{status:null, jobType:'', commute:[], commuteTime:null, workDays:'', condition:[]},
      notWorkReasons:[],

      adl:{},

      otherTypeName:'', // typeが'その他'の場合の名称（02裏面「他・(　)」欄）

// ===== 過去編 state 移行処理（Phase4仕様書6.3章）=====
// loadStateFromStorage() の戻り値に対して必ず通す。
// 「無い場合のみ補う」が原則。既存フィールドは絶対に上書きしない。
function migrateAppState(raw){
  if(!raw || typeof raw !== 'object') return raw;
  const s = raw;

  // stateVersionが無い、または不正値の場合は version 1 相当として扱う
  const currentVersion = (typeof s.stateVersion === 'number' && s.stateVersion >= 1)
    ? s.stateVersion
    : 1;

  if(currentVersion < 2){
    // 過去編キーが無い場合のみ初期値で補う（既存データの上書きはしない）
    if(!Array.isArray(s.pastFragments)) s.pastFragments = [];
    if(!s.pastIdCounters || typeof s.pastIdCounters !== 'object'){
      s.pastIdCounters = { fragment:1 };
    }
    if(!Array.isArray(s.pastPeriodSplitHints)) s.pastPeriodSplitHints = [];
  }

  if(currentVersion < 3){
    // 02裏面オプション入力キーが無い場合のみ初期値で補う（既存データの上書きはしない）
    if(!s.recognitionSnapshot || typeof s.recognitionSnapshot !== 'object'){
      s.recognitionSnapshot = {
        enabled:false,
        work:{status:null, jobType:'', commute:[], commuteTime:null, workDays:'', condition:[]},
        notWorkReasons:[],
        adl:{},
        otherChips:[], otherNote:''
      };
    }
    if(!s.disabilityNotebook || typeof s.disabilityNotebook !== 'object'){
      s.disabilityNotebook = {
        enabled:false,
        type:'', otherTypeName:'', grade:'',
        acquiredKind:'none', acquiredYear:'', acquiredMonth:'', acquiredDay:'',
        disabilityName:'', note:''
      };
    }
  }

  if(currentVersion < 4){
    // 不就労理由「オ：その他」の自由記述欄が無い場合のみ初期値で補う（既存データの上書きはしない）
    if(typeof s.notWorkReasonOther !== 'string') s.notWorkReasonOther = '';
    if(s.recognitionSnapshot && typeof s.recognitionSnapshot === 'object'
       && typeof s.recognitionSnapshot.notWorkReasonOther !== 'string'){
      s.recognitionSnapshot.notWorkReasonOther = '';
    }
  }

  if(currentVersion < 5){
    // 西暦⇄元号切替フラグが無い場合のみ初期値で補う（ch5_place再設計仕様書4.6節）
    if(s.eraDisplayMode !== 'seireki' && s.eraDisplayMode !== 'wareki'){
      s.eraDisplayMode = 'seireki';
    }
    // eventPlacements を {bandIndex, order} 形式へ統一する（ch5_place再設計仕様書13章）。
    // 旧形式：{bandIndex:number}（orderが無い）、または文字列 'unknown'（帯不明）。
    // 新設計では「わからない」状態を廃止し、'unknown' は最後の帯（現在に最も近い帯）へ
    // 便宜的に割り当てる。既存の並び順を壊さないよう、帯ごとにorderを新規採番する。
    if(s.eventPlacements && typeof s.eventPlacements === 'object'){
      const bands = (function(){
        // migrateAppState実行時点ではbuildAgeBands()と同じロジックをここでも使えないため
        // （state未確定のグローバル関数に依存させない）、簡易に必要な情報だけ複製する。
        const birth = parseInt(s.profile && s.profile.birthYear);
        const size = (s.profile && s.profile.bandSize) || 5;
        const currentAge = birth ? (new Date().getFullYear() - birth) : null;
        if(!birth || currentAge===null) return [];
        const list = [];
        let startAge = 0;
        while(startAge < currentAge){
          const endAge = Math.min(startAge + size, currentAge);
          list.push({startAge, endAge});
          startAge += size;
        }
        if(list.length===0) list.push({startAge:0, endAge:currentAge});
        return list;
      })();
      const lastBandIndex = bands.length ? bands.length - 1 : 0;
      const orderCounters = {};
      Object.keys(s.eventPlacements).forEach(key=>{
        const p = s.eventPlacements[key];
        let bandIndex;
        if(p === 'unknown'){
          bandIndex = lastBandIndex;
        } else if(p && typeof p === 'object' && typeof p.bandIndex === 'number'){
          bandIndex = p.bandIndex;
        } else {
          delete s.eventPlacements[key];
          return;
        }
        if(typeof orderCounters[bandIndex] !== 'number') orderCounters[bandIndex] = 0;
        s.eventPlacements[key] = { bandIndex, order: orderCounters[bandIndex] };
        orderCounters[bandIndex] += 1;
      });
    }
  }

  if(currentVersion < 6){
    // 【病院データ一本化】ch7_hospital_add画面（過去編専用の病院追加画面）を廃止し、
    // 病院データはstate.hospitals（第4章）に一本化した。旧バージョンのs.pastHospitals
    // （PastHospital[]、from/toが'YYYY-MM'文字列、confidence3値目が'unsure'）が残っている場合、
    // データを消さずにstate.hospitalsへ変換して移す。断片側のlinkedHospitalId（旧文字列ID）も
    // 変換後の新しい数値IDへ付け替える。
    if(Array.isArray(s.pastHospitals) && s.pastHospitals.length > 0){
      if(!Array.isArray(s.hospitals)) s.hospitals = [];
      if(typeof s.nextHospitalId !== 'number') s.nextHospitalId = 1;
      const oldIdToNewId = {};
      s.pastHospitals.forEach(ph=>{
        const newId = s.nextHospitalId++;
        oldIdToNewId[ph.hospitalId] = newId;
        const fromMatch = (ph.from && typeof ph.from === 'string') ? ph.from.match(/^(\d{4})(?:-(\d{1,2}))?$/) : null;
        const toMatch = (ph.to && typeof ph.to === 'string') ? ph.to.match(/^(\d{4})(?:-(\d{1,2}))?$/) : null;
        s.hospitals.push({
          hospitalId: newId,
          name: ph.name || '',
          nameUnknown: !ph.name,
          fromYear: fromMatch ? parseInt(fromMatch[1],10) : undefined,
          fromMonth: fromMatch && fromMatch[2] ? parseInt(fromMatch[2],10) : undefined,
          toYear: (!ph.ongoing && toMatch) ? parseInt(toMatch[1],10) : undefined,
          toMonth: (!ph.ongoing && toMatch && toMatch[2]) ? parseInt(toMatch[2],10) : undefined,
          ongoing: !!ph.ongoing,
          confidence: ph.confidence === 'unsure' ? 'unknown' : (ph.confidence || 'unknown'),
          memo: ph.memo,
          relatedEvents: []
        });
      });
      if(Array.isArray(s.pastFragments)){
        s.pastFragments.forEach(f=>{
          if(f.linkedHospitalId && oldIdToNewId[f.linkedHospitalId] !== undefined){
            f.linkedHospitalId = oldIdToNewId[f.linkedHospitalId];
          } else if(f.linkedHospitalId){
            // 対応が見つからない孤立参照は安全側に倒して外す
            f.linkedHospitalId = undefined;
          }
        });
      }
    }
    delete s.pastHospitals;
    delete s.editingPastHospitalId;
    if(s.pastIdCounters && typeof s.pastIdCounters === 'object'){
      delete s.pastIdCounters.hospital;
    }
  }

  if(currentVersion < 7){
    // 【病院期間分割】state.hospitals[]をフラット構造から{..., periods:[...]}の2階層構造へ移行する
    // （病院期間分割_設計案.md 3.2節）。既存データは「1病院＝1期間」として自動的にラップされるだけで、
    // 見た目上の変化は起きない。periodIdはグローバル連番（fragmentIdと同じ命名規則）とし、
    // 格納場所はpastIdCountersではなく新規のstate.nextPeriodId（3.3節）とする。
    if(typeof s.nextPeriodId !== 'number') s.nextPeriodId = 1;
    if(Array.isArray(s.hospitals)){
      s.hospitals = s.hospitals.map(h=>{
        if(Array.isArray(h.periods)) return h; // 既に新構造なら触らない（保険）
        return {
          hospitalId: h.hospitalId,
          name: h.name,
          nameUnknown: h.nameUnknown,
          hospitalType: h.hospitalType, // 引き継ぎ漏れ厳禁（note生成・ch4_summary表示で使用。3.2節の修正点）
          relatedEvents: h.relatedEvents,
          periods: [{
            periodId: `pd_${s.nextPeriodId++}`,
            fromYear: h.fromYear, fromMonth: h.fromMonth,
            toYear: h.toYear, toMonth: h.toMonth,
            ongoing: h.ongoing,
            confidence: h.confidence,
            memo: h.memo
          }]
        };
      });
    }
    if(typeof s.editingPeriodId === 'undefined') s.editingPeriodId = null;
  }

  if(currentVersion < 8){
    // state.outputMode（developmental mode切替、決定#12）が無い場合のみ初期値で補う
    // （既存データの上書きはしない）。旧データは通院起点の出力のみだったため、
    // 安全側のデフォルトは常に'standard'（初診からの形式）。
    if(s.outputMode !== 'standard' && s.outputMode !== 'developmental'){
      s.outputMode = 'standard';
    }
  }

  // 不足キーの個別チェックとは独立して、バージョン番号自体は必ず最新へ更新する
  s.stateVersion = CURRENT_STATE_VERSION;

  return s;
}

// ===== 過去編：断片（PastFragment）CRUD関数群 =====
// Phase4仕様書5.1章。既存hospitalsと同じ「永続ID＋findIndex」方式で統一する。

// 役割：断片入力の検証。Phase4仕様書5.3章。
function validatePastFragment(input){
  const errors = [];
  if(input.text !== undefined && (!input.text || !input.text.trim())){
    errors.push('text_required');
  }
  return { valid: errors.length===0, errors };
}

// 役割：新規断片を追加する。Phase4仕様書5.1章。
// 【断片＝自作出来事カード】断片は出来事カードと同じくtext（内容）のみを持つ。
// 以前は追加時にtimeBucketも受け取っていたが、時期の管理はch5_placeへの配置に
// 一本化されたため、断片自体はもう時期の情報を持たない。
function addPastFragment(input){
  const check = validatePastFragment({ text: input.text });
  if(!check.valid) return null;
  const id = 'pf_' + state.pastIdCounters.fragment++;
  const fragment = {
    id,
    text: input.text.trim(),
    createdAt: new Date().toISOString()
  };
  state.pastFragments.push(fragment);
  return fragment;
}

// 役割：既存断片の一部フィールドを更新する。Phase4仕様書5.1章。
function updatePastFragment(id, patch){
  const idx = state.pastFragments.findIndex(f=>f.id===id);
  if(idx<0) return null;
  const safePatch = {...patch};
  if(safePatch.text !== undefined){
    const check = validatePastFragment({ text: safePatch.text });
    if(!check.valid) return null;
    safePatch.text = safePatch.text.trim();
  }
  state.pastFragments[idx] = {...state.pastFragments[idx], ...safePatch, updatedAt: new Date().toISOString()};
  return state.pastFragments[idx];
}

// 役割：断片を削除する。Phase4仕様書5.1章。
function deletePastFragment(id){
  const idx = state.pastFragments.findIndex(f=>f.id===id);
  if(idx<0) return false;
  state.pastFragments.splice(idx,1);
  return true;
}

// 【病院データ一本化について】
// 過去編は元々ここに専用のPastHospital CRUD関数群（validatePastHospital/addPastHospital/
// updatePastHospital/deletePastHospital）を持っていたが、ch7_hospital_add画面の廃止に伴い
// 削除した。病院の追加・修正・削除は、すべて第4章側（state.hospitals、stepCh4Confidence内の
// 保存処理、deleteCurrentHospital()）に一本化されている。過去編の断片（state.pastFragments）が
// この病院にリンクしている場合は、linkedHospitalId（病院のhospitalIdそのもの）を手がかりに
// 直接突き合わせる（buildPeriodsForForm()内、および本ファイル下部）だけで足りており、
// 病院データを過去編専用の形へ変換する処理は実際には不要だった。
// 【2026年7月削除】この目的のために用意されていたtoLegacyPastHospitalShape()/
// getLegacyPastHospitals()は、どこからも呼ばれていない死コードと判明したため削除済み
// （病院期間分割_設計案.md 5章、00_索引.md参照）。

// 現状編（第4章）の通院記録を削除する。
// computeGaps()は毎回state.hospitalsから計算し直す純粋関数のため、削除するだけで
// 空白期間（gap）の一覧は自動的に再計算される（削除した病院が関わるgapは消え、
// 新しく隣接した2件の間に新しいgapが生まれる可能性もある）。
// ただし、削除前に入力済みだったgapReasonsByKeyの理由データは、削除した病院のhospitalIdを
// 含むキーのままstateに残り続けてしまう（二度と参照されない孤立データ）ため、
// ここで該当キーを掃除しておく。
// 【病院データ一本化】過去編は元々専用のdeletePastHospital()でstate.pastFragmentsの
// linkedHospitalIdを掃除していたが、ch7_hospital_add廃止・state.hospitals一本化に伴い、
// 病院削除の入口はここ（第4章側）に統一された。そのため、過去編の断片が
// この病院にリンクしていた場合のlinkedHospitalId掃除も、ここで併せて行う。
function deleteCurrentHospital(hospitalId){
  const idx = state.hospitals.findIndex(h=>h.hospitalId===hospitalId);
  if(idx<0) return false;
  const periodIds = (state.hospitals[idx].periods || []).map(p=>p.periodId);
  state.hospitals.splice(idx,1);
  Object.keys(state.gapReasonsByKey).forEach(key=>{
    if(key.startsWith('period__')){
      // 決定#37：病院内gap（periodId同士のキー）。この病院のperiodが片方でも絡んでいれば削除。
      if(periodIds.some(pid=>key.includes(pid))) delete state.gapReasonsByKey[key];
      return;
    }
    const [id1, id2] = key.split('__').map(s=>parseInt(s));
    if(id1===hospitalId || id2===hospitalId){
      delete state.gapReasonsByKey[key];
    }
  });
  // 過去編の断片がこの病院にリンクしていた場合、断片自体は消さずlinkedHospitalIdのみ外す
  state.pastFragments.forEach(f=>{
    if(f.linkedHospitalId === hospitalId){
      f.linkedHospitalId = undefined;
    }
  });
  return true;
}

// ---- 決定#37：period単位の削除（B対応）。1病院を1枚ずつ表示するようにしたことに伴い、
// 削除も「その枚だけ」を対象にする。残り0枚になったら病院ごと削除する（既存の後始末を再利用）。
function deleteHospitalPeriod(hospitalId, periodId){
  const h = state.hospitals.find(h=>h.hospitalId===hospitalId);
  if(!h) return false;
  const pIdx = (h.periods||[]).findIndex(p=>p.periodId===periodId);
  if(pIdx<0) return false;
  h.periods.splice(pIdx,1);
  Object.keys(state.gapReasonsByKey).forEach(key=>{
    if(key.startsWith('period__') && key.includes(periodId)) delete state.gapReasonsByKey[key];
  });
  if(h.periods.length === 0) return deleteCurrentHospital(hospitalId);
  return true;
}

// 出来事カード（selectedEvents）が削除されたとき、通院記録側（state.hospitals[].relatedEvents、
// および入力中のstate.draft.relatedEvents）に残る孤立参照を掃除する。
// 「病院を思い出す」画面（ch4_memory_dig）で出来事idを手がかりとして保存した後、
// 第3章に戻ってその出来事を削除した場合に、findEventLabel()が解決できないidが
// 通院記録一覧にそのまま表示されてしまう問題への対処（deleteCurrentHospitalの
// gapReasonsByKeyクリーンアップと同じ方針）。
function removeEventIdFromRelatedEvents(eventId){
  state.hospitals.forEach(h=>{
    if(Array.isArray(h.relatedEvents)){
      const idx = h.relatedEvents.indexOf(eventId);
      if(idx>=0) h.relatedEvents.splice(idx,1);
    }
  });
  if(state.draft && Array.isArray(state.draft.relatedEvents)){
    const idx = state.draft.relatedEvents.indexOf(eventId);
    if(idx>=0) state.draft.relatedEvents.splice(idx,1);
  }
}

// 【病院データ一本化】以前はbadgeForPastConfidence()（PAST_HOSPITAL_CONFIDENCEの3値目'unsure'用）
// を別途持っていたが、病院データがstate.hospitals（第4章、3値目'unknown'）に一本化されたため、
// 過去編側の表示も既存のbadgeForConfidence()をそのまま使うようにした。

// =====================================================================
// 過去編：group / row 生成ロジック（Phase4仕様書5.3〜5.4章）。Step4。
// 重要：このセクションの関数はすべて pure function 寄りに作る。
// state.pastFragments / state.hospitals を「読む」のみで、一切書き換えない。
// 戻り値で完結させ、state.cachedXxx のような形でキャッシュ保存は絶対に行わない
// （導出データは永続保存しない方針。仕様書4-2章・6.8章）。
// buildPastPeriodGroups() / convertPastGroupsToFormRows() の2段階分離は崩さない。
//
// 【病院データ一本化について】
// 過去編は元々state.pastHospitals（ch7_hospital_add画面で入力）という専用の病院配列を
// 持っていたが、第4章（ch4_hospital_name〜ch4_confidence）と入力項目が完全に重複していた
// ため、ch7_hospital_addを廃止し、過去編のHospitalGroup生成もstate.hospitals（第4章のデータ）
// を入力元とするよう一本化した。state.hospitals自体の保存形式は変更していない。
// 【2026年7月削除】一本化にあたり、第4章形式を過去編ロジック向けの別形式へ変換する
// toLegacyPastHospitalShape()/getLegacyPastHospitals()を用意していたが、実際には
// buildPeriodsForForm()側がlinkedHospitalId（hospitalIdそのもの）で直接突き合わせる
// だけで完結しており、この変換は一度も呼び出されないまま死コード化していたため削除した
// （病院期間分割_設計案.md 5章、00_索引.md参照）。
// =====================================================================

// ---- 補助：断片id→断片オブジェクトのMap（仕様書5.3章） ----
function buildFragmentMap(fragments){
  // 引数を受け取れるようにし、テストや将来の差し替えを容易にする。
  // 省略時はstate.pastFragmentsを参照する（既存の呼び出しパターンに合わせる）。
  const list = fragments || state.pastFragments;
  const map = new Map();
  list.forEach(f=>map.set(f.id, f));
  return map;
}

// ---- student分割トリガー判定（仕様書B-3） ----
// 閾値は仮値。10章で未決論点として明示されている定数なので、変更しやすいようファイル先頭級の定数にしてもよいが、
// Step4時点ではこの関数内に留める（呼び出し側が増えてから定数へ切り出す）。
const PAST_STUDENT_SPLIT_THRESHOLD = 5; // 断片数がこれ以上ならstudent分割を検討する仮値（仕様書10-1章）
function shouldSplitStudentBucket(studentFragments){
  if(studentFragments.length >= PAST_STUDENT_SPLIT_THRESHOLD) return true;
  // timeDetailが設定されている断片が複数あり、内容上の時期差が読み取れる場合も分割対象（仕様書B-3）。
  // Step4時点では「内容上の時期差の読み取り」は自動判定が難しいため、
  // 「timeDetailが設定されている断片が2件以上」という単純な代理条件で近似する。
  const withDetail = studentFragments.filter(f=>f.timeDetail && f.timeDetail.trim());
  if(withDetail.length >= 2) return true;
  return false;
}

// student分割時のサブグループ分け（仕様書B-3：粗いラベル「学生前期」「学生後期」）。
// Step4時点では厳密な時期判定ロジックを持たないため、timeDetailの有無で前期/後期に振り分ける
// 暫定実装とする（timeDetailありを後期寄りとみなす根拠はない。これは仮置き。詳細はD節で報告）。
function splitStudentFragmentsIntoSubGroups(studentFragments){
  // createdAtの古い順に並べ、半分で前期/後期に分ける、という最も単純な暫定ルール。
  // 「内容上の時期差」を厳密に読み取る自動判定はStep4のスコープ外（B-3参照）。
  const sorted = [...studentFragments].sort((a,b)=> new Date(a.createdAt) - new Date(b.createdAt));
  const mid = Math.ceil(sorted.length / 2);
  const former = sorted.slice(0, mid);
  const latter = sorted.slice(mid);
  const subGroups = [];
  if(former.length){
    subGroups.push({ type:'preClinicalBucket', bucket:'student', subBucketLabel:'学生前期', fragmentIds: former.map(f=>f.id) });
  }
  if(latter.length){
    subGroups.push({ type:'preClinicalBucket', bucket:'student', subBucketLabel:'学生後期', fragmentIds: latter.map(f=>f.id) });
  }
  return subGroups;
}

// ---- buildPastPeriodGroups()：標準順に並んだPastPeriodGroup[]を構築（仕様書5.4章、B-9） ----
// 【断片の設計変更に伴う注記】断片は現在「内容（text）のみ」で作られ、timeBucket/
// linkedHospitalIdはもう新規には設定されない（時期の管理はch5_placeでの配置に一本化された。
// 断片＝自作出来事カードという位置づけ）。この関数のtimeBucket/linkedHospitalIdによる
// グループ分けは、旧バージョンでこれらのフィールドを持って作られた既存データのみに対して
// 意味を持つ後方互換ロジックであり、新規に作られる断片は（timeBucketがundefinedのため）
// どのbucketにも該当せず、unknownFragmentsの判定（f.timeBucket==='unknown'）にも
// 該当しないため、このままではExcel出力（過去編側）に一切現れない。
// 将来、断片をch5_placeでの配置（eventPlacements）を根拠にExcel出力へ合流させる方針
// （出来事カードのbuildEventYearRanges()と同じ扱いにする）を別途実装する予定。
function buildPastPeriodGroups(options){
  const opts = options || {};
  const allowStudentSplit = opts.allowStudentSplit !== false; // 省略時はtrue
  const fragments = state.pastFragments;

  const groups = [];
  const consumedFragmentIds = new Set(); // ①PreClinicalBucketGroupに吸収された断片IDを記録（③unknownFallback判定に使う）。
  // 病院にリンクされた断片（旧データのlinkedHospitalId持ち）はここに追加しなくてよい。③の絞り込み
  // 条件自体に「!f.linkedHospitalId」があるため、リンク済み断片は元から③の対象外になる。

  // --- ① PreClinicalBucketGroup群：child → student → working（仕様書B-9） ---
  // 新規断片はtimeBucketを持たないため、このfilterは常に空になる（旧データのみ該当）。
  ['child','student','working'].forEach(bucket=>{
    const bucketFragments = fragments.filter(f=>!f.linkedHospitalId && f.timeBucket===bucket);
    if(bucketFragments.length===0) return;
    if(bucket==='student' && allowStudentSplit && shouldSplitStudentBucket(bucketFragments)){
      const subGroups = splitStudentFragmentsIntoSubGroups(bucketFragments);
      subGroups.forEach(g=>{
        groups.push(g);
        g.fragmentIds.forEach(id=>consumedFragmentIds.add(id));
      });
    } else {
      groups.push({ type:'preClinicalBucket', bucket, fragmentIds: bucketFragments.map(f=>f.id) });
      bucketFragments.forEach(f=>consumedFragmentIds.add(f.id));
    }
  });

  // --- ② HospitalGroup / GapGroup（病院・空白期間の行） ---
  // 【病院データ一本化に伴う重複防止】以前はここで、過去編専用の病院データ（state.pastHospitals）
  // からHospitalGroup・GapGroupを生成していた。病院データがstate.hospitals（第4章）に一本化された
  // ことで、これらの行は現状編側（buildCurrentPeriodRows→buildPeriodsForForm、computeGaps）が
  // 既に生成するようになったため、ここで同じstate.hospitalsから再度生成すると、同じ病院・同じ
  // 空白期間が二重に出力されてしまう（プレビュー・Excel出力どちらにも影響する重大な不具合だった）。
  // そのため、過去編はこのグループを生成しない。病院にリンクされた断片（linkedFragmentIds）の
  // テキストや病院のmemoは、現状編側のbuildPeriodsForForm()のnote組み立てに合流させている
  // （buildHospitalGroupNote()の考え方をそちらへ移した）。
  // 過去編がここで扱うのは、①病院にリンクしていない断片（child/student/working）と
  // ③病院にリンクしていないunknown断片のみ。

  // --- ③ UnknownFallbackGroup：常に最後尾、1件のみ（仕様書B-4、B-9） ---
  // 新規断片はtimeBucketを持たない（undefined）ため、この条件にも該当しない（旧データのみ該当）。
  const unknownFragments = fragments.filter(f=>
    !consumedFragmentIds.has(f.id) && !f.linkedHospitalId && f.timeBucket==='unknown'
  );
  if(unknownFragments.length > 0){
    groups.push({ type:'unknownFallback', fragmentIds: unknownFragments.map(f=>f.id) });
  }

  return groups;
}

// ---- note生成補助：文字数で間引く際の簡易ヘルパー（仕様書B-6共通） ----
const PAST_NOTE_MAX_LENGTH = 200; // 続紙の状況欄に収まる目安の仮値（10章未決論点と同様、調整可能パラメータ）
function pickFragmentText(fragment){
  // memo優先、空ならtext（仕様書B-6①②共通ルール）
  return (fragment.memo && fragment.memo.trim()) ? fragment.memo.trim() : fragment.text;
}

// ---- buildPreClinicalBucketNote()：PreClinicalBucketGroupのnote（仕様書B-6②） ----
function buildPreClinicalBucketNote(group, fragmentMap){
  const texts = group.fragmentIds
    .map(id=>fragmentMap.get(id))
    .filter(Boolean)
    .map(f=>pickFragmentText(f))
    .filter(t=>t && t.trim());

  let combined = texts.join('／');
  if(combined.length > PAST_NOTE_MAX_LENGTH){
    // 長すぎる場合：memoがある断片＞timeDetailがある断片＞その他の順で残す（仕様書B-6②）
    const fragments = group.fragmentIds.map(id=>fragmentMap.get(id)).filter(Boolean);
    const scored = fragments.map(f=>({
      f,
      priority: (f.memo && f.memo.trim()) ? 2 : ((f.timeDetail && f.timeDetail.trim()) ? 1 : 0)
    })).sort((a,b)=>b.priority - a.priority);
    let remaining = PAST_NOTE_MAX_LENGTH;
    const kept = [];
    for(const {f} of scored){
      const t = pickFragmentText(f);
      if(!t || !t.trim()) continue;
      if(remaining <= 0) break;
      if(t.length <= remaining){ kept.push(t); remaining -= t.length; }
    }
    combined = kept.join('／');
  }
  return combined;
}

// ---- buildUnknownFallbackNote()：UnknownFallbackGroupのnote（仕様書B-6④） ----
const PAST_UNKNOWN_FALLBACK_MAX_ITEMS = 5; // 上位N件の仮値（仕様書10章未決論点。10-1章でN=5を提案済み）
function buildUnknownFallbackNote(group, fragmentMap){
  const fragments = group.fragmentIds.map(id=>fragmentMap.get(id)).filter(Boolean);
  // 優先順位：①memoがある断片 ②timeDetailがある断片 ③textが具体的な断片（仕様書B-6④）
  const scored = fragments.map(f=>({
    f,
    priority: (f.memo && f.memo.trim()) ? 2 : ((f.timeDetail && f.timeDetail.trim()) ? 1 : 0)
  })).sort((a,b)=>b.priority - a.priority);

  const totalCount = scored.length;
  const top = scored.slice(0, PAST_UNKNOWN_FALLBACK_MAX_ITEMS);
  const texts = top.map(({f})=>pickFragmentText(f)).filter(t=>t && t.trim());
  let combined = texts.join('／');
  if(totalCount > PAST_UNKNOWN_FALLBACK_MAX_ITEMS){
    combined += (combined ? '。' : '') + '（他にも時期不明の出来事あり）';
  }
  return combined;
}

// ---- from/toの表示ラベル生成（仕様書B-5：from/to不明時は「時期不明」） ----
function formatPastDateLabel(dateStr){
  return (dateStr && dateStr.trim()) ? dateStr.trim() : '時期不明';
}

// ---- parsePastYearMonth()：PastHospital.from/to・gap.from/toの'YYYY-MM'または'YYYY'文字列を年月に分解する ----
// Step6追加。past側の日付は'YYYY-MM'形式の文字列（型定義4-1章）で保持されているため、
// Excel書き込み用のdate partsを作るにはここで数値に分解する必要がある。
// 形式が想定と異なる場合（手入力データの後方互換等）は安全側に倒してkind:'none'相当（null）を返す。
// B-2修正：年のみ('YYYY')入力も受け付ける。月が無い場合はmonth:undefinedを返し、
// 呼び出し元（convertPastGroupsToFormRows）でkind:'y'（年のみ）として扱えるようにする
// （年情報がパース失敗で丸ごと欠落していた問題の修正。以前は'YYYY-MM'形式以外は常にnull＝kind:'none'扱いだった）。
function parsePastYearMonth(dateStr){
  if(!dateStr || typeof dateStr !== 'string') return null;
  const trimmed = dateStr.trim();

  const ym = trimmed.match(/^(\d{4})-(\d{1,2})$/);
  if(ym){
    const year = parseInt(ym[1], 10);
    const month = parseInt(ym[2], 10);
    if(!year || !month || month < 1 || month > 12) return null;
    return { year, month };
  }

  const yOnly = trimmed.match(/^(\d{4})$/);
  if(yOnly){
    const year = parseInt(yOnly[1], 10);
    if(!year) return null;
    return { year, month: undefined };
  }

  return null;
}

// ---- yearMonthKind()：parsePastYearMonth()の結果からExcel書き込み用kindを判定する ----
// B-2修正で追加。year+monthが揃えば'ym'、yearのみなら'y'、パース失敗(null)なら'none'。
// fromKind/toKindの判定が4箇所（hospital from/to、gap from/to）に分散していたため、
// 判定ロジックを1箇所にまとめ、年のみ入力の扱いが分岐ごとに食い違わないようにする。
function yearMonthKind(ym){
  if(!ym) return 'none';
  return ym.month ? 'ym' : 'y';
}

const PAST_BUCKET_FIXED_LABELS = { child:'子供のころ', student:'学生時代', working:'働き始めてから' };

// ---- convertPastGroupsToFormRows()：PastPeriodGroup[]をPastFormPeriodRow[]に変換（仕様書5.4章） ----
// Step6改修：hospital/gapはfrom/toが'YYYY-MM'形式の文字列を持つため、parsePastYearMonth()で
// 数値に分解しdate partsとして両持ちする。preClinicalBucket/unknownFallbackはそもそも特定の
// 年月を持たない設計（B-9等）のため、kind:'none'のまま（Excel日付セルには書き込まず空欄にする。
// 書き込み側がnote欄にラベルを残す）。
function convertPastGroupsToFormRows(groups){
  const fragmentMap = buildFragmentMap(state.pastFragments);

  // 日付なしrow用の共通date parts（preClinicalBucket・unknownFallback・パース失敗時に使う）
  const NO_DATE_PARTS = { fromKind:'none', fromYear:undefined, fromMonth:undefined, toKind:'none', toYear:undefined, toMonth:undefined, toDay:undefined };

  return groups.map(group=>{
    try{
      if(group.type==='gap'){
        const fromYM = parsePastYearMonth(group.from);
        const toYM = parsePastYearMonth(group.to);
        return {
          fromLabel: formatPastDateLabel(group.from),
          toLabel: formatPastDateLabel(group.to),
          visited: false,
          note: '', // GapGroupのnoteは空欄可（仕様書B-6③）。将来拡張：手動メモ・明示リンク
          sourceGroupType: 'gap',
          isUnknownFallback: false,
          // デバッグ用：どの病院間のgapかをIDで残す（圧縮・割り振り時の追跡を容易にする）
          sourcePrevHospitalId: group.prevHospitalId,
          sourceNextHospitalId: group.nextHospitalId,
          fromKind: yearMonthKind(fromYM),
          fromYear: fromYM ? fromYM.year : undefined,
          fromMonth: fromYM ? fromYM.month : undefined,
          toKind: yearMonthKind(toYM),
          toYear: toYM ? toYM.year : undefined,
          toMonth: toYM ? toYM.month : undefined,
          toDay: undefined
        };
      }
      if(group.type==='preClinicalBucket'){
        const baseLabel = PAST_BUCKET_FIXED_LABELS[group.bucket] || group.bucket;
        const label = group.subBucketLabel ? `${baseLabel}（${group.subBucketLabel}）` : baseLabel;
        const note = buildPreClinicalBucketNote(group, fragmentMap);
        return {
          fromLabel: label,
          toLabel: label,
          visited: false,
          note,
          sourceGroupType: 'preClinicalBucket',
          isUnknownFallback: false,
          sourceBucket: group.bucket,
          ...NO_DATE_PARTS
        };
      }
      if(group.type==='unknownFallback'){
        const note = buildUnknownFallbackNote(group, fragmentMap);
        return {
          fromLabel: '時期不明',
          toLabel: '時期不明',
          visited: false,
          note,
          sourceGroupType: 'unknownFallback',
          isUnknownFallback: true,
          ...NO_DATE_PARTS
        };
      }
    }catch(err){
      // 個々のgroupでnote生成に失敗しても処理全体を止めない（仕様書5.4章）
      console.warn('過去編row変換でエラーが発生しました（このgroupはnote空文字で続行）', group, err);
      return {
        fromLabel: '時期不明',
        toLabel: '時期不明',
        visited: false,
        note: '',
        sourceGroupType: group.type==='unknownFallback' ? 'unknownFallback' : (group.type || 'unknownFallback'),
        isUnknownFallback: group.type==='unknownFallback',
        ...NO_DATE_PARTS
      };
    }
    // 想定外のgroup種別（理論上到達しないが、安全側に倒す）
    return { fromLabel:'時期不明', toLabel:'時期不明', visited:false, note:'', sourceGroupType:'unknownFallback', isUnknownFallback:true, ...NO_DATE_PARTS };
  });
}

// Step5：現状編との接続・圧縮・割り振り（Phase4仕様書5.5章、9.1章）
