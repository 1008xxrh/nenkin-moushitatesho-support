// ---- buildCurrentPeriodRows()：現状編dataをFormPeriodRow[]へ正規化（仕様書5.5章、9.1章） ----
// 既存buildPeriodsForForm()のロジック自体は変更していない（独自の数値分解形式はそのまま）。
// Step6改修：表示用ラベルに加え、Excel書き込み用のdate parts（fromKind/fromYear/fromMonth等）を
// 両持ちする。現状編は元々数値の年月を持っているため、ここでその数値をそのままdate partsへ転記する
// （ラベル文字列に潰す前の情報を失わない）。
// 返却順は古い→新しい固定（buildPeriodsForForm()が既にsortKey昇順でソート済みなので、その順序をそのまま使う）。
// 絞り込み（.slice(0,5)）は行わない。絞り込みはallocateRowsToMainAndContinuation()側で一元管理する（9.1章）。
function buildCurrentPeriodRows(){
  const periods = buildPeriodsForForm(); // Step5でこの関数自体は.slice(0,5)を外した（絞り込み前の全件を返す）
  return periods.map(period=>{
    const fromLabel = formatCurrentDateLabel(period.fromY, period.fromM);
    const toLabel = period.toIsNow ? '現在' : formatCurrentDateLabel(period.toY, period.toM);

    const fromKind = period.fromY ? (period.fromM ? 'ym' : 'y') : 'none';

    let toKind, toYear, toMonth, toDay;
    if(period.toIsNow){
      toKind = 'now';
      // buildPeriodsForForm()はtoIsNowの場合、period.toY/toMに既に記入日の年月を入れている（177〜180行目）。
      // 既存exportToOfficialForm()は元号/年/月「も」記入日から書いていたため、ここで両方転記する
      // （toDayだけ持たせると年月セルが空欄になってしまい、既存挙動から後退する）。
      toYear = period.toY || undefined;
      toMonth = period.toM || undefined;
      toDay = getFormFillDate().day;
    } else {
      toKind = period.toY ? (period.toM ? 'ym' : 'y') : 'none';
      toYear = period.toY || undefined;
      toMonth = period.toM || undefined;
    }

    return {
      fromLabel,
      toLabel,
      visited: !!period.visited,
      hospitalName: period.hospitalName || undefined,
      note: period.note || '',
      fromKind,
      fromYear: period.fromY || undefined,
      fromMonth: period.fromM || undefined,
      toKind,
      toYear,
      toMonth,
      toDay
    };
  });
}

// 現状編の年/月をラベル文字列に変換する補助（過去編のformatPastDateLabel()とは別。現状編は西暦年月の数値を持つため）
function formatCurrentDateLabel(year, month){
  if(!year) return '時期不明';
  return month ? `${year}年${month}月` : `${year}年`;
}

// ---- mergeAllPeriodRows()：単純結合と件数集計のみ（仕様書5.5章、圧縮も割り振りもしない） ----
function mergeAllPeriodRows(currentRows, pastRows){
  return {
    currentRows,
    pastRows,
    totalCount: currentRows.length + pastRows.length,
    currentCount: currentRows.length,
    pastCount: pastRows.length
  };
}

// ---- compressPastRowsIfNeeded()：必要に応じてgroup段階から再構成するオーケストレータ（仕様書5.5章A案） ----
// row配列を直接splice・並べ替えしない。buildPastPeriodGroups()のオプションを変えて呼び直すだけ。
// 順序の決定権は常にbuildPastPeriodGroups()にあり、この関数は順序を変更しない（GPT確認2の前提）。
function compressPastRowsIfNeeded(availableSlots, options){
  // ===== この関数の3段階の役割（誤解しやすいので明記） =====
  // 第1段階・第2段階：実際に行数を減らす（student分割の解除によりgroupの数自体が減る）。
  // 第3段階：行数は削減しない。unknownFallback行1件分のnoteの文字数を短縮するだけの処理。
  //   関数名・呼び出し元の文言（「圧縮」「まとめて出力」等）から、第3段階も行数を減らす
  //   ように見えるが、実際にはrows.lengthは第3段階の前後で変化しない。
  //   そのため、第1・2段階で収まらなかった場合、第3段階を経てもavailableSlotsに収まらなければ
  //   必ずエラーになる（このことはB-4で確認済み。今回はコメント整理のみで、行数削減化などの
  //   ロジック変更は行わない）。
  //
  // 【2026年7月セッションで整理】以前はpastFragments/pastHospitalsを引数で受け取っていたが、
  // 関数内部は常にstate.pastFragments（buildPastPeriodGroups()経由）を直接参照する設計のため、
  // 実際には一度も使われていなかった（仕様書9章 技術的負債#5）。呼び出し側は必ずstateの値を
  // そのまま渡していたため実害は無かったが、シグネチャを実態に合わせて整理した。

  // 第1段階：通常設定（student分割あり）でgroup→row生成
  let groups = buildPastPeriodGroups({ allowStudentSplit: true });
  let rows = convertPastGroupsToFormRows(groups);
  if(rows.length <= availableSlots) return rows;

  // 第2段階：student分割を解除してgroup→row再生成
  groups = buildPastPeriodGroups({ allowStudentSplit: false });
  rows = convertPastGroupsToFormRows(groups);
  if(rows.length <= availableSlots) return rows;

  // 第3段階：それでも超える場合、unknownFallback行のnoteをさらに短縮する。
  // ★この段階は行数削減ではない。unknownFallback note の短縮のみ。★
  // 「行数」自体はunknownFallbackが元々1行のため、ここでの処理はnoteの短縮のみであり、
  // rows.length（行数）はこの段階の前後で変化しない（B-7：unknownFallbackは最後尾の補助扱いで
  // 最初に削減対象になるが、1行を0行にする「削除」は現行の仕様書には明記されていないため、
  // note短縮に留めている）。
  const fallbackIdx = rows.findIndex(r=>r.isUnknownFallback);
  if(fallbackIdx >= 0){
    const fragmentMap = buildFragmentMap(state.pastFragments);
    const fallbackGroup = groups.find(g=>g.type==='unknownFallback');
    if(fallbackGroup){
      // 上位N件をさらに絞った短縮版のnoteで上書きする（既存のbuildUnknownFallbackNote()のN件上限を
      // さらに半分に絞った簡易版。厳密な再帰的圧縮ロジックは仕様書10章の未決論点）
      const shortened = buildUnknownFallbackNote(
        { ...fallbackGroup, fragmentIds: fallbackGroup.fragmentIds.slice(0, Math.max(1, Math.floor(PAST_UNKNOWN_FALLBACK_MAX_ITEMS/2))) },
        fragmentMap
      );
      rows[fallbackIdx] = { ...rows[fallbackIdx], note: shortened };
    }
  }
  if(rows.length <= availableSlots) return rows;

  // 第3段階でも収まらない場合：明示エラーを返す（投げない）。
  // 既存実装のexportToOfficialForm()はErrorをthrowする方式（呼び出し元でcatchする設計）だが、
  // この関数はpure function寄りに保ちたいため、呼び出し側が判定しやすい明示エラーオブジェクトを返す方式に統一する。
  // （呼び出し元のExcel接続（Step6）でthrowに変換するかどうかは、その時点で既存throw方式に合わせて判断する）
  return {
    error: true,
    code: 'PAST_ROWS_OVERFLOW',
    // 【2026-07-22修正】以前は「通院の記録・通院していない期間の理由を調整してから、
    // もう一度お試しください」という対処法を添えていたが、この圧縮ロジック（過去編＝旧データ
    // 移行専用の自動圧縮）に対して利用者がUI上でどう手を加えれば収まるのかは、まだ検討・
    // 実装していない。存在しない対処法を書くと解決策があるかのように誤解させるため、
    // 「収まらない」という事実（件数・枠）だけを明確に伝える文言に変更した。
    message: `過去の記録（${rows.length}件）が、病歴・就労状況等申立書と続紙に入る件数（${availableSlots}件）を超えているため、Excelを作成できません。`,
    rows // 参考情報として、収まらなかった現在のrowsも返す
  };
}

// ---- allocateRowsToMainAndContinuation()：02/04割り振りの決定のみ（仕様書5.5章、B-8、B-10） ----
// B-10準拠：currentRowsが5件未満の場合、過去編からの02補充は「pastRows標準順の末尾から」取る。
// 理由：currentRowsは古い→新しいの順で02に並ぶため、その後ろの空き枠には
// 「現状に最も近い過去」を入れる必要があり、それはpastRows標準順の末尾側にある。
//
// 修正履歴：当初の擬似コード（pastRows.slice(-remaining)のみ）は、unknownFallback行を
// 02補充対象から除外する処理を含んでおらず、B-10「unknownFallbackは02補充対象から除外する」
// と矛盾する実装になっていた。本修正で、isUnknownFallbackによるフィルタを明示的に追加し、
// unknownFallback行が機械的にmainRowsへ混入する不具合を解消した。
function allocateRowsToMainAndContinuation(currentRows, pastRows){
  if(currentRows.length >= 5){
    // 1) currentRows.length >= 5 の場合：過去編からの02補充はしない（pastRowsには手を触れない）
    const mainRows = currentRows.slice(0, 5);
    const continuationRows = currentRows.slice(5).concat(pastRows);
    return { mainRows, continuationRows };
  }

  // 2) currentRows.length < 5 の場合：
  //    02補充対象はpastRows全体ではなく、isUnknownFallback !== true の行のみ。
  //    unknownFallback行はmainRowsの穴埋めに使わず、常にcontinuationRowsに残す。
  const remaining = 5 - currentRows.length;

  const normalPastRows = pastRows.filter(r => !r.isUnknownFallback);
  const unknownFallbackRows = pastRows.filter(r => r.isUnknownFallback);

  // normalPastRowsがremaining件に満たない場合は、ある分だけ補充して終わる
  // （unknownFallbackで穴埋めしない）
  const takeCount = Math.min(remaining, normalPastRows.length);
  const pastRowsForMain = normalPastRows.slice(-takeCount);
  const normalPastRowsForContinuation = normalPastRows.slice(0, normalPastRows.length - takeCount);

  const mainRows = currentRows.concat(pastRowsForMain);
  // unknownFallbackは標準順で常に最後尾にあるため、continuationRowsでも最後尾に連結する
  const continuationRows = normalPastRowsForContinuation.concat(unknownFallbackRows);
  return { mainRows, continuationRows };
}

// =====================================================================
// Step6：writeRowsToMainSheet() / writeRowsToContinuationSheet()
// 02.xlsx・04.xlsxの実テンプレ確認（Step6前半）で確定したセル番地に基づき、
// FormPeriodRow[]をExcelワークシートへ書き込む。
// =====================================================================

// ---- colOffset()：列文字（単一英大文字。A〜Zの範囲のみ対応）をn列分ずらす ----
// 本仕様書の対象セルはD〜R程度の範囲（単一文字）に収まるため、複数文字列（AA等）は扱わない。
function colOffset(col, n){
  return String.fromCharCode(col.charCodeAt(0) + n);
}

// ---- writeDatePart()：1つの日付（from側 or to側）を元号/年/月/日セルへ書き込む ----
// kind:
//   'ym'  → 元号・年・月を書く
//   'y'   → 元号・年のみ書く（月は空欄）
//   'now' → 元号・年・月・日を書く（現在も継続中。dayは記入日）
//   'none'/未設定 → 全セルを空欄にする（placeholderテキストを残さないよう明示的に空文字を書く）
function writeDatePart(ws, eraCol, yearCol, monthCol, dayCol, row0, kind, year, month, day){
  if(kind === 'none' || !kind){
    ws.getCell(`${eraCol}${row0}`).value = '';
    ws.getCell(`${yearCol}${row0}`).value = '';
    ws.getCell(`${monthCol}${row0}`).value = '';
    if(dayCol) ws.getCell(`${dayCol}${row0}`).value = '';
    return;
  }
  const [g, y] = yearToWareki(year);
  ws.getCell(`${eraCol}${row0}`).value = g;
  ws.getCell(`${yearCol}${row0}`).value = y;
  ws.getCell(`${monthCol}${row0}`).value = (kind === 'y') ? '' : (month || '');
  if(dayCol){
    ws.getCell(`${dayCol}${row0}`).value = (kind === 'now' && typeof day === 'number') ? day : '';
  }
}

// ---- writePeriodRowBlock()：1period分（5物理行）を共通ロジックで書き込む ----
// 02表・04表・04裏は「元号列を起点に、受診した=+1列・年=+5列・受診していない=+6列・月=+7列・日=+9列・
// 医療機関名=起点と同列」という共通レイアウトを持つ（Step6実テンプレ確認で確定。仕様書7.2の
// K/M/O列記載はラベル文字セルであり入力セルではなかったため、本実装ではJ/L/N側＝起点+5/+7/+9を採用）。
// 状況(note)欄の開始列は、02表のみ起点+13列（Q列が薄いスペーサーとして単独結合されている特殊構造）、
// 04表/04裏は起点+12列という実テンプレ確認済みの違いがあるため、noteColは呼び出し側で明示的に渡す。
//
// row.fromKind==='none'（preClinical・unknownFallback等、年月を持たないrow）の場合：
// 日付セルは仕様どおり空欄にするが、rowの意味（どの時期の記述か）が消えないよう、
// note欄の先頭に【fromLabel】を付与する（buildPreClinicalBucketNote()等が生成するnote本文自体は
// 変更しない。あくまでこの書き込み関数側での表示時の付加情報）。
function writePeriodRowBlock(ws, eraCol, noteCol, r0, row){
  const yearCol = colOffset(eraCol, 5);
  const monthCol = colOffset(eraCol, 7);
  const dayCol = colOffset(eraCol, 9);
  const checkYesCol = colOffset(eraCol, 1);
  const checkNoCol = colOffset(eraCol, 6);
  const nameCol = eraCol;

  const r1 = r0 + 1;
  const checkRow = r0 + 2;
  const nameRow = r0 + 3;
  const noteRow = r0 + 1;

  writeDatePart(ws, eraCol, yearCol, monthCol, null, r0, row.fromKind, row.fromYear, row.fromMonth, undefined);
  writeDatePart(ws, eraCol, yearCol, monthCol, dayCol, r1, row.toKind, row.toYear, row.toMonth, row.toDay);

  ws.getCell(`${checkYesCol}${checkRow}`).value = row.visited ? 'レ' : '';
  ws.getCell(`${checkNoCol}${checkRow}`).value = row.visited ? '' : 'レ';

  ws.getCell(`${nameCol}${nameRow}`).value = row.hospitalName || '';

  let noteText = row.note || '';
  if(row.fromKind === 'none' && row.fromLabel){
    noteText = `【${row.fromLabel}】${noteText}`;
  }
  ws.getCell(`${noteCol}${noteRow}`).value = noteText;
}

// ---- writeRowsToMainSheet()：mainRowsを02.xlsx「表」の5行枠へ書き込む（仕様書5.5章、Step6） ----
// 入力はmainRowsのみ（旧buildPeriodsForForm().slice(0,5)への依存はここにはない）。
// mainRowsはallocateRowsToMainAndContinuation()により5件以内であることが保証されているが、
// 念のため5件を超える分は書き込まない（防御的に.slice(0,5)で打ち切る）。
const MAIN_SHEET_ROW_STARTS = [18,23,28,33,38]; // 02.xlsx「表」の5ブロック開始行（実テンプレ確認済み）
function writeRowsToMainSheet(front, mainRows){
  const rows = (mainRows || []).slice(0, MAIN_SHEET_ROW_STARTS.length);
  rows.forEach((row, i)=>{
    const r0 = MAIN_SHEET_ROW_STARTS[i];
    writePeriodRowBlock(front, 'E', 'R', r0, row);
  });
}

// ---- writeRowsToContinuationSheet()：continuationRowsを04.xlsxの11行枠（表5+裏6）へ書き込む（Step6） ----
// 04表：5ブロック（開始行16,21,26,31,36）、04裏：6ブロック（開始行1,6,11,16,21,26）。
// continuationRows.length <= 11はallocateRowsToMainAndContinuation()/compressPastRowsIfNeeded()側で
// 保証される設計（仕様書5.5章・9.1章：02/04合計16行枠に収まるよう圧縮済みのrowしかここに来ない前提）。
// ただし呼び出し元の前提が崩れた場合の事故防止として、11件を超える分は書き込まずconsole.warnのみ行う
// （仕様書5.4章の方針：個々のエラーで処理全体を止めない。書き込み漏れが起きたことは検知可能にする）。
const CONTINUATION_FRONT_ROW_STARTS = [16,21,26,31,36];   // 04.xlsx「表」5ブロック
const CONTINUATION_BACK_ROW_STARTS  = [1,6,11,16,21,26];  // 04.xlsx「裏」6ブロック
// 続紙の総枠数（表5＋裏6＝11）。writeRowsToContinuationSheet()以外からも参照するため
// 名前付き定数として切り出す（4.4対応：呼び出し元で事前に超過検知するため）。
const CONTINUATION_CAPACITY = CONTINUATION_FRONT_ROW_STARTS.length + CONTINUATION_BACK_ROW_STARTS.length;
function writeRowsToContinuationSheet(front04, back04, continuationRows){
  const rows = continuationRows || [];
  const capacity = CONTINUATION_CAPACITY;
  if(rows.length > capacity){
    // 【4.4対応】本来ここに到達する前に、呼び出し元（exportToOfficialForm()）が
    // 明示エラーとしてthrowする設計に変更した。この分岐は「呼び出し元の前提が
    // 崩れた場合の最後の砦」として残す（呼び出し元のチェックが変更で漏れても、
    // 無言でズレたデータを書き込むよりは、少なくともここで検知できるようにする）。
    console.warn(`continuationRowsが04.xlsxの枠（${capacity}件）を超えています（${rows.length}件）。超過分は書き込まれません。`);
  }
  rows.slice(0, CONTINUATION_FRONT_ROW_STARTS.length).forEach((row, i)=>{
    writePeriodRowBlock(front04, 'E', 'Q', CONTINUATION_FRONT_ROW_STARTS[i], row);
  });
  rows.slice(CONTINUATION_FRONT_ROW_STARTS.length, capacity).forEach((row, i)=>{
    writePeriodRowBlock(back04, 'D', 'P', CONTINUATION_BACK_ROW_STARTS[i], row);
  });
}

// ===== 02裏面オプション出力：障害認定日頃の状況／障害者手帳（今回追加分） =====
// セル位置は実テンプレート（02.xlsx裏面）をopenpyxl/ExcelJSで直接検証して確定したもの。
// 「現在（請求日頃）」セクション（33-57行目、既存コードの書き込み先）と
// 「障害認定日頃」セクション（6-30行目）は、就労状況・ADL・自由記述まで含めて
// レイアウトが完全に一致し、行差27（現在側の行番号-27＝認定日側の行番号）で対応することを確認済み。
// 既存のADL_CELL_MAP／NOTWORK_REASON_MAP／NOTWORK_REASON_ROW／COMMUTE_TIME_TO_HMは
// 列定義（現在側の行番号込み）を保持しているため、ここでは行番号だけ-27したコピーを使う。
const RECOGNITION_ROW_OFFSET = 27;

function shiftAdlCellMap(map, offset){
  const shifted = {};
  Object.keys(map).forEach(key=>{
    const m = map[key];
    shifted[key] = [m[0], m[1], m[2], m[3], m[4] - offset];
  });
  return shifted;
}
function shiftRowMap(map, offset){
  const shifted = {};
  Object.keys(map).forEach(key=>{ shifted[key] = map[key] - offset; });
  return shifted;
}
const RECOGNITION_ADL_CELL_MAP = shiftAdlCellMap(ADL_CELL_MAP, RECOGNITION_ROW_OFFSET);
const RECOGNITION_NOTWORK_REASON_ROW = shiftRowMap(NOTWORK_REASON_ROW, RECOGNITION_ROW_OFFSET);
// 現在側のBC44（不就労理由「オ」のその他自由記述）に対応する認定日側セル＝BC17（44-27）
// 02.xlsx裏面row17の結合セル範囲はBB17:BX17（row44側のBC44:BZ44とは開始列が1つずれ、
// row17はBBが正しいマスターセル）。なおExcelJSは結合セルの非マスターセルへの書き込みも
// マスターセルへ自動転送するため、BC17指定でも実害は無かった（要検証・実セルで確認済み）。
// BBへの変更はコードの正確性のための修正であり、表示結果への影響は無い。
const RECOGNITION_OTHER_REASON_NOTE_CELL = 'BB' + (44 - RECOGNITION_ROW_OFFSET);
// 現在側AP55（その他不便、自由記述）に対応する認定日側セル＝AP28（55-27）
const RECOGNITION_OTHER_NOTE_CELL = 'AP' + (55 - RECOGNITION_ROW_OFFSET);

// ---- 障害認定日頃の状況を02裏面（6-30行目）へ書き込む。snap.enabled===falseなら何もしない ----
function writeRecognitionSnapshotToBack(back, snap){
  if(!snap || !snap.enabled) return;

  const work = snap.work || {};
  // ===== 就労状態（仕事をしていた／していなかった）の出力ガード =====
  // 「仕事をしていた」「仕事をしていなかった」は排他的な入力（stepCh5Recognition参照）。
  // UI側でstatus切替時に反対側のデータをクリアしているが、古い保存データの復元や
  // 直接state操作のケースに備え、出力側でも「statusに対応しない情報は書かない」ことを保証する
  // （UI側クリアと合わせた二重対策。片方だけでは古い保存データや将来の実装変更に弱い）。
  // status==='仕事をしていた' → 就労側情報のみ書く（不就労理由は書かない）
  // status==='仕事をしていなかった' → 不就労理由のみ書く（就労側情報は書かない）
  // status未選択(null/undefined) → どちらも書かない
  const shouldWriteWorkingInfo = work.status === '仕事をしていた';
  const shouldWriteNotWorkingInfo = work.status === '仕事をしていなかった';

  // 就労状況ブロック（職種・通勤方法・通勤時間・出勤日数・体調）。現在側AP33→認定日側AP6、他同様に-27。
  if(shouldWriteWorkingInfo){
    back.getCell('AP' + (33 - RECOGNITION_ROW_OFFSET)).value = work.jobType || '';
    back.getCell('AW' + (34 - RECOGNITION_ROW_OFFSET)).value = (work.commute||[]).join('・');
    const hm = COMMUTE_TIME_TO_HM[work.commuteTime];
    if(hm){
      back.getCell('BA' + (35 - RECOGNITION_ROW_OFFSET)).value = hm[0];
      back.getCell('BJ' + (35 - RECOGNITION_ROW_OFFSET)).value = hm[1];
    }
    back.getCell('BB' + (36 - RECOGNITION_ROW_OFFSET)).value = work.workDays || '';
    back.getCell('AP' + (37 - RECOGNITION_ROW_OFFSET)).value = (work.condition||[]).join('・');
  }

  // 仕事をしていない理由（チェック＋「オ」自由記述）
  if(shouldWriteNotWorkingInfo){
    const otherNoteParts = [];
    toLabelStrings(snap.notWorkReasons).forEach(reason=>{
      const letter = NOTWORK_REASON_MAP[reason] || 'オ';
      const row = RECOGNITION_NOTWORK_REASON_ROW[letter];
      back.getCell(`AO${row}`).value = 'レ';
      if(letter==='オ' && reason!=='その他') otherNoteParts.push(reason);
    });
    if(snap.notWorkReasons.includes('その他') && snap.notWorkReasonOther) otherNoteParts.push(snap.notWorkReasonOther);
    if(otherNoteParts.length) back.getCell(RECOGNITION_OTHER_REASON_NOTE_CELL).value = otherNoteParts.join('・');
  }

  // ADL（10項目、認定日時点）
  Object.keys(snap.adl||{}).forEach(key=>{
    const map = RECOGNITION_ADL_CELL_MAP[key];
    if(!map) return;
    const level = snap.adl[key];
    const num = ADL_LEVEL_TO_NUM[level];
    if(!num) return;
    const col = map[num-1];
    const row = map[4];
    back.getCell(`${col}${row}`).value = 'レ';
  });

  // その他日常生活で不便（自由記述）
  let otherText = toLabelStrings(snap.otherChips).join('・');
  if(snap.otherNote){ otherText = otherText ? (otherText + '／' + snap.otherNote) : snap.otherNote; }
  back.getCell(RECOGNITION_OTHER_NOTE_CELL).value = otherText;
}

// ---- 障害者手帳の情報を02裏面（58-65行目、1件目枠）へ書き込む。nb.enabled===falseなら何もしない ----
// セル位置（ExcelJSで実テンプレート確認・確定済み）：
//   受給有無「受けている」チェック   : AO59
//   種別チェック（身/精/療/他）     : AQ62(身) / AU62(精) / AY62(療) / BC62(他)
//   その他の手帳名称                : BH62（マージ範囲BH62:CA62、ラベル「他・(」〜「)」の間）
//   交付年月日・等級（マージ範囲）  : 元号=AQ63、年=BC63、月=BI63、日=BO63、等級=BV63
//   障害名                         : AW64（マージ範囲AW64:CA64、ラベル「障害名(」〜「)」の間）
const NOTEBOOK_TYPE_CHECK_CELL = {
  '身体障害者手帳': 'AQ62',
  '精神障害者保健福祉手帳': 'AU62',
  '療育手帳': 'AY62',
  'その他': 'BC62'
};

function writeDisabilityNotebookToBack(back, nb){
  if(!nb || !nb.enabled) return;

  // 受給有無：今回はenabled===trueを「受けている」として扱う（申請中／受けていない分岐は今回実装しない。GPT回答B1）
  back.getCell('AO59').value = 'レ';

  // 種別チェック（1件目枠のみ。GPT回答B2）
  const checkCell = NOTEBOOK_TYPE_CHECK_CELL[nb.type];
  if(checkCell) back.getCell(checkCell).value = 'レ';
  if(nb.type==='その他' && nb.otherTypeName){
    back.getCell('BH62').value = nb.otherTypeName;
  }

  // 交付年月日（和暦変換。年のみ／年月／年月日のどこまで埋まっているかをacquiredKindで判定）
  if(nb.acquiredKind && nb.acquiredKind !== 'none' && nb.acquiredYear){
    const [g, y] = yearToWareki(parseInt(nb.acquiredYear, 10));
    if(g){
      back.getCell('AQ63').value = g;
      back.getCell('BC63').value = y;
    }
    if((nb.acquiredKind==='ym' || nb.acquiredKind==='ymd') && nb.acquiredMonth){
      back.getCell('BI63').value = parseInt(nb.acquiredMonth, 10);
    }
    if(nb.acquiredKind==='ymd' && nb.acquiredDay){
      back.getCell('BO63').value = parseInt(nb.acquiredDay, 10);
    }
  }

  // 等級
  if(nb.grade) back.getCell('BV63').value = nb.grade;

  // 障害名（GPT回答B3：noteはdisabilityNameに統合して1欄に出力する）
  let disabilityNameText = nb.disabilityName || '';
  if(nb.note){ disabilityNameText = disabilityNameText ? (disabilityNameText + '／' + nb.note) : nb.note; }
  if(disabilityNameText) back.getCell('AW64').value = disabilityNameText;
}

function esc(s){
  return (s===undefined||s===null?'':s).toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function toggleArray(arr, val){
  const i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
}
function makeFocusable(el, handler){
  el.tabIndex = 0;
  el.setAttribute('role','button');
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handler(); }
  });
}
function badgeForConfidence(conf){
  if(conf==='certain') return '<span class="badge badge-good">資料で確認</span>';
  if(conf==='approximate') return '<span class="badge badge-warn">たぶん</span>';
  return '<span class="badge badge-neutral">覚えていない</span>';
}
function findEventLabel(id){
  const found = state.selectedEvents.find(ev=>ev.id===id);
  if(found) return found.label;
  // フォールバック：固定グループ内の項目名から探す（保険）
  for(const g of Object.keys(EVENT_GROUPS)){
    const f = EVENT_GROUPS[g].find(e=>e[0]===id);
    if(f) return f[1];
  }
  return id;
}

// ===== 年齢帯（ageBand）関連のユーティリティ =====
// 年齢帯は「出来事カードを配置するための見せ方」であり、通院カードの
// 内部データ（年月）はここでは変更しない。空白検出は通院カードの
// 年月同士の隙間から行う（computeGapsを参照）。

function getCurrentYear(){
  return new Date().getFullYear();
}

function getCurrentAge(){
  const birth = parseInt(state.profile.birthYear);
  if(!birth) return null;
  return getCurrentYear() - birth;
}

// 生年とbandSizeから、年齢帯のリストを生成する。
// 最後の帯は「現在まで」を含む可変長にする。
function buildAgeBands(){
  const birth = parseInt(state.profile.birthYear);
  const size = state.profile.bandSize || 5;
  const currentAge = getCurrentAge();
  if(!birth || currentAge===null) return [];
  const bands = [];
  let startAge = 0;
  while(startAge < currentAge){
    const endAge = Math.min(startAge + size, currentAge);
    const isLast = endAge >= currentAge;
    const startYear = birth + startAge;
    const endYear = birth + endAge;
    bands.push({
      startAge, endAge,
      startYear, endYear,
      // 帯ラベルは西暦を先頭、年齢を括弧書きの補足とする（仕様書4.3節）。
      // 例：「2010〜2014年（20〜24歳ごろ）」「2022年〜現在（52歳〜現在）」
      label: isLast
        ? `${startYear}年〜現在（${startAge}歳〜現在）`
        : `${startYear}〜${endYear}年（${startAge}〜${endAge}歳ごろ）`,
      isLast
    });
    startAge += size;
  }
  if(bands.length===0){
    bands.push({startAge:0, endAge:currentAge, startYear:birth, endYear:birth+currentAge, label:`${birth}年〜現在（0歳〜現在）`, isLast:true});
  }
  return bands;
}

// 通院カード（年月）が、与えられた年齢帯と重なっているかを判定する。
// 表示用の手がかりとして使うだけで、空白検出には使わない。
// 【病院期間分割】病院がperiods[]のどれか1つでも帯と重なれば真、という判定にする
// （病院期間分割_設計案.md 5章）。
function hospitalOverlapsBand(hospital, band){
  const periodsArr = hospital.periods || [];
  return periodsArr.some(p=>{
    const fromYear = parseInt(p.fromYear);
    if(!fromYear) return false;
    const toYear = p.ongoing ? getCurrentYear() : (parseInt(p.toYear) || fromYear);
    return fromYear <= band.endYear && toYear >= band.startYear;
  });
}

// 与えられた年齢帯に重なる通院カードの一覧を返す（手がかり表示用）。
function hospitalsInBand(band){
  return state.hospitals.filter(h=>hospitalOverlapsBand(h, band));
}

// ===== 義務教育期間（小学校・中学校）の自動計算（ch5_place再設計仕様書4.4.1節・4.5節）=====
// state.hospitalsのような入力データは無く、生年（西暦）のみから日本の学制に沿って計算する。
// 標準的な就学時期（満6歳になった後の4月に小学校入学）を前提とし、留年・浪人等の個別事情は
// 扱わない（背景情報としての目安表示のため）。
// 戻り値の年齢は「その年の4月時点の満年齢」に相当する startAge/endAge（buildAgeBandsと
// 同じ単位）で表す。
function buildCompulsoryEducationSegments(){
  const birth = parseInt(state.profile.birthYear);
  if(!birth) return [];
  // 満6歳になった年の4月に小学校入学 → 生まれた年から6年後の4月
  // 年齢帯はbuildAgeBands()同様「誕生年からの経過年数」で管理しているため、
  // 「小学校入学＝6歳」「小学校卒業＝12歳（6年間）」「中学校卒業＝15歳（3年間）」を
  // startAge/endAgeとしてそのまま使う。
  // 区分数はstate.profile.bandSizeの二択で確定し切る（2026-07セッション決定#8）。
  // bandSizeの他箇所のフォールバック規則（`|| 5`）に合わせ、3以外（5・null含む）は3区分側とする。
  if(state.profile.bandSize === 3){
    // 「若い頃を細かく」＝5区分：既存区分（就学前・小学校）の内部をさらに分割する
    return [
      { key:'preschool_early', label:'乳幼児期', startAge:0, endAge:3 },
      { key:'preschool_late', label:'幼稚園・保育園', startAge:3, endAge:6 },
      { key:'elementary_lo', label:'小学校低学年', startAge:6, endAge:9 },
      { key:'elementary_hi', label:'小学校高学年', startAge:9, endAge:12 },
      { key:'junior_high', label:'中学校', startAge:12, endAge:15 }
    ];
  }
  // 「大まかに」＝3区分：就学前／小学校／中学校
  return [
    { key:'preschool', label:'就学前', startAge:0, endAge:6 },
    { key:'elementary', label:'小学校', startAge:6, endAge:12 },
    { key:'junior_high', label:'中学校', startAge:12, endAge:15 }
  ];
}

// 与えられた年齢帯（buildAgeBandsの1要素）に重なる義務教育区間を返す（4.4.3節：無ければ空配列）。
function compulsoryEducationSegmentsInBand(band){
  return buildCompulsoryEducationSegments().filter(seg=>
    seg.startAge < band.endAge && seg.endAge > band.startAge
  );
}

// ---- hospitalsOverlappingSegment()：フェーズ1の1区分（学齢期区分）に重なる通院期間を集める ----
// 決定#22（区分内に医療機関が複数ある場合はA案）・決定#24（fromYear不明は候補から除外）を実装する。
// 区分の範囲[segStartYear, segEndYear)と通院期間[fromY, toY)を半開区間で重なり判定する
// （10章の重複バグ修正・決定#25と同じ考え方）。返り値は開始年の昇順（古い順）。
// 医療機関名欄には最初の1件（区分内で一番古い＝その区分内で最初に受診した医療機関）を使う
// （決定#22改訂。初診に近い情報ほど医療機関名欄という構造化された項目に残す方が、
// 後から初診日を確認する際に紛らわしくない）。
function hospitalsOverlappingSegment(seg, birth){
  const segStartYear = birth + seg.startAge;
  const segEndYear = birth + seg.endAge;
  const results = [];
  state.hospitals.forEach(h=>{
    (h.periods || []).forEach(p=>{
      const fromY = parseInt(p.fromYear) || null;
      if(!fromY) return; // 決定#24：fromYear不明は対象外（standard/developmental共通の除外ルール）
      const toY = p.ongoing ? getFormFillDate().year : (parseInt(p.toYear) || null);
      if(!toY) return; // 終了年も判定できない場合は安全側で対象外とする
      if(fromY < segEndYear && segStartYear < toY){
        results.push({
          hospitalType: h.hospitalType || '',
          name: h.nameUnknown ? '' : (h.name || ''),
          fromY: Math.max(fromY, segStartYear),
          toY: Math.min(toY, segEndYear),
          sortKey: fromY
        });
      }
    });
  });
  results.sort((a, b) => a.sortKey - b.sortKey);
  return results;
}

// ---- buildPhase1SegmentNote()：フェーズ1の1区分ぶんの医療機関名欄・状況欄（note）を作る ----
// 決定#20（区分名のみを自動生成。決定#34で、決定#11「〜の欄」統一とは食い違わないことを確認済み）・
// 決定#29（旧#22改訂。医療機関名欄は最初の1件）・
// 決定#28（それ以外の病院は状況欄に、件数上限を設けずすべて書き出す）を実装する。
// ---- developmental modeの先頭側gap（決定#30）専用のnote生成（決定#33） ----
// 通常gapのようにGAP_REASONS由来の「理由：」は使わない。「通院しなかった理由」という枠組みは
// 既に病識があり通院を中断した場合を前提にしており、発達障害の受診前期間（特性が診断されない
// まま生活の中に表れ続け、対人関係の困難等が積み重なって初めて受診を意識する期間）の実態とは
// 噛み合わない。障害自体は出生時から連続して存在しており、「通院していない＝障害が休止していた
// 期間」でもない。フェーズ1のbuildPhase1SegmentNote()と同じ考え方で、出来事カード・断片を
// 時期でマッチングして自動生成する。
// seg: {label?, fromY, toY}。fromY/toYはchunk単位の範囲（splitGapIntoChunksが生成する、
// bandSize連動の3年/5年チャンク）。eventRangeMatchesYear()の点判定ではなく、決定#25で確立した
// eventRangeOverlapsSegment()の範囲判定を使う（チャンクが複数年幅になりうるため、点判定だと
// 取りこぼす）。
// labelは将来のライフステージ単位の区切り（高校・大学等）を接続するための受け口。今回は
// 常にundefinedのまま呼び出す（5.4節、ラベル生成ロジック自体は次回以降のスコープ）。
function buildDevelopmentalGapNote(seg, relatedOverride){
  const noteParts = [];
  if(seg.label) noteParts.push(`${seg.label}。`); // 今回は未使用
  // 【決定#41】buildPeriodsForForm()から呼ばれるときは、resolveEventChunkWinners()で
  // 決定済みのrelated（重複排除済み）が渡される。単体で直接呼び出す場合（テスト等）は
  // 従来通りこの場で自前計算する（後方互換）。
  const related = relatedOverride !== undefined
    ? relatedOverride
    : buildEventYearRanges().filter(r => eventRangeOverlapsSegment(r, seg.fromY, seg.toY)).map(r => r.label);
  if(related.length) noteParts.push('この頃の出来事：' + related.join('・') + '。');
  // 出来事・断片が無ければ空文字列のまま返す。「通院せず。」も付けない。
  // row.visited=falseにより、Excel（writeRowToMainSheet）・プレビュー
  // （renderPreviewPeriodRowsHtml）側で「受診していない」のチェックが既に独立して
  // 描画されるため、note側に重ねて書いても情報が重複するだけで付加価値が無い。
  return noteParts.join('');
}

function buildPhase1SegmentNote(seg, birth, relatedOverride){
  const overlapping = hospitalsOverlappingSegment(seg, birth);
  const primary = overlapping.length ? overlapping[0] : null; // 決定#29（決定#22・#28の再修正）：最初（区分内で一番古い）を医療機関名欄に使う
  const hospitalName = primary ? (primary.name || '（病院名不明）') : '';

  const noteParts = [`${seg.label}。`];

  // 決定#20・#25：本文は既存の自動要約の仕組み（出来事カード）をそのまま流用する。ただし
  // 区分は最大6年幅の範囲を持つため、区分の範囲[segStartYear, segEndYear)と出来事の年齢帯の
  // 範囲を半開区間で重なり判定する（eventRangeMatchesYear()の1点判定ではなく、
  // eventRangeOverlapsSegment()を使う）。
  const segStartYear = birth + seg.startAge;
  const segEndYear = birth + seg.endAge;
  // 【決定#41】buildDevelopmentalGapNote()と同じ理由で、外からrelatedを渡せるようにする
  // （省略時は従来通り自前計算、単体呼び出し・テスト向けの後方互換）。
  const related = relatedOverride !== undefined
    ? relatedOverride
    : buildEventYearRanges().filter(r => eventRangeOverlapsSegment(r, segStartYear, segEndYear)).map(r => r.label);
  if(related.length) noteParts.push('この頃の出来事：' + related.join('・') + '。');

  // 医療機関名欄に入った最初の1件を除く、古い順（＝実際に転院していった順）。上限は設けずすべて書き出す
  const additional = overlapping.slice(1);
  additional.forEach(a=>{
    const label = a.fromY === a.toY ? `${a.fromY}年` : `${a.fromY}年〜${a.toY}年`;
    noteParts.push(`${a.hospitalType}${a.name || '（病院名不明）'}（${label}）に転院。`);
  });

  return { hospitalName, note: noteParts.join('') };
}

function renderChipGroup(containerId, items, selectedArr, multi, onToggle){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  items.forEach(label=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (selectedArr.includes(label) ? ' chip-selected' : '');
    btn.textContent = label;
    btn.onclick = ()=>{
      if(multi){
        toggleArray(selectedArr, label);
        btn.classList.toggle('chip-selected');
      } else {
        container.querySelectorAll('.chip').forEach(c=>c.classList.remove('chip-selected'));
        btn.classList.add('chip-selected');
      }
      onToggle(label);
    };
    container.appendChild(btn);
  });
}

function renderCheckList(containerId, items, selectedEvents){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const isSelected = key => selectedEvents.some(ev=>ev.id===key);
  items.forEach(([key,label])=>{
    const row = document.createElement('div');
    row.className = 'check-row';
    const box = document.createElement('div');
    box.className = 'check-box' + (isSelected(key) ? ' on' : '');
    box.innerHTML = isSelected(key) ? '<span>&#10003;</span>' : '';
    const text = document.createElement('div');
    text.textContent = label;
    text.style.fontSize = '15px';
    row.appendChild(box);
    row.appendChild(text);
    const handler = ()=>{
      const idx = selectedEvents.findIndex(ev=>ev.id===key);
      if(idx>=0){
        selectedEvents.splice(idx,1);
        // 配置情報・通院記録側の「手がかり」参照も削除しておく（REPEATABLE用の削除と同様）
        delete state.eventPlacements[key];
        removeEventIdFromRelatedEvents(key);
      }
      else { selectedEvents.push({id:key, type:key, label:label, repeatable:false}); }
      box.className = 'check-box' + (isSelected(key) ? ' on' : '');
      box.innerHTML = isSelected(key) ? '<span>&#10003;</span>' : '';
    };
    row.onclick = handler;
    makeFocusable(row, handler);
    container.appendChild(row);
  });
}

// ---- 文字列配列専用のチェックリスト（gapReasons / notWorkReasons / otherChips 用） ----
// renderCheckListはイベントカード（オブジェクト配列）専用なので、
// 単純な複数選択（文字列配列）はこちらを使う。役割を混ぜない。
// helpTexts: {label: helpText} の形のオブジェクトを渡すと、各行の下に薄い補助文を表示する（任意・省略可）。
// 既存呼び出し元（helpTextsを渡さないもの）の挙動は変えない。
function renderStringCheckList(containerId, items, selectedArr, helpTexts, onChange){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const isSelected = key => selectedArr.includes(key);
  items.forEach(([key,label])=>{
    const wrapper = document.createElement('div');
    const row = document.createElement('div');
    row.className = 'check-row';
    const box = document.createElement('div');
    box.className = 'check-box' + (isSelected(key) ? ' on' : '');
    box.innerHTML = isSelected(key) ? '<span>&#10003;</span>' : '';
    const text = document.createElement('div');
    text.textContent = label;
    text.style.fontSize = '15px';
    row.appendChild(box);
    row.appendChild(text);
    const handler = ()=>{
      const idx = selectedArr.indexOf(key);
      if(idx>=0){ selectedArr.splice(idx,1); }
      else { selectedArr.push(key); }
      box.className = 'check-box' + (isSelected(key) ? ' on' : '');
      box.innerHTML = isSelected(key) ? '<span>&#10003;</span>' : '';
      if(onChange) onChange(key, isSelected(key));
    };
    row.onclick = handler;
    makeFocusable(row, handler);
    wrapper.appendChild(row);
    if(helpTexts && helpTexts[key]){
      const help = document.createElement('p');
      help.className = 'small';
      help.style.margin = '2px 0 10px 32px';
      help.textContent = helpTexts[key];
      wrapper.appendChild(help);
    }
    container.appendChild(wrapper);
  });
}

// ---- ADL1項目分のHTML（ラベル＋chip-group差し込み枠＋「迷ったときの例」の折りたたみ）を生成 ----
// ch2_adl（現在状況）・stepCh5Recognition（認定日欄）の両方から呼ぶ共通ヘルパー。
// 折りたたみにはHTML標準のdetails/summaryを使い、開閉状態をstateで管理する必要がない
// （選択値の保存・出力ロジックには一切影響しない、表示のみの機能）。
// levels省略時はADL_LEVELS（現在形）。認定日欄はADL_LEVELS_PAST（過去形）を渡す
// （2026-08-01、実テンプレート02.xlsxの認定日欄が過去形表記だったため対応）。
// 「迷ったときの例」の説明文自体はADL_HELP_TEXTSのキー（現在形のADL_LEVELS）で引く。
// levelsが過去形でも、並び順（idx）でADL_LEVELSの対応するキーを引けば同じ説明文を再利用でき、
// ADL_HELP_TEXTSを現在形・過去形で二重に持つ必要がない。
// 「迷ったときの例」の折りたたみHTML（ADL用）を単独で組み立てる。
// 2026-08-08: 会話形式（renderCh2AdlStep）からも同じ密度で使うため、renderAdlItemHtmlから
// 抜き出して共通ヘルパー化した（出力するHTMLは従来と完全に同一）。
function adlHelpDetailsHtml(key, levels){
  levels = levels || ADL_LEVELS;
  const help = ADL_HELP_TEXTS[key];
  if(!help) return '';
  return `
    <details style="margin-top:4px;">
      <summary class="small" style="cursor:pointer;color:var(--accent-strong);">迷ったときの例を見る</summary>
      <div class="small" style="margin-top:6px;line-height:1.6;">
        ${levels.map((level,idx)=>`<p style="margin:0 0 6px;"><strong style="font-weight:600;">${esc(level)}：</strong>${esc(help[ADL_LEVELS[idx]]||'')}</p>`).join('')}
      </div>
    </details>`;
}

function renderAdlItemHtml(key, label, containerIdPrefix, levels){
  levels = levels || ADL_LEVELS;
  const helpHtml = adlHelpDetailsHtml(key, levels);
  return `<div class="adl-item"><div class="adl-label">${esc(label)}</div><div class="chip-group adl-options" id="${containerIdPrefix}${key}"></div>${helpHtml}</div>`;
}

// ---- 箇条書きの「迷ったときの例」折りたたみHTMLを生成する共通ヘルパー ----
// ADLのような4択ではなく、自由記述欄（その他、生活で困っていること等）向け。
// 観点を複数提示するための単純なリスト表示。書き方の例であり、申立書にそのまま書く文ではない
// （ADL_HELP_NOTICEと同趣旨。利用箇所側で別途注記を出す必要はなく、この関数内に含めている）。
function renderHelpListHtml(items){
  if(!items || !items.length) return '';
  return `
    <details style="margin-top:6px;">
      <summary class="small" style="cursor:pointer;color:var(--accent-strong);">迷ったときの例を見る</summary>
      <div class="small" style="margin-top:6px;line-height:1.6;">
        <p style="margin:0 0 6px;">書き方に迷ったら、たとえば次のような観点で書いてみてください（そのまま書く必要はありません）。</p>
        <ul style="margin:0 0 0 18px;padding:0;">
          ${items.map(t=>`<li style="margin-bottom:4px;">${esc(t)}</li>`).join('')}
        </ul>
      </div>
    </details>`;
}

function setFooter(opts){
  const footer = document.getElementById('footerNav');
  footer.innerHTML = '';
  if(opts.secondaryLabel){
    const b = document.createElement('button');
    // 2026-08-10（決定#65・案A）：「戻る」単独（primaryLabel無し）のときはflex:1で全幅に
    // 伸びて「次へ」の定位置を占領してしまい違和感があるため、その場合だけ伸びないようにする。
    // ch2_reason/ch2_adlの会話形式（1問ごとにタップした瞬間に進むため「次へ」を置かない）の
    // ために導入したが、ch5_done等の他の「戻るのみ」画面にも同じCSSが自動的に効く（副次的に
    // 直る。意図的な副作用）。
    b.className = 'btn btn-secondary' + (opts.primaryLabel ? '' : ' btn-alone');
    b.textContent = opts.secondaryLabel;
    b.onclick = opts.secondaryFn;
    footer.appendChild(b);
  }
  if(opts.primaryLabel){
    const b = document.createElement('button');
    b.className = 'btn btn-primary';
    b.textContent = opts.primaryLabel;
    b.disabled = !opts.primaryEnabled;
    b.onclick = opts.primaryFn;
    footer.appendChild(b);
  }
}

function getChapterNum(stepId){
  return STEP_CHAPTER_MAP[stepId] || 0;
}

function renderTasks(){
  const header = document.getElementById('taskHeader');
  const num = getChapterNum(current);
  if(num===0){ header.innerHTML=''; return; }
  let html = `<div class="small">現在：第${num}章 ${CH_LABELS[num-1]}</div><div class="task-list">`;
  CH_LABELS.forEach((label,i)=>{
    const n = i+1;
    let cls = 'task-pill';
    let prefix = '';
    if(n===num){ cls += ' active'; prefix='● '; }
    else if(state.completed['ch'+n]){ cls += ' done'; prefix='&#10003; '; }
    html += `<div class="${cls}">${prefix}${label}</div>`;
  });
  html += '</div>';
  header.innerHTML = html;
}

function goTo(id){
  historyStack.push(current);
  current = id;
  showScreen();
  window.scrollTo(0,0);
  saveStateToStorage();
}
// 章の完了後、returnToが設定されていればch5_doneに戻る共通処理
function finishChapter(chKey, nextScreen){
  state.completed[chKey] = true;
  if(state.returnTo){
    const dest = state.returnTo;
    state.returnTo = null;
    goTo(dest);
  } else {
    goTo(nextScreen);
  }
}
function goBack(){
  if(historyStack.length){
    current = historyStack.pop();
    showScreen();
    window.scrollTo(0,0);
    saveStateToStorage();
  }
}
// 個人情報は端末保存のみ／サーバー送信なしの要件に沿い、ブラウザのlocalStorageのみを使う。
const STORAGE_KEY = 'shinritsusho_draft_v1';

// 各章の「次へ」で画面遷移した瞬間（goTo呼び出し時）に保存する。
// 保存に失敗しても操作は止めない（例：プライベートブラウジング等でlocalStorageが使えない場合）。
function saveStateToStorage(){
  try{
    const payload = { state: state, current: current, historyStack: historyStack, savedAt: Date.now() };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  }catch(err){
    console.warn('保存に失敗しました（端末の保存領域が使えない可能性があります）', err);
  }
}

function loadStateFromStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const payload = JSON.parse(raw);
    if(!payload || !payload.state) return null;
    // 過去編state追加（または将来の追加項目）に対する移行処理を必ず通す。
    // 既存フィールドは上書きせず、無いキーのみ補う（migrateAppState内部の原則）。
    payload.state = migrateAppState(payload.state);
    return payload;
  }catch(err){
    console.warn('保存データの読み込みに失敗しました', err);
    return null;
  }
}

function clearStateStorage(){
  try{
    localStorage.removeItem(STORAGE_KEY);
  }catch(err){
    console.warn('保存データの削除に失敗しました', err);
  }
}

function stepResumeCheck(savedPayload){
  const savedDate = new Date(savedPayload.savedAt);
  const dateLabel = `${savedDate.getFullYear()}年${savedDate.getMonth()+1}月${savedDate.getDate()}日 ${String(savedDate.getHours()).padStart(2,'0')}:${String(savedDate.getMinutes()).padStart(2,'0')}`;
  document.getElementById('screen').innerHTML = `

      <p class="lead">この端末に、前回入力した内容が保存されています（${esc(dateLabel)}時点）。続きから再開しますか？</p>
    </div>`;
  setFooter({
    secondaryLabel:'最初からやり直す',
    secondaryFn:()=>{
      clearStateStorage();
      resetState();
      current = 'start';
      showScreen();
    },
    primaryLabel:'続きから再開する',
    primaryEnabled:true,
    primaryFn:()=>{
      // savedPayload.state は loadStateFromStorage() の時点で
      // migrateAppState() を通過済み（過去編キー等の不足分は補完されている）
      state = savedPayload.state;
      historyStack = savedPayload.historyStack || [];
      current = savedPayload.current || 'start';
      showScreen();
    }
  });
}

const CIRCLED_NUMBERS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
function circledNumber(n){
  return CIRCLED_NUMBERS[n-1] || `(${n})`;
}

function bindRepeatableListEvents(){
  document.querySelectorAll('[data-add-type]').forEach(btn=>{
    btn.onclick = ()=>{
      const type = btn.getAttribute('data-add-type');
      const label = btn.getAttribute('data-add-label');
      const count = state.selectedEvents.filter(ev=>ev.type===type).length + 1;
      state.selectedEvents.push({id:`${type}_${Date.now()}_${count}`, type, label:`${label}${circledNumber(count)}`, repeatable:true});
      stepCh3Events();
    };
  });
  document.querySelectorAll('[data-remove-id]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-remove-id');
      const idx = state.selectedEvents.findIndex(ev=>ev.id===id);
      if(idx>=0) state.selectedEvents.splice(idx,1);
      // 配置情報も削除しておく（存在しないカードの配置が残らないように）
      delete state.eventPlacements[id];
      // 通院記録側の「手がかり」参照も削除しておく（存在しない出来事idが残らないように）
      removeEventIdFromRelatedEvents(id);
      stepCh3Events();
    };
  });
}

    const text = document.createElement('div');
    text.textContent = label;

    row.appendChild(box);

    const handler = ()=>{
      toggleArray(selectedIds, id);
      box.className = 'check-box' + (selectedIds.includes(id) ? ' on' : '');
      box.innerHTML = selectedIds.includes(id) ? '<span>&#10003;</span>' : '';

      <label class="field-label">いつから（西暦）</label>
      <div class="row"><input type="number" id="fromYear" placeholder="例：2020" /><input type="number" id="fromMonth" placeholder="月" min="1" max="12" /></div>
      ${estHint}
      <label class="field-label">いつまで（西暦）</label>
      <div class="row"><input type="number" id="toYear" placeholder="例：2021" /><input type="number" id="toMonth" placeholder="月" min="1" max="12" /></div>
      <div style="margin-top:10px; display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="ongoing" style="width:18px;height:18px;" />
        <label for="ongoing" class="small">今も通院中</label>
      </div>
    </div>`;
  const fy = document.getElementById('fromYear'), fm = document.getElementById('fromMonth');
  const ty = document.getElementById('toYear'), tm = document.getElementById('toMonth');

  fy.value = state.draft.fromYear || ''; fm.value = state.draft.fromMonth || '';

  ty.disabled = !!state.draft.ongoing; tm.disabled = !!state.draft.ongoing;
  fy.oninput = e=>state.draft.fromYear = e.target.value;
  fm.oninput = e=>state.draft.fromMonth = e.target.value;
  ty.oninput = e=>state.draft.toYear = e.target.value;
  tm.oninput = e=>state.draft.toMonth = e.target.value;
  ongoingEl.onchange = e=>{
    state.draft.ongoing = e.target.checked;
    ty.disabled = e.target.checked;
    tm.disabled = e.target.checked;
  };

  if(useEstBtn){

      fy.value = state.draft.estimatedYear;
      state.draft.fromYear = state.draft.estimatedYear;

  }
  setFooter({secondaryLabel:'戻る', secondaryFn:goBack, primaryLabel:'次へ', primaryEnabled:true, primaryFn:()=>goTo('ch4_confidence')});

function stepCh4Confidence(){
  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>この日付はどのくらい確かですか？</h2>
      <p class="optional-notice">答えなくても次に進めます</p>
      <div class="chip-group" id="confChips"></div>
      <label class="field-label" style="margin-top:18px;">状況の補足（任意）</label>
      <textarea id="hospMemo" placeholder="転院した理由、診断のこと、通院の頻度など"></textarea>
    </div>`;
  renderChipGroup('confChips', CONFIDENCE.map(c=>c[1]), state.draft.confidence ? [CONFIDENCE.find(c=>c[0]===state.draft.confidence)[1]] : [], false, v=>{
    state.draft.confidence = CONFIDENCE.find(c=>c[1]===v)[0];
  });
  const memoEl = document.getElementById('hospMemo');
  memoEl.value = state.draft.memo || '';
  memoEl.oninput = e=>{ state.draft.memo = e.target.value; };
  setFooter({secondaryLabel:'戻る', secondaryFn:goBack, primaryLabel:'次へ', primaryEnabled:true, primaryFn:()=>{
    // 【病院期間分割】保存先をperiods[]対応に変更（病院期間分割_設計案.md 5章）。
    // draftには「病院全体に紐づく項目」（name/nameUnknown/hospitalType/relatedEvents）と
    // 「期間ごとの項目」（fromYear〜memo）が混在しているため、保存時にこの2階層へ振り分ける。
    const editId = state.editingHospitalId;
    const editPeriodId = state.editingPeriodId;
    if(editId !== null && editId !== undefined){
      // 修正モード：該当IDの病院を見つけ、病院レベルの項目を上書きしつつ、
      // 対象periodId（editingPeriodId）のperiodだけを上書きする。他のperiodには触れない。
      const idx = state.hospitals.findIndex(h=>h.hospitalId===editId);
      if(idx>=0){
        const h = state.hospitals[idx];
        h.name = state.draft.name;
        h.nameUnknown = state.draft.nameUnknown;
        h.hospitalType = state.draft.hospitalType;
        h.relatedEvents = state.draft.relatedEvents || [];
        if(editPeriodId){
          const pIdx = h.periods.findIndex(p=>p.periodId===editPeriodId);
          if(pIdx>=0){
            h.periods[pIdx] = {
              periodId: editPeriodId,
              fromYear: state.draft.fromYear, fromMonth: state.draft.fromMonth,
              toYear: state.draft.toYear, toMonth: state.draft.toMonth,
              ongoing: state.draft.ongoing, confidence: state.draft.confidence, memo: state.draft.memo
            };
          }
        }
      }
    } else {
      // 新規追加モード：病院の永続ID・periodの永続IDをそれぞれ発行してpush。
      // 新規病院は常に「1病院＝1期間」のまま作られる（手動の「分割」操作は撤去済み。
      // 3〜5年超の場合の複数行化はbuildPeriodsForForm()側の自動分割に一本化した）。
      state.draft.hospitalId = state.nextHospitalId++;
      const periodId = `pd_${state.nextPeriodId++}`;
      state.hospitals.push({
        hospitalId: state.draft.hospitalId,
        name: state.draft.name,
        nameUnknown: state.draft.nameUnknown,
        hospitalType: state.draft.hospitalType,
        relatedEvents: state.draft.relatedEvents || [],
        periods: [{
          periodId,
          fromYear: state.draft.fromYear, fromMonth: state.draft.fromMonth,
          toYear: state.draft.toYear, toMonth: state.draft.toMonth,
          ongoing: state.draft.ongoing, confidence: state.draft.confidence, memo: state.draft.memo
        }]
      });
    }
    state.draft = {};
    state.editingHospitalId = null;
    state.editingPeriodId = null;
    // gapの理由確認はここでは行わない。病院入力フェーズはここで終わり、必ずハブ画面（ch4_summary）に戻す。
    goTo('ch4_summary');
  }});
}

// ---- 通院記録から、毎回その場で通院空白（ギャップ）を計算する ----
// 保存するのはユーザーが入力した「理由」だけ（state.gapReasonsByKey）。
// 期間そのものは常にhospitalsから導出するので、病院を後から追加・修正・削除しても自動的に追従する。
// ---- developmental modeの先頭側gap（決定#30）かどうかを、keyのプレフィックスで判定する ----
// computeGaps()がこの形式のkey（'phase1end__<hospitalId>'）を生成する。決定#33により、
// この種類のgapには通常gapの理由チェックリスト（GAP_REASONS・第4章B）を適用しない
// （「通院しなかった理由」という枠組み自体が、発達障害の受診前期間の実態に合わないため）。
function isDevelopmentalLeadingGapKey(key){
  return !!(key && key.startsWith('phase1end__'));
}

// ---- hasRecognizedGap()：older側の終了とnewer側の開始の間に「空白期間」を認めるかどうかの統一基準 ----
// 【不具合修正・2026-07-22】以前はcomputeGaps()系のすべての判定が年差（newerFromY - olderToY ≧ 1）
// のみを見ており、月を一切考慮していなかった。このため
//   ・12月終了→翌1月開始（実質空白ほぼ0か月）を「空白あり」と誤検出する
//   ・1月終了→同年12月開始（実質約11か月の空白）を「空白なし」と見逃す
// という2方向の誤りが起きていた（コードレビューで発覚。様式出力にも影響する）。
// 修正方針：older/newer両方の月が分かっている場合だけ、実際の月数で「1か月以上の空白」を判定する
// （fromTotal - toTotal - 1 ≧ 1、すなわち間に丸ごと空いている暦月が1つ以上ある場合のみ空白とする）。
// 片方でも月が不明な場合は、実際の空白が0か月〜ほぼ1年のどこにあるか判断できないため、
// 従来通り「年をまたいでいれば空白の可能性ありとして扱う」安全側の基準に倒す
// （renderHospitalBarRow()の月未入力ケース・decision#38/#40のテスト前提を変えないため）。
function hasRecognizedGap(toYear, toMonth, fromYear, fromMonth){
  if(!toYear || !fromYear) return false;
  if(toMonth && fromMonth){
    const toTotal = toYear*12 + toMonth;
    const fromTotal = fromYear*12 + fromMonth;
    return (fromTotal - toTotal - 1) >= 1;
  }
  return (fromYear - toYear) >= 1;
}

// ---- 決定#37：同じ病院の中の period 同士の間にできる空白の検出 ----
// 手動の「分割」UIがあった頃は、既存の1期間を指定した年月でぴったり2つに割るだけだったため
// periods間に空白が生じることはなかった（分割時点で1枚目の終わりと2枚目の始まりが必ず一致する）。
// しかしそのUI撤去後、修正画面は常にperiods[0]しか書き換えない作りになっており、2枚目以降の
// 存在を知らないまま1枚目の日付だけを直すと、periods間にすき間ができてしまう。しかもこれは
// 病院と病院の間の空白（下のfor文）とは別扱いで、今まで一切検出されていなかった。
// 病院同士の空白とまったく同じ形（キー・reasons）で返し、以降の理由入力・一覧表示・様式出力の
// すべてに自動的に乗るようにする。キーは periodId の組み合わせにし、病院同士のキー
// （hospitalId__hospitalId）・developmental modeの先頭側gapキー（phase1end__hospitalId）と
// 形が異なるため衝突しない。
function computeIntraHospitalGaps(){
  const gaps = [];
  state.hospitals.forEach(h=>{
    const periodsArr = h.periods || [];
    for(let j=0;j<periodsArr.length-1;j++){
      const older = periodsArr[j];
      const newer = periodsArr[j+1];
      const olderToY = older.ongoing ? null : parseInt(older.toYear);
      const olderToM = older.ongoing ? null : (parseInt(older.toMonth) || null);
      const newerFromY = parseInt(newer.fromYear);
      const newerFromM = parseInt(newer.fromMonth) || null;
      if(hasRecognizedGap(olderToY, olderToM, newerFromY, newerFromM)){
        const key = `period__${older.periodId}__${newer.periodId}`;
        gaps.push({
          key,
          fromLabel: `${older.toYear || '?'}年${older.toMonth || ''}頃`,
          toLabel: `${newer.fromYear || '?'}年${newer.fromMonth || ''}頃`,
          reasons: state.gapReasonsByKey[key] || []
        });
      }
    }
  });
  return gaps;
}

function computeGaps(){
  // 【病院期間分割】「病院の開始/終了」をperiods[0].from〜periods[periods.length-1].toから算出する
  // （病院期間分割_設計案.md 5章）。手動の「分割」操作は撤去済みだが、複数件になるケースへの
  // 保険としてperiods[]配列のままにしている。
  const sorted = [...state.hospitals]
    .filter(h=>h.periods && h.periods.length && h.periods[0].fromYear) // 年が入っていない記録は並べ替え対象から除外（フォールバック）
    .sort((a,b)=> (parseInt(a.periods[0].fromYear)||0) - (parseInt(b.periods[0].fromYear)||0));
  const gaps = [];

  // 【developmental mode】standard modeには「一番最初の通院記録より前」という概念自体が無く
  // （タイムラインが最初の通院記録そのものから始まる設計のため）、computeGaps()は元々
  // 「既存の通院記録どうしの間」の空白しか計算していなかった。developmental modeは生年を
  // 起点として導入した（決定#12〜）ため、「生年＋15歳（中学校卒業ごろ）〜最初の通院記録」
  // という、standard modeには存在しなかった種類の空白が新たに生まれる。これも同じ「通院して
  // いない期間」として扱い、他のgapと同様に理由入力（ch4）・様式出力の対象にする。
  const birth = parseInt(state.profile.birthYear) || null;
  if(state.outputMode === 'developmental' && birth && sorted.length){
    const phase1EndYear = birth + 15;
    const first = sorted[0];
    const firstPeriod = first.periods[0];
    const firstFromY = parseInt(firstPeriod.fromYear);
    if(firstFromY && (firstFromY - phase1EndYear) >= 1){
      const key = `phase1end__${first.hospitalId}`;
      gaps.push({
        key,
        fromLabel: `${phase1EndYear}年頃`,
        toLabel: `${firstPeriod.fromYear}年${firstPeriod.fromMonth || ''}頃`,
        reasons: state.gapReasonsByKey[key] || []
      });
    }
  }

  for(let i=0;i<sorted.length-1;i++){
    const older = sorted[i];
    const newer = sorted[i+1];
    const olderLastPeriod = older.periods[older.periods.length-1];
    const newerFirstPeriod = newer.periods[0];
    const olderToY = olderLastPeriod.ongoing ? null : parseInt(olderLastPeriod.toYear);
    const olderToM = olderLastPeriod.ongoing ? null : (parseInt(olderLastPeriod.toMonth) || null);
    const newerFromY = parseInt(newerFirstPeriod.fromYear);
    const newerFromM = parseInt(newerFirstPeriod.fromMonth) || null;
    if(hasRecognizedGap(olderToY, olderToM, newerFromY, newerFromM)){
      const key = `${older.hospitalId}__${newer.hospitalId}`;
      gaps.push({
        key,
        fromLabel: `${olderLastPeriod.toYear || '?'}年${olderLastPeriod.toMonth || ''}頃`,
        toLabel: `${newerFirstPeriod.fromYear || '?'}年${newerFirstPeriod.fromMonth || ''}頃`,
        reasons: state.gapReasonsByKey[key] || []
      });
    }
  }
  return [...gaps, ...computeIntraHospitalGaps()];
}

// ---- 「理由が入力済みか」の判定ルール（この基準で全体を統一する） ----
// gapReasonsByKey[key] が存在し、かつ1件以上の理由が入っている場合のみ「入力済み」。
// undefined、もしくは空配列の場合は「未入力」として扱う。
function isGapReasonAnswered(key){
  const reasons = state.gapReasonsByKey[key];
  return Array.isArray(reasons) && reasons.length > 0;
}

// 理由が未入力のgapを先頭から1件だけ返す（なければnull）。
// 一覧を同時に編集させる方式ではなく、必ず1件ずつ確認させるための入口。
// 決定#33：developmental modeの先頭側gap（phase1end__）は、理由チェックリスト自体を
// 適用しない設計にしたため、ここで「未回答」として拾わない（第4章Bで聞かれることはない）。
function findFirstUnansweredGap(){
  const gaps = computeGaps();
  return gaps.find(g => !isDevelopmentalLeadingGapKey(g.key) && !isGapReasonAnswered(g.key)) || null;
}

// ---- 通院空白確認フェーズ（第4章B） ----
// 1画面で1gapだけを処理する。保存したら次の未入力gapを再取得して同じ画面にとどまり、
// 未入力gapがなくなった時点でch4_summaryに戻る（afterGapReviewActionが'go_ch5'なら続けて第5章へ）。
function stepCh4GapReview(){
  const target = findFirstUnansweredGap();
  if(!target){
    // 未入力gapがもうない＝確認完了。フラグに応じて第5章へ進むか、summaryに戻るだけ
    const action = state.afterGapReviewAction;
    state.afterGapReviewAction = null;
    if(action === 'go_ch5'){
      finishChapter('ch4', 'ch5_intro');
    } else {
      goTo('ch4_summary');
    }
    return;
  }
  const gaps = computeGaps();
  const remainingCount = gaps.filter(g => !isGapReasonAnswered(g.key)).length;
  const progressHtml = remainingCount > 1
    ? `<p class="small" style="margin:-4px 0 10px;">通院していない期間が複数見つかりました。あと${remainingCount}件、順番にお聞きします。</p>`
    : '';
  document.getElementById('screen').innerHTML = `
    <div class="card">
      ${progressHtml}
      <p class="hint">${esc(target.fromLabel)} から ${esc(target.toLabel)} までの間は、通院の記録がありませんでした。</p>
      <h2>この時期のことを少し教えてください</h2>
      <p class="optional-notice">答えなくても次に進めます</p>
      <div id="gapReasons"></div>
      <p class="small" style="margin-top:14px;">どんな理由も審査の参考になります。正直に選んで大丈夫です。</p>
    </div>`;
  state.tempGapReasons = [...(state.gapReasonsByKey[target.key] || [])];
  renderStringCheckList('gapReasons', GAP_REASONS.map(l=>[l,l]), state.tempGapReasons);
  setFooter({secondaryLabel:'戻る', secondaryFn:goBack, primaryLabel:'次へ', primaryEnabled:true, primaryFn:()=>{
    state.gapReasonsByKey[target.key] = [...state.tempGapReasons];
    state.tempGapReasons = [];
    // この画面にとどまったまま再描画し、次の未入力gapを探す（一覧を一括編集する形にはしない）
    stepCh4GapReview();
  }});
}


function stepCh4Summary(){
  // 【決定#37・方針転換】以前はperiods[0]だけを見て「1病院＝1行」で表示していたが、昔の「分割」
  // UIで作られた複数period（periods[1]以降）が一覧にも修正画面にも一切出てこず、隠れたまま
  // 気づけないという問題があった。period単位で1枚ずつ、その枚自身の日付・確信度・メモで表示する。
  const orderedIdx = [...state.hospitals.keys()].reverse();
  const combined = [];
  orderedIdx.forEach(idx=>{
    const h = state.hospitals[idx];
    (h.periods || []).forEach(p=>{
      combined.push({type:'hospital', sortKey: parseInt(p.fromYear) || 0, data:{h, p}});
    });
  });
  // 【決定#39】computeGaps()は、developmental mode（生年からの形式）のときだけ
  // 「生年＋15歳（中学校卒業ごろ）〜最初の通院記録」という区間（phase1end__キー）を
  // 追加で返す。この区間は決定#33により理由確認フロー（findFirstUnansweredGap）の対象から
  // 除外されているため、一覧にそのまま出すと「理由が未確認」のバッジが解消する手段がないまま
  // 残り続けてしまう。さらに、この区間の有無はプレビュー画面の「初診／生年」切り替え
  // （state.outputMode）だけで決まるため、出力形式を切り替えただけで一覧の見た目が変わって
  // しまい混乱のもとになっていた（実利用者からの報告、2026-07-20）。Excel出力側
  // （buildPeriodsForForm・buildDevelopmentalGapNote）には必要な情報なのでcomputeGaps()自体は
  // 変更せず、画面表示（一覧・カウント）からだけ除外する。
  const gaps = computeGaps().filter(g => !isDevelopmentalLeadingGapKey(g.key));
  gaps.forEach(g=>{
    const m = (g.fromLabel || '').match(/\d+/);
    const y = m ? parseInt(m[0]) : 0;
    combined.push({type:'gap', sortKey: y + 0.5, data:g});
  });
  combined.sort((a,b)=>a.sortKey - b.sortKey);
  const rowsHtml = combined.map(item=>{
    if(item.type==='hospital'){
      const { h, p } = item.data;
      const fromLabel = `${p.fromYear || '?'}年${p.fromMonth || ''}`;
      const toLabel = p.ongoing ? '現在' : `${p.toYear || '?'}年${p.toMonth || ''}`;
      const name = h.nameUnknown ? `（病院名不明・${esc(h.hospitalType) || '種類不明'}）` : (esc(h.name) || '（未入力）');
      const relatedNote = (h.relatedEvents && h.relatedEvents.length)
        ? `<div class="small" style="margin-top:-6px;margin-bottom:8px;">手がかり：${h.relatedEvents.map(k=>esc(findEventLabel(k))).join('・')}</div>`
        : '';
      const memoNote = p.memo
        ? `<div class="small" style="margin-top:-6px;margin-bottom:8px;color:var(--ink-soft);">補足：${esc(p.memo)}</div>`
        : '';
      return `<div class="timeline-row"><span>${fromLabel}〜${toLabel}　${name}</span>${badgeForConfidence(p.confidence)}</div>${relatedNote}${memoNote}<div style="display:flex;gap:14px;margin:-4px 0 8px;"><button type="button" class="link-btn" data-edit-hospital="${h.hospitalId}" data-edit-period="${p.periodId}">この通院記録を修正する →</button><button type="button" class="link-btn" data-delete-hospital="${h.hospitalId}" data-delete-period="${p.periodId}" style="color:var(--danger);">削除する</button></div>`;
    }
    const g = item.data;
    const answered = isGapReasonAnswered(g.key);
    const statusBadge = answered
      ? '<span class="badge badge-good">理由を確認済み</span>'
      : '<span class="badge badge-warn">理由が未確認</span>';
    return `<div class="timeline-row gap"><span>${esc(g.fromLabel)}〜${esc(g.toLabel)}は、通院していない時期です</span>${statusBadge}</div>`;
  }).join('');

  const unansweredCount = gaps.filter(g=>!isGapReasonAnswered(g.key)).length;
  const gapStatusHtml = gaps.length===0
    ? ''
    : (unansweredCount > 0
        ? `<p class="hint" style="margin-top:12px;">通院していない時期が${gaps.length}件見つかりました。そのうち${unansweredCount}件、まだ理由を確認していません。</p>`
        : `<p class="small" style="margin-top:12px;color:var(--accent-strong);">通院していない時期について、理由の確認が済んでいます。</p>`);

  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>通院の記録が集まりました</h2>
      ${rowsHtml || '<p class="small">記録がありません</p>'}
      ${gapStatusHtml}
      <div class="edit-section" style="margin-top:18px;">
        <button type="button" id="addHospitalBtn" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--accent-strong);background:#fff;color:var(--accent-strong);font-size:15px;cursor:pointer;margin-bottom:10px;">病院を追加する</button>
        ${gaps.length>0 ? `<button type="button" id="reviewGapsBtn" style="width:100%;padding:12px;border-radius:8px;border:none;background:${unansweredCount>0 ? 'var(--accent-strong)' : '#fff'};color:${unansweredCount>0 ? '#fff' : 'var(--accent-strong)'};${unansweredCount===0 ? 'border:1px solid var(--accent-strong);' : ''}font-size:15px;cursor:pointer;margin-bottom:10px;">この内容で通院空白を確認する</button>` : ''}
      </div>
    </div>`;
  document.querySelectorAll('[data-edit-hospital]').forEach(btn=>{
    btn.onclick = ()=>{

  document.getElementById('addHospitalBtn').onclick = ()=>{

  const reviewBtn = document.getElementById('reviewGapsBtn');
  if(reviewBtn){

  }
  setFooter({secondaryLabel:'戻る', secondaryFn:goBack, primaryLabel:'第5章へ進む', primaryEnabled:true, primaryFn:()=>{

// ===== ch5_place（出来事カード配置画面・再設計版）=====
// 画面仕様書：ch5_place_再設計_画面仕様書.md（全14章）に準拠。
// 操作モデルは「選ぶ→行き先をタップ」の1パターンのみ（6章）。ドラッグ操作は使わない。

// 選択状態は state には持たせず、画面ローカル変数として保持する（6.2節：画面離脱時に解除）。
let placeSelectedKey = null; // 選択中の出来事カードのid。手札・年表どちらのカードでも同じ変数を使う。

// 帯内カード一覧を order の昇順で返す（13.1節・13.2節）。
function eventsInBand(bandIndex){
  return Object.keys(state.eventPlacements)
    .filter(k=>state.eventPlacements[k].bandIndex===bandIndex)
    .sort((a,b)=> state.eventPlacements[a].order - state.eventPlacements[b].order);
}

// 手札（未配置）の一覧。出来事カード（selectedEvents）と、過去編で「思い出したこと」に
// 置いた断片（pastFragments）の両方を対象にする。断片も出来事と同じ「選ぶ→行き先をタップ」
// で年表に配置できるようにするため（ch5_place再設計・断片統合）、両者を同じ手札として扱う。
// 表示順は「出来事→断片」、それぞれ内部では登録順を保つ。戻り値はfindEventObj()と同じ形
// {id, label, cardKind} に揃え、renderPlaceCard()側で種別の判定・表示を一箇所に統一する。
function eventsInHand(){
  const events = state.selectedEvents
    .filter(ev=>!state.eventPlacements[ev.id])
    .map(ev=>({...ev, cardKind:'event'}));
  const fragments = state.pastFragments
    .filter(f=>!state.eventPlacements[f.id])
    .map(f=>({id:f.id, label:f.text, cardKind:'fragment'}));
  return [...events, ...fragments];
}

// 指定の帯における次のorder値（末尾追加、13.2節）。
function nextOrderInBand(bandIndex){
  const keys = eventsInBand(bandIndex);
  if(keys.length===0) return 0;
  const maxOrder = Math.max(...keys.map(k=>state.eventPlacements[k].order));
  return maxOrder + 1;
}

// 出来事カードを指定の帯へ配置・移動する（末尾追加、13.2節）。手札からでも年表からでも同じ処理。
function placeEventToBand(key, bandIndex){
  state.eventPlacements[key] = { bandIndex, order: nextOrderInBand(bandIndex) };
}

// 出来事カードを手札へ戻す（年表からは消える、6.3節）。
function returnEventToHand(key){
  delete state.eventPlacements[key];
}

// 同じ帯の中の2枚の位置を交換する（6.4節・A方式：2枚だけ入れ替え、他は動かさない）。
function swapEventsInBand(keyA, keyB){
  const a = state.eventPlacements[keyA];
  const b = state.eventPlacements[keyB];
  if(!a || !b || a.bandIndex !== b.bandIndex) return;
  const tmp = a.order;
  a.order = b.order;
  b.order = tmp;
}

// 通院バーの区画を描画する。帯全体がその期間（3〜5年）を表す背景トラックで、
// 通院していた時期だけを実際の時間軸上の位置（left）・期間の長さ（width）で表す
// （左端寄せではなく、帯内での実際の時期の位置に配置する）。
// 文字が入らない幅なら色のみにする（4.4.2節）。
// 【病院期間分割】2026年7月確定：ch5年表では1本の連続バーのまま維持する
// （期間分割はch4＝申立書編集側の責務、ch5＝年表は位置関係の把握を優先するため）。
// periods[0].from〜periods[periods.length-1].toを使うだけで済み、描画ロジック自体は変更不要。
function renderHospitalBarRow(band){
  // 【決定#37補足・不具合A修正の続き】以前は病院ごとに`periods[0].from`〜`periods[最後].to`を
  // 1本の続いたバーとして描いていたため、決定#37で新たに検出できるようになった「periods間の
  // 隙間」がバーの上には一切反映されなかった（一覧・プレビューは直ったのに、年表のバーだけ
  // 隙間が無かったことになっていた）。period単位でセグメントを分けて描くことで、隙間がある
  // 場合はバーの上にもその分だけ空白ができるようにする。
  //
  // 【決定#38】上記の分割だけでは、periodの月が未入力（「覚えていない」等）のケースを
  // 救えなかった。境界の月はfromMonth||1／toMonth||12で補完しており、「2009年まで（月不明）」
  // →12月扱い、「2010年から（月不明）」→1月扱いになるため、月単位で見ると隙間の幅がゼロになり、
  // 一覧側（computeIntraHospitalGaps）は「隙間あり」と表示しているのに、バーだけ
  // 1本の続いた帯に見えてしまっていた。ここでは「隙間と認識されている境界」を一覧側と同じ
  // 基準（hasRecognizedGap()）で特定し、月の補完計算でゼロ幅になっていた場合だけ、最低限の空白を確保する。
  // 月が実際に入力されていて自然に隙間ができているケースには一切手を加えない。
  //
  // 【決定#40】決定#38は「同じ病院のperiods間」だけを対象にしていたが、現在のUIでは
  // 手動の「分割」操作が撤去されており、新規に病院を追加すると必ず新しいhospitalIdが
  // 振られる（1病院＝1期間）。そのため実運用で起きるのはむしろ「別の病院同士が月不明・
  // 年差1年」というケースの方が多く、決定#38はそちらを救えていなかった。
  // computeGaps()のinter-hospital判定（病院を最初のperiodのfromYearでソートし、隣り合う
  // 病院同士を比較）とまったく同じ基準・同じ並び順で、病院間の境界にも最低空白を確保する。
  // 「隙間と認識されない境界（例：同じ年内での転院）」には一切手を加えない点は決定#38と同じ。
  //
  // 【不具合修正・2026-07-22】上記の「隙間と認識されている境界」の判定自体を、年差のみの
  // 基準からhasRecognizedGap()（月が両方分かっていれば実際の月数、片方でも不明なら従来通り
  // 年差の基準）に統一した。月が両方判明している場合に、年をまたぐだけで実際には空白が
  // ほぼ無い境界（例：12月終了→翌1月開始）を誤って「隙間あり」と扱わなくなった。
  const bandMonths = Math.max(1, (band.endYear - band.startYear) * 12);
  const MIN_SEG_PCT = 2; // 帯の外に出ないための最小可視幅（従来通り）
  const MIN_GAP_PCT = 4; // 決定#38・#40：隙間と認識されている境界で最低限確保する空白

  function buildSegsForHospital(h){
    const name = h.nameUnknown ? (h.hospitalType || '通院') : (h.name || '通院');
    const periodsArr = h.periods || [];
    const hospitalSegs = []; // このbandに現れたセグメントを、periods配列の並び順のまま保持（隣接判定用）
    periodsArr.forEach((p, periodIndex)=>{
      const fromYear = parseInt(p.fromYear);
      if(!fromYear) return;
      const fromMonth = parseInt(p.fromMonth) || 1;
      const toYear = p.ongoing ? getCurrentYear() : (parseInt(p.toYear) || fromYear);
      const toMonth = p.ongoing ? (new Date().getMonth()+1) : (parseInt(p.toMonth) || 12);
      if(!(fromYear <= band.endYear && toYear >= band.startYear)) return; // この帯と重ならないperiodはスキップ
      // 帯の範囲に収まるようクリップしてから、月数ベースの比率（開始位置・幅）を出す。
      const segStartYear = Math.max(fromYear, band.startYear);
      const segEndYear = Math.min(toYear, band.endYear);
      const startOffsetMonths = Math.max(0, (segStartYear - band.startYear) * 12 + (segStartYear===fromYear ? fromMonth-1 : 0));
      const endOffsetMonths = Math.min(bandMonths, (segEndYear - band.startYear) * 12 + (segEndYear===toYear ? toMonth : 12));
      const leftPct = (startOffsetMonths / bandMonths) * 100;
      const widthPct = Math.max(MIN_SEG_PCT, ((endOffsetMonths - startOffsetMonths) / bandMonths) * 100);
      hospitalSegs.push({ periodIndex, name, leftPct, widthPct });
    });

    // 決定#38：一覧側（computeIntraHospitalGaps）と同じ基準（hasRecognizedGap()）で隙間と
    // 認識されている、隣り合うperiod同士の境界だけを対象に、最低限の空白を確保する。
    for(let i=0;i<hospitalSegs.length-1;i++){
      const a = hospitalSegs[i], b = hospitalSegs[i+1];
      if(b.periodIndex !== a.periodIndex + 1) continue; // このband内で隣接して現れたperiod同士のときだけ対象
      const olderPeriod = periodsArr[a.periodIndex];
      const newerPeriod = periodsArr[b.periodIndex];
      const olderToY = olderPeriod.ongoing ? null : parseInt(olderPeriod.toYear);
      const olderToM = olderPeriod.ongoing ? null : (parseInt(olderPeriod.toMonth) || null);
      const newerFromY = parseInt(newerPeriod.fromYear);
      const newerFromM = parseInt(newerPeriod.fromMonth) || null;
      const isRecognizedGap = hasRecognizedGap(olderToY, olderToM, newerFromY, newerFromM);
      if(isRecognizedGap) enforceMinGap(a, b);
    }
    return { hospitalSegs, firstPeriod: periodsArr[0], lastPeriod: periodsArr[periodsArr.length-1] };
  }

  function enforceMinGap(a, b){
    const actualGapPct = b.leftPct - (a.leftPct + a.widthPct);
    if(actualGapPct < MIN_GAP_PCT){
      const shaveEach = (MIN_GAP_PCT - actualGapPct) / 2;
      a.widthPct = Math.max(MIN_SEG_PCT, a.widthPct - shaveEach);
      b.leftPct = b.leftPct + shaveEach;
      b.widthPct = Math.max(MIN_SEG_PCT, b.widthPct - shaveEach);
    }
  }

  // 【決定#40】computeGaps()のinter-hospitalループと同じ並び順（最初のperiodのfromYear昇順）で
  // 病院を揃えてから、病院ごとのセグメントを組み立てる。
  const sortedHospitals = [...state.hospitals]
    .filter(h=>h.periods && h.periods.length && h.periods[0].fromYear)
    .sort((a,b)=> (parseInt(a.periods[0].fromYear)||0) - (parseInt(b.periods[0].fromYear)||0));

  const perHospital = sortedHospitals.map(buildSegsForHospital);

  // 病院同士の境界（前の病院の最後のセグメント〜次の病院の最初のセグメント）も、
  // computeGaps()のinter-hospital判定と同じ基準でチェックする。
  for(let i=0;i<perHospital.length-1;i++){
    const older = perHospital[i], newer = perHospital[i+1];
    if(older.hospitalSegs.length===0 || newer.hospitalSegs.length===0) continue; // このbandに現れていない病院は対象外
    const a = older.hospitalSegs[older.hospitalSegs.length-1];
    const b = newer.hospitalSegs[0];
    const olderToY = older.lastPeriod.ongoing ? null : parseInt(older.lastPeriod.toYear);
    const olderToM = older.lastPeriod.ongoing ? null : (parseInt(older.lastPeriod.toMonth) || null);
    const newerFromY = parseInt(newer.firstPeriod.fromYear);
    const newerFromM = parseInt(newer.firstPeriod.fromMonth) || null;
    const isRecognizedGap = hasRecognizedGap(olderToY, olderToM, newerFromY, newerFromM);
    if(isRecognizedGap) enforceMinGap(a, b);
  }

  const allSegs = perHospital.flatMap(h=>h.hospitalSegs);
  if(allSegs.length===0) return '';
  // 「通院」の2文字を表示できる幅の目安として8%未満は文字を諦める（4.4.2節）。
  const segsHtml = allSegs.map(s=>{
    const showLabel = s.widthPct >= 8;
    return `<div class="place-bar-seg place-bar-hospital" style="left:${s.leftPct}%;width:${s.widthPct}%;" title="${esc(s.name)}">${showLabel ? '通院' : ''}</div>`;
  });
  return `<div class="place-bar-row">${segsHtml.join('')}</div>`;
}

// 義務教育バーの区画を描画する（1本のバーの中に小学校・中学校を隣接区画として表示、4.4.1節）。
// 帯全体がその期間を表す背景トラックであることに合わせ、実際の在学時期の位置（left）で配置する。
function renderEducationBarRow(band){
  const segs = compulsoryEducationSegmentsInBand(band);
  if(segs.length===0) return '';
  const bandSpan = Math.max(1, band.endAge - band.startAge);
  const segsHtml = segs.map(seg=>{
    const segStart = Math.max(seg.startAge, band.startAge);
    const segEnd = Math.min(seg.endAge, band.endAge);
    const leftPct = ((segStart - band.startAge) / bandSpan) * 100;
    const widthPct = Math.max(2, ((segEnd - segStart) / bandSpan) * 100);
    const showLabel = widthPct >= 8;
    return `<div class="place-bar-seg place-bar-education" style="left:${leftPct}%;width:${widthPct}%;">${showLabel ? esc(seg.label) : ''}</div>`;
  }).join('');
  return `<div class="place-bar-row">${segsHtml}</div>`;
}

// 出来事カード・断片カード1枚分のHTML（手札・年表どちらでも共通、14章：横並び・折り返し）。
// cardKind==='fragment'の場合はplace-card-fragmentクラスを付け、点線境界線で
// 出来事カードと視覚的に区別する（過去編の断片統合）。
function renderPlaceCard(ev){
  const selected = placeSelectedKey === ev.id ? ' place-card-selected' : '';
  const kindClass = ev.cardKind === 'fragment' ? ' place-card-fragment' : '';
  return `<button type="button" class="place-card${kindClass}${selected}" data-event-id="${esc(ev.id)}">${esc(ev.label)}</button>`;
}

function renderCh5PlaceScreen(){
  const bands = buildAgeBands();

  // 西暦⇄元号切り替えボタン（4.6節：状態はstateに保持、押した状態は保持される）
  const eraBtn = document.getElementById('placeEraToggle');
  const isWareki = state.eraDisplayMode === 'wareki';
  eraBtn.textContent = isWareki ? '元号表示中' : '西暦表示中';
  eraBtn.classList.toggle('place-era-active', isWareki);
  eraBtn.onclick = ()=>{
    state.eraDisplayMode = isWareki ? 'seireki' : 'wareki';
    renderCh5PlaceScreen();
  };

  // ---- 年表（上2/3、独立スクロール） ----
  const timelineEl = document.getElementById('placeTimeline');
  timelineEl.innerHTML = bands.map((band, i)=>{
    const label = formatAgeBandLabel(band, isWareki);
    const hospitalBar = renderHospitalBarRow(band);
    const educationBar = renderEducationBarRow(band);
    const cardsHere = eventsInBand(i).map(k=>renderPlaceCard(findEventObj(k))).join('');
    return `
      <div class="place-band">
        <div class="place-band-label">${esc(label)}</div>
        <div class="place-band-body" data-band-index="${i}">
          ${hospitalBar}
          ${educationBar}
          <div class="place-card-group">${cardsHere}</div>
        </div>
      </div>`;
  }).join('');

  // ---- 出来事の手札（下1/3、独立スクロール） ----
  const handBodyEl = document.getElementById('placeHandBody');
  const handEvents = eventsInHand();
  const watermarkHtml = '<div class="place-hand-watermark">手札が残っていても<br>先へ進めます</div>';
  handBodyEl.innerHTML = watermarkHtml + (handEvents.length
    ? `<div class="place-card-group">${handEvents.map(renderPlaceCard).join('')}</div>`
    : '');

  bindCh5PlaceHandlers(bands);
}

// idから、出来事カードまたは断片カードのオブジェクトを見つける（ch5_place画面共通）。
// 断片（pastFragments）はlabelを持たないため、text（先頭を短く切ったもの）をlabel相当として
// 補う。どちらにも見つからない場合はfindEventLabel()のフォールバック表示に委ねる。
function findEventObj(id){
  const found = state.selectedEvents.find(ev=>ev.id===id);
  if(found) return {...found, cardKind:'event'};
  const fragment = state.pastFragments.find(f=>f.id===id);
  if(fragment) return {id, label: fragment.text, cardKind:'fragment'};
  return {id, label:findEventLabel(id), cardKind:'event'};
}

// 「選ぶ→行き先をタップ」の1パターンで全操作を表現する（6章）。
function bindCh5PlaceHandlers(bands){
  const timelineEl = document.getElementById('placeTimeline');
  const handBodyEl = document.getElementById('placeHandBody');

  // 帯本体のタップ（配置・移動・同帯内交換の行き先）
  timelineEl.querySelectorAll('.place-band-body').forEach(bandEl=>{
    const bandIndex = parseInt(bandEl.getAttribute('data-band-index'), 10);
    bandEl.classList.toggle('place-target-active', placeSelectedKey !== null);
    bandEl.onclick = (e)=>{
      // カード自体のクリックは個別ハンドラで処理するため、ここでは伝播を見て判定する
      const cardEl = e.target.closest('.place-card');
      if(cardEl){
        const clickedKey = cardEl.getAttribute('data-event-id');
        if(placeSelectedKey === null){
          // 1回目タップ：選ぶ
          placeSelectedKey = clickedKey;
          renderCh5PlaceScreen();
          return;
        }
        if(placeSelectedKey === clickedKey){
          // 選択中のカードをもう一度タップ→選択解除（6.2節）
          placeSelectedKey = null;
          renderCh5PlaceScreen();
          return;
        }
        // 別のカードをタップ：同じ帯なら交換、違う帯ならその帯への移動として扱う
        const selPlacement = state.eventPlacements[placeSelectedKey];
        if(selPlacement && selPlacement.bandIndex === bandIndex){
          swapEventsInBand(placeSelectedKey, clickedKey);
        } else {
          placeEventToBand(placeSelectedKey, bandIndex);
        }
        placeSelectedKey = null;
        renderCh5PlaceScreen();
        return;
      }
      // 帯の中の空いている場所をタップ：選択中カードをこの帯へ配置・移動
      if(placeSelectedKey !== null){
        placeEventToBand(placeSelectedKey, bandIndex);
        placeSelectedKey = null;
        renderCh5PlaceScreen();
      }
    };
  });

  // 手札エリアのタップ（タップ対象はエリア全体、6.3節）
  handBodyEl.classList.toggle('place-target-active', placeSelectedKey !== null);
  handBodyEl.onclick = (e)=>{
    const cardEl = e.target.closest('.place-card');
    if(cardEl){
      const clickedKey = cardEl.getAttribute('data-event-id');
      if(placeSelectedKey === null){
        placeSelectedKey = clickedKey;
      } else if(placeSelectedKey === clickedKey){
        placeSelectedKey = null;
      } else {
        // 手札の中の別カードをタップ：6.3節「そのカードを選ぶ」動作に切り替わる
        placeSelectedKey = clickedKey;
      }
      renderCh5PlaceScreen();
      return;
    }
    // 手札の空いている場所をタップ：選択中カードを手札へ戻す
    if(placeSelectedKey !== null){
      returnEventToHand(placeSelectedKey);
      placeSelectedKey = null;
      renderCh5PlaceScreen();
    }
  };
}

// =====================================================================
// ch5_preview：申立書の下書き確認（HTML申立書プレビュー画面仕様書v4）
// 役割：「病歴・就労状況等申立書が実際に完成していく様子」を体験する画面。
// 第1段階＝紙面再現を最優先（編集機能なし）。仕様書0章・2章を参照。
// 表示内容はexportToOfficialForm()と同じデータソース（state / buildCurrentPeriodRows等）
// から組み立てる。新規の集計ロジックは作らない（v3から継続する原則）。
// =====================================================================

// ---- 通院期間・通院していない期間の全件行（mainRows+continuationRows）を、
//      exportToOfficialForm()と同じ手順（buildCurrentPeriodRows→圧縮→割り振り）で取得する。
//      件数超過時（compressPastRowsIfNeeded()がエラーを返す場合）はエラー情報も返す。
function buildPreviewPeriodRows(){
  const currentRows = buildCurrentPeriodRows();
  const availableSlotsForPast = Math.max(0, 16 - currentRows.length);
  const compressed = compressPastRowsIfNeeded(availableSlotsForPast);
  if(compressed && compressed.error){
    return { rows: compressed.rows, error: compressed.message };
  }
  const { mainRows, continuationRows } = allocateRowsToMainAndContinuation(currentRows, compressed);
  // 【4.4対応】exportToOfficialForm()と同じ基準で、事前（プレビュー時点）にも枠超過を検知する。
  // ダウンロードボタンを押すまで気づけない状態を避け、プレビュー画面の時点で警告を出す。
  if(continuationRows.length > CONTINUATION_CAPACITY){
    return {
      rows: mainRows.concat(continuationRows),
      error: `通院記録・通院していない期間の件数が多く、書式の枠（16件）に${continuationRows.length - CONTINUATION_CAPACITY}件収まりません。`
    };
  }
  return { rows: mainRows.concat(continuationRows), error: null };
}

// ---- 元号セレクタ風表示（仕様書2.2節4番）。和暦が決まらない場合は実物のプレースホルダーを出す。 ----
function renderPreviewEraHtml(year){
  const [g] = yearToWareki(parseInt(year, 10));
  if(!g){
    return `<span class="pp-date-placeholder">元号を選んでください</span>`;
  }
  const eras = ['昭和','平成','令和'];
  return `<span class="pp-era">${eras.map(e=>`<span class="pp-era-opt${e===g ? ' pp-selected' : ''}">${e}</span>`).join('')}</span>`;
}

// ---- チェックボックス（□にレ点、仕様書2.2節3番）。labelは両方表示し、選ばれた方だけ強調する。 ----
function renderPreviewCheckboxPairHtml(labelA, checkedA, labelB, checkedB){

         `<span class="pp-checkbox${checkedB?' pp-checked':''}"><span class="pp-checkbox-box">レ</span>${esc(labelB)}</span>`;

// ---- 通院期間セクションのHTML（紙面本体用、年表のマス目）。全件表示・要約しない。 ----
function renderPreviewPeriodRowsHtml(rows){

    const toHtml = r.toKind==='none' ? `<span class="pp-blank">${esc(r.toLabel)}</span>` : `${renderPreviewEraHtml(r.toYear)}　${r.toYear?esc(yearToWareki(r.toYear)[1]):''}年　${r.toMonth||''}月まで`;
    const visitedHtml = r.fromKind==='none' ? '' : `<div style="margin-top:3px;">${renderPreviewCheckboxPairHtml('受診した', r.visited, '受診していない', !r.visited)}</div>`;
    const hospitalHtml = r.hospitalName ? `<div class="pp-period-hospital">${esc(r.hospitalName)}</div>` : (r.fromKind==='none' ? '' : `<div class="pp-period-hospital pp-blank">医療機関名</div>`);

// ---- ADL10項目の選択枠（丸数字、仕様書2.2節2番）。ADL_LEVELSの並び順＝実物の1〜4に対応。
//      この関数は現在欄（state.adl、現在形の文字列）・認定日欄（state.recognitionSnapshot.adl、
//      過去形の文字列）の両方から呼ばれるため、文字列そのものではなく、ADL_LEVEL_TO_NUMで
//      引いた番号同士で比較する（2026-08-01、過去形対応時に文字列比較のままだと認定日欄側の
//      丸数字が常に「未選択」表示になってしまう不具合を防ぐために修正）。 ----
function renderPreviewAdlGridHtml(adl){
  const items = ADL_ITEMS.map(([key,label])=>{
    const current = (adl||{})[key];
    const currentNum = ADL_LEVEL_TO_NUM[current];
    const numsHtml = ADL_LEVELS.map((level, idx)=>{
      const selected = currentNum === (idx+1);
      return `<span class="pp-adl-num${selected?' pp-selected':''}">${idx+1}</span>`;
    }).join('');
    return `<div class="pp-adl-item"><span class="pp-adl-item-label">${esc(label)}</span><span class="pp-adl-nums">${numsHtml}</span></div>`;
  }).join('');
  return `<div class="pp-adl-row">${items}</div>`;
}

// ---- 不就労理由（ア〜オの記号付き選択肢、仕様書6章）。NOTWORK_REASON_MAPの文字を使い、
//      実物の5択（ア・イ・ウ・エ・オ）にUI側8択を縮約して表示する（出力ロジックと同じ縮約）。 ----
const NOTWORK_REASON_DISPLAY = [
  ['ア','体力に自信がなかったから'],
  ['イ','医師から働くことを止められていたから'],
  ['ウ','働く意欲がなかったから'],
  ['エ','働きたかったが適切な職場がなかったから'],
  ['オ','その他']
];
// 2026-08-09バグ修正：UI側8択のうち「外に出られない」「人と関わるのがつらい」
// 「集中力・記憶力の問題」はオ（その他）に縮約されるが、以前はここで
// notWorkReasonOther（「その他」チェック時の自由記述欄）しか見ていなかったため、
// これらを選んでいてもプレビューには「具体的な理由を記入してください」という
// 空欄プロンプトが出てしまっていた（実際の申立書出力exportToOfficialForm()側は
// 選んだ理由の文言をそのままBC44セルに書き出しており、そちらは正しかった）。
// exportToOfficialForm()のotherNoteParts構築（880〜888行目）と全く同じロジックに
// 揃えることで、プレビューと実際の出力を一致させる。
function renderPreviewReasonListHtml(selectedReasons, reasonOther){
  const reasons = selectedReasons || [];
  const selectedLetters = new Set(reasons.map(r=>NOTWORK_REASON_MAP[r]).filter(Boolean));
  const otherNoteParts = [];
  reasons.forEach(reason=>{
    const letter = NOTWORK_REASON_MAP[reason] || 'オ';
    if(letter==='オ' && reason!=='その他') otherNoteParts.push(reason);
  });
  if(reasons.includes('その他') && reasonOther) otherNoteParts.push(reasonOther);

  const items = NOTWORK_REASON_DISPLAY.map(([letter,label])=>{
    const selected = selectedLetters.has(letter);
    let extra = '';
    if(letter==='オ' && selected){
      extra = otherNoteParts.length
        ? `（理由：${esc(otherNoteParts.join('・'))}）`
        : '（理由：<span class="pp-blank">具体的な理由を記入してください</span>）';
    }
    return `<div class="pp-reason-item${selected?' pp-selected':''}"><span class="pp-reason-letter">${letter}</span>${esc(label)}${extra}</div>`;
  }).join('');
  return `<div class="pp-reason-list">${items}</div>`;
}

// ---- 就労・生活状況セクション（認定日頃／現在、共通レイアウト）のHTML。
//      仕様書6章：縦書きラベル列＋就労状況の記入枠＋不就労理由のチェック枠＋ADL選択枠＋自由記述枠。
//      注意：work.statusの値形式は呼び出し元によって異なる（既存実装の実態）。
//      ・現在欄（state.work）：'working'/'leave'/'not_working'（ch1_work_statusの3択、英語コード）
//        実際の分岐はexportToOfficialForm()・stepCh2Intro()と同じ「'working'なら就労側、
//        それ以外（'leave'も含む）は不就労側」の二択（3874行目 if(status==='working')...else...）。
//      ・認定日欄（snap.work）：'仕事をしていた'/'仕事をしていなかった'（stepCh5Recognitionの2択、日本語文字列）
//      この関数は両方から呼ばれるため、どちらの値形式でも正しく判定できるようにする。 ----
function renderPreviewWorkSectionHtml(work, notWorkReasons, adl, otherChips, otherNote, notWorkReasonOther){
  work = work || {};
  const isWorking = work.status === '仕事をしていた' || work.status === 'working';
  const isNotWorking = work.status === '仕事をしていなかった' || work.status === 'leave' || work.status === 'not_working';

  const jobTypeHtml = isWorking
    ? (work.jobType ? esc(work.jobType) : '<span class="pp-blank">職種（仕事の内容）を記入してください。</span>')
    : '<span class="pp-blank">職種（仕事の内容）を記入してください。</span>';
  const commuteMethodHtml = isWorking
    ? (toLabelStrings(work.commute).length ? esc(toLabelStrings(work.commute).join('・')) : '<span class="pp-blank">通勤方法を記入してください。</span>')
    : '<span class="pp-blank">通勤方法を記入してください。</span>';
  const commuteTimeHtml = isWorking
    ? (work.commuteTime ? `${esc(work.commuteTime)}（片道）` : '<span class="pp-blank">通勤時間（片道）</span>')
    : '<span class="pp-blank">通勤時間（片道）</span>';
  const workDaysHtml = isWorking
    ? (work.workDays ? `${esc(work.workDays)}日` : '<span class="pp-blank">出勤日数を記入してください。</span>')
    : '<span class="pp-blank">出勤日数を記入してください。</span>';
  const conditionHtml = isWorking
    ? (toLabelStrings(work.condition).length ? esc(toLabelStrings(work.condition).join('・')) : '<span class="pp-blank">仕事中や仕事が終わった時の身体の調子について記入してください。</span>')
    : '<span class="pp-blank">仕事中や仕事が終わった時の身体の調子について記入してください。</span>';
  const reasonListHtml = renderPreviewReasonListHtml(isNotWorking ? notWorkReasons : [], notWorkReasonOther);

  let otherText = toLabelStrings(otherChips||[]).join('・');
  if(otherNote){ otherText = otherText ? (otherText + '／' + otherNote) : otherNote; }
  const otherHtml = otherText ? esc(otherText) : '<span class="pp-blank">その他日常生活で不便に感じたことがありましたら記入してください。</span>';

  return `
    <div class="pp-block">
      <div class="pp-label">就労状況</div>
      <div class="pp-body">
        <div class="pp-row"><div class="pp-row-label">職種</div><div class="pp-row-value">${jobTypeHtml}</div></div>
        <div class="pp-row"><div class="pp-row-label">通勤方法</div><div class="pp-row-value">${commuteMethodHtml}</div></div>
        <div class="pp-row"><div class="pp-row-label">通勤時間</div><div class="pp-row-value">${commuteTimeHtml}</div></div>
        <div class="pp-row"><div class="pp-row-label">出勤日数</div><div class="pp-row-value">${workDaysHtml}</div></div>
        <div class="pp-row"><div class="pp-row-label">仕事中・終わった後の体の調子</div><div class="pp-row-value">${conditionHtml}</div></div>
        <div class="pp-row"><div class="pp-row-label">仕事をしていなかった理由</div><div class="pp-row-value">${reasonListHtml}</div></div>
      </div>
    </div>
    <div class="pp-block">
      <div class="pp-label">日常生活状況</div>
      <div class="pp-body">
        <div class="pp-row"><div class="pp-row-value">${renderPreviewAdlGridHtml(adl)}</div></div>
        <div class="pp-row"><div class="pp-row-label">その他</div><div class="pp-row-value">${otherHtml}</div></div>
      </div>
    </div>`;
}

// ---- 障害者手帳セクションのHTML（仕様書6章：種類チップは身・精・療・他の略字表現＋等級＋交付年月日＋障害名）。 ----
function renderPreviewNotebookSectionHtml(){
  const nb = state.disabilityNotebook;
  if(!nb || !nb.enabled){
    return `<div class="pp-row"><div class="pp-row-label">交付状況</div><div class="pp-row-value"><span class="pp-blank">未入力（任意）</span></div></div>`;
  }
  const typeShortMap = {'身体障害者手帳':'身','精神障害者保健福祉手帳':'精','療育手帳':'療','その他':'他'};
  const typesHtml = ['身','精','療','他'].map(short=>{
    const selected = typeShortMap[nb.type] === short;
    return `<span class="pp-notebook-type-opt${selected?' pp-selected':''}">${short}</span>`;
  }).join('');
  const dateHtml = (nb.acquiredKind && nb.acquiredKind!=='none' && nb.acquiredYear)
    ? `${renderPreviewEraHtml(nb.acquiredYear)}　${esc(yearToWareki(parseInt(nb.acquiredYear,10))[1])}年${nb.acquiredMonth?`　${nb.acquiredMonth}月`:''}${nb.acquiredDay?`　${nb.acquiredDay}日`:''}`
    : `<span class="pp-date-placeholder">元号を選んでください</span>`;
  const gradeHtml = nb.grade ? esc(nb.grade) : '<span class="pp-blank">（　級）</span>';
  const nameHtml = nb.disabilityName ? esc(nb.disabilityName) : '<span class="pp-blank">障害名</span>';
  return `
    <div class="pp-row"><div class="pp-row-label">手帳の種類</div><div class="pp-row-value"><span class="pp-notebook-types">${typesHtml}</span>${nb.type==='その他'&&nb.otherTypeName?`（${esc(nb.otherTypeName)}）`:''}</div></div>
    <div class="pp-row"><div class="pp-row-label">交付年月日</div><div class="pp-row-value">${dateHtml}（${gradeHtml}）</div></div>
    <div class="pp-row"><div class="pp-row-label">障害名</div><div class="pp-row-value">${nameHtml}</div></div>`;
}
