<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>認定日ごろの生活状況をふりかえる（入口）</title>
<style>
:root{
  --bg:#171B26;
  --card:#1F2433;
  --ink:#E7E6E0;
  --ink-soft:#9A9CA8;
  --line:#2E3446;
  --accent:#8087D8;
  --accent-soft:#262A45;
  --accent-strong:#C0C4F5;
  --neutral-soft:#232838;
}
*{box-sizing:border-box;}
.era-badge{text-align:center;font-size:12px;font-weight:600;letter-spacing:0.02em;color:var(--accent-strong);background:var(--accent-soft);padding:7px 10px;}
body{
  margin:0;background:var(--bg);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;
  color:var(--ink);line-height:1.7;
}
#app-shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
main{flex:1;padding:20px 20px 24px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;}
h1{font-size:19px;font-weight:500;margin:0 0 10px;}
p.lead{color:var(--ink-soft);font-size:14px;margin:0 0 18px;}
/* hub専用: 項目一覧を表示する分、他画面のオープニングより低めの高さにしている。
   shared/opening_screen.cssの56vhとは意図的に異なる値なので、ここだけ個別に残す。 */
.opening-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;text-align:center;padding:10px;}
/* shared/chick_widget.js（🐥のセリフ吹き出し）に対応する見た目。
   文言を一切含まない「動くしくみ」の見た目だけを置く（.jsと同じ方針）。
   現在版(genzai)・認定日版(ninteibi)の両方、およびhub.html含む全画面から共有される。
   中身を直すときはこのファイル（shared/chick_widget.css）を編集し、
   `npm run build`（`npm test`はbuildしてから実行される）で各HTMLに反映すること。 */
.opening-hiyoko{font-size:28px;margin-bottom:16px;animation:openingBreathe 4s ease-in-out infinite;}
@keyframes openingBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
.opening-bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;font-size:15.5px;line-height:3.2;text-align:center;cursor:pointer;width:280px;}
.opening-bubble::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:9px solid var(--card);}
.opening-sizer{visibility:hidden;}
.opening-text-overlay{position:absolute;top:22px;left:22px;right:22px;}
.progress-note{font-size:13px;color:var(--ink-soft);text-align:center;margin:22px 0 16px;}
.hub-permission-note{font-size:13.5px;color:var(--ink);font-weight:600;text-align:center;margin:0 4px 16px;line-height:1.6;}
.hub-note{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:0 4px 20px;line-height:1.7;}
.item-list{display:flex;flex-direction:column;gap:10px;}
a.hub-item, div.hub-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);text-decoration:none;font-size:14.5px;
}
a.hub-item:hover{border-color:var(--accent);}
a.hub-item .hub-item-status{font-size:12px;color:var(--accent-strong);display:inline-flex;align-items:center;gap:5px;}
.hub-item-num{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--accent-soft);color:var(--accent-strong);font-size:10.5px;font-weight:700;}
div.hub-item-disabled{opacity:.45;cursor:not-allowed;}
div.hub-item-disabled .hub-item-status{font-size:11px;color:var(--ink-soft);}
.hub-top-bar{padding:14px 20px 0;}
button.btn{padding:12px 16px;border-radius:12px;border:none;font-size:14px;font-weight:500;cursor:pointer;}
button.btn-secondary{background:var(--card);border:1px solid var(--line);color:var(--ink);}
button.btn:disabled{opacity:.45;cursor:not-allowed;}
</style>
</head>
<body>
<div id="app-shell">
  <div class="era-badge">認定日（当時）について</div>
  <div class="hub-top-bar"><button type="button" class="btn btn-secondary" id="btnBackToIndex">
      &larr; 申立書サポートに戻る</button></div>
  <main><div class="card" id="screen-root"></div></main>
</div>

<!-- 【2026-07-31】この画面は src/genzai/hub.src.html を元に、認定日版(ninteibi)向けに
     以下の点だけを書き換えて作成した（段取り・詳細は 00_索引.md「認定日版(ninteibi)の中身作成」参照）。
       ・ADL_ITEMSの並び順・キー名・遷移先ファイル名：無変更（genzai側と同じ10項目・同じ順序）
       ・OPENING_MESSAGE・タイトルを「認定日ごろ」の文脈に書き換え（各itemファイルと同じ言い回し）
       ・HANDOFF_KEYを 'adl_handoff_ninteibi_v1' に変更（genzai側のデータと混ざらないようにするため）
       ・hub-noteの文言から「本体index.htmlに戻ると取り込める」という記述を削除した。
         本体index.html側（stepCh5Recognitionへの「取り込む」導線）との連携は未実装（次回以降の
         スコープ）であり、まだ存在しない機能をあるかのように書かないため（決定#44と同じ考え方）。
         「この端末に保存される」という、今回時点でも事実である部分だけを案内する。
       ・「← 申立書サポートに戻る」の遷移先（../../../index.html）：無変更
         （pages/ninteibi/hub.html から見た相対階層はpages/genzai/hub.htmlと同じ深さのため）。 -->
<script>
// ---- ADLハブ画面（認定日版） ----
// genzai側のhub.src.htmlと同じ構造・同じ10項目。「いつの時期を振り返るか」だけが違う。
var ADL_ITEMS = [
  ['dressing','着替え','dressing.html'],
  ['toilet','トイレ','toilet.html'],
  ['eating','食事','eating.html'],
  ['cooking','炊事', 'cooking.html'],
  ['cleaning','掃除', 'cleaning.html'],
  ['washingFace','洗面', 'washing_face.html'],
  ['bathing','入浴', 'bathing.html'],
  ['walking','散歩', 'walking.html'],
  ['laundry','洗濯', 'laundry.html'],
  ['shopping','買物', 'shopping.html']
];

var HANDOFF_KEY = 'adl_handoff_ninteibi_v1';
function readHandoff(){
  try{
    var raw = localStorage.getItem(HANDOFF_KEY);
    var data = raw ? JSON.parse(raw) : {};
    return (data && typeof data==='object') ? data : {};
  }catch(e){ return {}; }
}

// ---- 🐥のセリフ吹き出し部品（shared/chick_widget.js、genzai側と共通） ----
// OPENING_MESSAGEは認定日版(ninteibi)固有の文言。genzai側のhub.src.htmlとは別の文言。
var OPENING_MESSAGE = 'ようこそ。\n今回は「認定日ごろ（初診から１年６か月ごろ）」の生活を、少しずつ思い出していきます。';
// ---- 🐥のセリフ吹き出し（共通部品）。枠は最終文の全文サイズで最初から固定し、
//      タイプライター中も枠が動かないようにする。タップで即座に全文表示できる。
//      現在版(genzai)・認定日版(ninteibi)の両方から共有される、文言を一切含まない
//      「動くしくみ」だけを置く（2026-07-25、階層設計の合意により、以前ここにあった
//      OPENING_MESSAGEは各era（genzai/ninteibi）のsrc側に移した。認定日版では
//      「あなたの普段の生活の詰まりを…」ではなく別の文言になるため、文言そのものを
//      shared/に置くと2つのeraで使い回せなくなるため）。
//      中身を直すときはこのファイル（shared/chick_widget.js）を編集し、
//      `npm run build`（`npm test`はbuildしてから実行される）で各HTMLに反映すること。 ----
var chickTyping = false;
var chickInterval = null;

function chickBubbleHtml(idPrefix, message){
  return '<div class="opening-bubble" id="'+idPrefix+'Bubble">'+
      '<div class="opening-sizer" aria-hidden="true">'+message.split('\n').join('<br>')+'</div>'+
      '<div class="opening-text-overlay" id="'+idPrefix+'Text"></div>'+
    '</div>';
}

function wireChickBubble(idPrefix, message, onDone){
  var bubble = document.getElementById(idPrefix+'Bubble');
  var textEl = document.getElementById(idPrefix+'Text');
  bubble.addEventListener('click', function(){
    if(chickTyping){
      clearInterval(chickInterval);
      textEl.innerHTML = message.split('\n').join('<br>');
      chickTyping = false;
      if(onDone){ onDone(); }
    }
  });
  textEl.innerHTML = '';
  var i = 0;
  chickTyping = true;
  chickInterval = setInterval(function(){
    if(i < message.length){
      textEl.innerHTML += (message[i] === '\n' ? '<br>' : message[i]);
      i++;
    } else {
      clearInterval(chickInterval);
      chickTyping = false;
      if(onDone){ onDone(); }
    }
  }, 55);
}

function renderItemList(){
  var handoff = readHandoff();
  var doneCount = ADL_ITEMS.filter(function(it){ return !!handoff[it[0]]; }).length;

  // 本体index.htmlのADL_LEVEL_TO_NUMと同じ数字を使う（genzai側のhub.src.htmlと同じ理由）。
  // 2026-08-01：実テンプレート02.xlsxの認定日欄が過去形表記だったため、各項目のLEVELSも
  // 過去形（できた/できたが援助が必要だった/できないが援助があればできた/できなかった）に
  // 変更した。ここもそれに合わせて更新（本体側ADL_LEVEL_TO_NUMの過去形キーと同じ対応）。
  var LEVEL_TO_NUM = {'できた':1, 'できたが援助が必要だった':2, 'できないが援助があればできた':3, 'できなかった':4};

  var html = '<div class="progress-note">10項目中 '+doneCount+'項目 完了（'+doneCount+'/'+ADL_ITEMS.length+'）</div>';
  html += '<p class="hub-permission-note">一度に全部やらなくても大丈夫です。気になるものだけ、途中まででも大丈夫です。</p>';
  html += '<p class="hub-note">ここでの記録は、この端末に保存されます。次に開いたときも、続きから見られます。</p>';
  html += '<div class="item-list" id="hubItemList">';
  ADL_ITEMS.forEach(function(it){
    var key = it[0], label = it[1], url = it[2];
    var done = !!handoff[key];
    if(url){
      var statusInner;
      if(done){
        var num = LEVEL_TO_NUM[handoff[key]];
        var numBadge = num ? '<span class="hub-item-num">'+num+'</span>' : '';
        statusInner = numBadge+handoff[key];
      } else {
        statusInner = '未着手';
      }
      html += '<a class="hub-item" href="'+url+'?from=hub" data-key="'+key+'">'+label+
        '<span class="hub-item-status">'+statusInner+'</span></a>';
    } else {
      html += '<div class="hub-item hub-item-disabled" data-key="'+key+'">'+label+
        '<span class="hub-item-status">（準備中）</span></div>';
    }
  });
  html += '</div>';
  return html;
}

function render(){
  var root = document.getElementById('screen-root');
  root.innerHTML =
    '<div class="opening-wrap">'+
      '<div class="opening-hiyoko">🐥</div>'+
      chickBubbleHtml('opening', OPENING_MESSAGE)+
    '</div>'+
    '<div id="hubBelowIntro" style="display:none;">'+renderItemList()+'</div>';
  wireChickBubble('opening', OPENING_MESSAGE, function(){
    var below = document.getElementById('hubBelowIntro');
    if(below){ below.style.display = 'block'; }
  });
}

render();

// 「← 申立書サポートに戻る」：2026-08-04、genzai版と同じ理由でタブを閉じるだけにする
// （index.html側の別タブ化＋visibilitychange自動反映と一貫させ、「続きから／最初から」
// 確認画面を経由させないため）。window.close()が無視される環境向けのフォールバックとして
// 従来どおりindex.htmlへ遷移する処理も残す（詳しい経緯はgenzai/hub.src.html参照）。
document.getElementById('btnBackToIndex').addEventListener('click', function(){
  window.close();
  if(window.closed) return; // 閉じられた場合はここで終了（実ブラウザでの通常ケース）
  try {
    // pages/ninteibi/hub.html から見て、リポジトリ直下のindex.htmlへは3階層上がる
    // （ninteibi→pages→seikatsu-jokyo→リポジトリ直下。genzai側と同じ深さ）。
    window.location.href = '../../../index.html';
  } catch(e) {
    // 一部環境（jsdomでのテスト実行時など）向けの保険。詳しい経緯はgenzai/hub.src.html参照
  }
});
</script>
</body>
</html>
